    ruling: hold off entirely
    note: >-
      Ceponas is not seated premarket or market-hours until his book is fully ready. His method
      needs live order-book depth and Time & Sales speed, neither of which exists premarket, so
      seating him on a narrowed premarket canon was rejected rather than left half-served.
