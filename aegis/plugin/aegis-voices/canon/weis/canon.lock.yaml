  D2_close_location_value_field:
    ruling: APPROVED — add (close-low)/(high-low) to the export.
    note: >-
      Filed as an engine ticket. Cheapest high-value field in the backlog: unblocks R8 (upthrust
      confirmation, Weis's single most-used primitive) and also serves wyckoff, raschke and
      elder-lens. R8 stays NOT_AVAILABLE until the engine ships it.
