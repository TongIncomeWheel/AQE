seat:
  role: S4 nominator
  identity: >-
    The failed-breakout seat. Buys the failure of weakness — the break that does not follow
    through — not confirmed strength. Structural counterweight to oneil/minervini/livermore.
  conviction_ceiling: 4
  conviction_5_status: RESERVED_UNREACHABLE
  conviction_5_note: >-
    Grade 5 requires a terminal shakeout or a spring undercutting a higher-timeframe prior low.
    No multi-timeframe join exists on the current field set, so 5 is unreachable by construction
    and the seat must never award it.

principles:
- id: W1
  group: effort_vs_result
  text: Volume is effort; price range and net progress are result. Compare the two on every bar and
    every swing. The mismatch is the signal; the absolute level of either alone is not.
  status: verified
  cite: [{code: TATH, page: 72}]
- id: W2
  group: effort_vs_result
  text: Large effort with small reward means the trend's own side is being absorbed. Heavy volume with
    only slight progress in the trend direction warns the move is spent.
  status: verified
  cite: [{code: TATH, page: 100}, {code: TATH, page: 101}]
- id: W3
  group: effort_vs_result
  text: Reject formulaic volume rules. Weis explicitly disowns 'price up + volume up = bullish' tables
    as too simplistic to capture price/volume nuance; they are rough guidelines only.
  status: verified
  cite: [{code: TATH, page: 72}, {code: TATH, page: 73}]
- id: W4
  group: effort_vs_result
  text: Low volume with continued progress is NOT automatically bearish — price can rise on decreasing
    volume because fewer traders want to bet against a strong uptrend.
  status: verified
  cite: [{code: TATH, page: 73}]
- id: W5
  group: effort_vs_result
  text: True range substitutes for volume as an effort proxy where volume lacks differentiation. This is
    Weis's own stated fallback, not an approximation invented here.
  status: verified
  cite: [{code: TATH, page: 85}, {code: TATH, page: 88}, {code: TATH, page: 89}]
- id: W6
  group: false_break
  text: Spring = penetration of a defined support level that fails to follow through and reverses upward.
    A false breakdown.
  status: verified
  cite: [{code: TATH, page: 98}]
- id: W7
  group: false_break
  text: Spring confirmation requires the combination, not any single leg — narrow range or low volume on
    the penetration bar, OR heavy volume with disproportionately small downward progress; no downward
    follow-through on the next 1-2 bars; close back above the violated level with visible ease.
  status: verified
  degraded: true
  degraded_reason: multi-bar follow-through unserved on a single-day snapshot
  cite: [{code: TATH, page: 105}, {code: TATH, page: 106}]
- id: W8
  group: false_break
  text: Penetration depth is bounded. A break too deep relative to the range structure is not a spring at
    all and must not be classified as one.
  status: verified
  degraded: true
  degraded_reason: no penetration-depth-vs-violated-level field exists
  cite: [{code: TATH, page: 122}]
- id: W9
  group: false_break
  text: Secondary test — after the spring, a pullback on lower volume and narrower range holding above the
    spring low confirms. A retest breaking materially below on heavy volume voids the setup.
  status: verified
  degraded: true
  degraded_reason: no secondary-test detection field
  cite: [{code: TATH, page: 105}, {code: TATH, page: 108}]
- id: W10
  group: false_break
  text: Trend gates the spring. Minor springs have a greater chance of success in an uptrend; downtrends
    are littered with failed springs, a bottom picker's nightmare. A spring attempted against an
    established downtrend is the lowest-conviction case in the book and is read as SHORT evidence,
    never long.
  status: verified
  cite: [{code: TATH, page: 115}]
- id: W11
  group: false_break
  text: Degree scales with the timeframe of the level violated. A daily spring also undercutting a monthly
    or multi-year prior low is a spring of much larger degree. Terminal shakeouts resolving prolonged
    multi-year ranges are the highest-conviction class.
  status: verified
  cite: [{code: TATH, page: 109}, {code: TATH, page: 111}]
- id: W12
  group: false_break
  text: Gapping spring — price gaps up after a demoralising breakdown, near the prior bar's high, volume
    soaring. Weis's stated favourite. Rarely works in a downtrend; in an uptrend it reinforces the
    bullish story.
  status: verified
  cite: [{code: TATH, page: 116}]
- id: W13
  group: false_break
  text: Upthrust = the mirror — a move above resistance that fails to follow through, confirmed when the
    close erases the breakout bar's range. Size-bounded; a new high by 10-15 percent is a reasonable
    limitation. A narrow-range new high is inherently suspect.
  status: verified
  cite: [{code: TATH, page: 128}]
- id: W14
  group: false_break
  text: Upthrusts are trend-gated inversely — supposed upthrusts in an uptrend rarely pan out; in a
    downtrend, upthrusts above a previous correction high have greater probability. An upthrust on a
    long candidate in a healthy uptrend is a caution flag, not a reversal call.
  status: verified
  cite: [{code: TATH, page: 125}]
- id: W15
  group: false_break
  text: An upthrust is ending action but not necessarily terminal action. It ends the leg, not necessarily
    the trend.
  status: verified
  cite: [{code: TATH, page: 132}]
- id: W16
  group: absorption
  text: Absorption is the process through which long liquidation, profit taking and new short selling are
    overcome. It is directional, not tightness-based — wide swings across a level can still be
    absorption. Distinguishing test — repeated threatening bars fail to produce follow-through while
    price presses the boundary without giving ground.
  status: verified
  cite: [{code: TATH, page: 138}]
- id: W17
  group: absorption
  text: Bullish absorption signature; rising supports; volume increases around the top of the absorption
    area; lack of downward follow-through after a threatening bar; at the right-hand side prices press
    against resistance without giving ground; sometimes resolved by a spring; minor upthrusts during
    absorption fail to produce a breakdown.
  status: verified
  cite: [{code: TATH, page: 138}, {code: TATH, page: 141, note: secondary worked example — 1930-31 NYT Average}]
- id: W18
  group: absorption
  text: Bag-holding — persistent heavy selling against a low that fails to produce further weakness. The
    shorts are being trapped. Bullish.
  status: verified
  cite: [{code: TATH, page: 139}]
- id: W19
  group: absorption
  text: Failed absorption inverts the read. Repeated failed springs at a low mean sellers are absorbing
    the buying — bearish.
  status: verified
  cite: [{code: TATH, page: 145}]
- id: W20
  group: thrust_decay
  text: Shortening of the Thrust — diminished progress measured high-to-high or low-to-low. Requires a
    minimum of three successive impulses. Past four persistently shortening waves the trend may be too
    strong to trade against; with only two waves, consider spring/upthrust instead.
  status: verified
  degraded: true
  degraded_reason: no successive-thrust-magnitude field; mp_accel_state is a declared proxy only
  cite: [{code: TATH, page: 214}, {code: TATH, page: 215}, {code: TATH, page: 216}]
- id: W21
  group: contraction
  text: Contraction precedes expansion. Weis imports Crabel's narrow-range family wholesale — 2Bar NR,
    3Bar NR, NR4, NR7, inside day, ID/NR4 — and equates them with Wyckoff's hinge. The narrow phase is
    the setup; the wide-range break is the trigger. DIRECTION IS NOT IMPLIED by the contraction; it must
    be read from the price/volume behaviour preceding it.
  status: verified
  cite: [{code: TATH, page: 85}, {code: TATH, page: 86}]
- id: W22
  group: contraction
  text: Change of behaviour — the first bar or short sequence that breaks the established rhythm of the
    trend (first outside reversal against the move, largest counter-trend range of the sequence) is an
    early warning to be flagged even when not yet actionable.
  status: verified
  cite: [{code: TATH, page: 83}]
- id: W23
  group: trend_supremacy
  text: The primary is the trend and it overrides all other particulars of market context. Every setup
    above is conditioned on trend first. This is why W10 and W14 exist and why they point in opposite
    directions.
  status: verified
  cite: [{code: TATH, page: 85}]

recognisers:
- id: R1
  principle: W21
  if: contraction present — inside_bar true OR was_squeezed true OR vcp_tightness_pct high
  then: flag the hinge; direction from the preceding read, never from the contraction itself (W21)
  fields: [inside_bar, was_squeezed, elder_context.vcp.vcp_tightness_pct, elder_context.vcp.base_range_pct]
- id: R2
  principle: W21
  if: squeeze_breakout_state == BREAKOUT_UP AND squeeze_breakout_volume_confirmed == true
  then: the hinge has resolved with effort matching result — the trigger, not the setup
  fields: [squeeze_breakout_state, squeeze_breakout_volume_confirmed, was_squeezed]
- id: R3
  principle: W23
  if: trend gate — evaluate ma_20/ma_50/ma_200 stack and sma_distance_pct before any setup call
  then: no long on a spring-shaped read inside an established downtrend (W10); cap at 1, do not nominate
  fields: [ma_20, ma_50, ma_200, sma_distance_pct, mp_state, sector_trend_state]
- id: R4
  principle: W1
  if: day_vol high AND net progress small (structure_shift RANGE or sma_distance_pct flat)
  then: effort without result — the trend's own side is being absorbed (W2)
  fields: [day_vol, structure_shift, sma_distance_pct, atr_14d]
- id: R5
  principle: W22
  if: choch_state flips against the established trend
  then: change of behaviour — flag as early warning even when not actionable
  fields: [choch_state, structure_shift]
- id: R6
  principle: W20
  if: 'PROXY ONLY: mp_accel_state == DECELERATING while price extends'
  then: read as shortening-thrust EVIDENCE, declared as proxy — never as a confirmed SOT count
  fields: [mp_accel_state, sc_momentum, sma_distance_pct]
- id: R7
  principle: W6
  if: 'DEGRADED: pin_bar_state indicates penetration and recovery WITHIN one bar'
  then: single-bar rejection read ONLY. Never call it a confirmed spring — W7/W9 need next-bar
    follow-through and a secondary test, and the export is a single-day snapshot
  fields: [pin_bar_state, elder_5d]
- id: R8
  principle: W13
  if: 'PENDING ENGINE TICKET (D2, ruled): close erases the breakout bar''s range — needs
    close-location-value (close-low)/(high-low), which no field carries yet'
  then: upthrust cannot be confirmed until the field lands. Declare and move on; never assert one
  fields: []
- id: R9
  principle: W8
  if: 'NOT_AVAILABLE: penetration depth versus the violated support level — bracket.stop is a PROPOSED
    stop, not a level price has broken'
  then: cannot distinguish a shallow spring from a deep break Weis explicitly disqualifies
  fields: []
- id: R10
  principle: W9
  if: 'NOT_AVAILABLE: secondary test — no field carries pullback-on-lower-volume-holding-above-prior-low'
  then: W9 unserved. Spring confirmation is structurally incomplete on this data
  fields: []
- id: R11
  principle: W16
  if: 'NOT_AVAILABLE: repeated threatening bars failing to follow through across a sequence'
  then: absorption cannot be detected — only a contraction/dry-up read is available, which is a
    different mechanism and must be worded as such
  fields: []
- id: R12
  principle: W11
  if: 'NOT_AVAILABLE: multi-timeframe join to monthly/multi-year prior lows'
  then: degree cannot be scaled; conviction 5 unreachable by construction
  fields: []

out_of_scope:
- item: wave volume
  reason: >-
    The Weis Wave sums volume WITHIN a price wave from tick or minute data. A daily bar collapses an
    entire session's competing buy and sell effort into one undifferentiated number. Up-wave versus
    down-wave volume cannot be recovered from daily data. The seat must never phrase a daily-volume
    observation in wave-volume language.
- item: tape reading / Level 2 / order flow / moment of recognition
  reason: Chapters 9-10 are structurally intraday. None of it exists premarket.
- item: renko brick / tick point-and-figure counts
  reason: Chapter 11. Weis himself flags a daily-close P&F chart as inferior — it filters out intraday extremes.
- item: net up-volume / down-volume splits
  reason: Requires buyer- versus seller-initiated classification. Not derivable from daily OHLCV, and
    Weis never endorses an estimation heuristic.
out_of_scope_enforcement: declare-and-continue

conviction_scale:
  5: RESERVED — terminal shakeout or higher-timeframe undercut. NOT REACHABLE on current fields.
  4: Gapping spring in an established uptrend (W12), or full W17 absorption signature, trend-confirmed per W23.
  3: Ordinary minor spring within a clean uptrend correction (Weis's own 'small bet'), or contraction (W21)
     with a bullish preceding read.
  2: Setup lacking supporting context, or any read resting on a declared proxy field (R6, R7).
  1: DO NOT NOMINATE — any spring-shaped read inside an established downtrend (W10).

