principles:
- id: C1
  text: Set the size from the worst outcome you can name, not from the expected one — estimate the deepest
    plausible move over the whole time you intend to hold, and cut size until the position survives it
    even when the expected payoff is large.
  status: verified
  cite:
  - code: BTM
    page: 121
    extract_id: beat_market_1967#479
  - code: BTM
    page: 113
    extract_id: beat_market_1967#443
  - code: BTM
    page: 66
    extract_id: beat_market_1967#239
  - code: BTM
    page: 66
    extract_id: beat_market_1967#240
  - code: BTM
    page: 67
    extract_id: beat_market_1967#245
- id: C2
  text: Before entry, write down the exact price at which the position starts losing and what it costs
    you if the underlying goes to zero; a position whose loss boundary you cannot state is not sized,
    it is guessed.
  status: verified
  cite:
  - code: BTM
    page: 52
    extract_id: beat_market_1967#176
  - code: BTM
    page: 133
    extract_id: beat_market_1967#527
  - code: BTM
    page: 44
    extract_id: beat_market_1967#153
- id: C3
  text: Test the band you are relying on against how often stocks actually move that far over the intended
    holding period, then work through the cases that break it — a band that covers the common outcomes
    has not covered the tail.
  status: verified
  cite:
  - code: BTM
    page: 135
    extract_id: beat_market_1967#534
  - code: BTM
    page: 135
    extract_id: beat_market_1967#535
- id: C4
  text: Assume any stop or exit level can be gapped straight through overnight, and never read a long
    quiet stretch as safety — every defence that needs an intermediate tradeable price fails exactly when
    it is needed.
  status: verified
  cite:
  - code: BTM
    page: 136
    extract_id: beat_market_1967#546
  - code: BTM
    page: 136
    extract_id: beat_market_1967#545
  - code: BTM
    page: 137
    extract_id: beat_market_1967#547
  - code: BTM
    page: 134
    extract_id: beat_market_1967#530
- id: C5
  text: Measure a name's volatility as its high-to-low range over the period divided by the midpoint of
    that range, and read it against the rest of today's candidate list rather than against a fixed number.
  status: verified
  cite:
  - code: BTM
    page: 118
    extract_id: beat_market_1967#466
  - code: BTM
    page: 118
    extract_id: beat_market_1967#467
  - code: BTM
    page: 119
    extract_id: beat_market_1967#472
- id: C6
  text: When two candidates are otherwise equivalent, volatility decides before time horizon does — the
    calmer name with the longer wait beats the wilder name with the shorter one.
  status: verified
  cite:
  - code: BTM
    page: 119
    extract_id: beat_market_1967#471
  - code: BTM
    page: 118
    extract_id: beat_market_1967#469
- id: C7
  text: Correct any screen that prices a claim without volatility in it — a volatile underlying makes
    the claim worth more than the screen says, which makes it a worse thing to sell and a better thing
    to own.
  status: verified
  cite:
  - code: BTM
    page: 117
    extract_id: beat_market_1967#465
  - code: BTM
    page: 201
    extract_id: beat_market_1967#846
- id: C8
  text: Defend the two sides differently — as price approaches the lower loss boundary you adjust and
    stay, and as it approaches the upper one you close the whole thing and take the smaller gain, because
    a move against you in that direction frees nothing to defend with.
  status: verified
  cite:
  - code: BTM
    page: 135
    extract_id: beat_market_1967#536
  - code: BTM
    page: 136
    extract_id: beat_market_1967#543
  - code: BTM
    page: 136
    extract_id: beat_market_1967#541
- id: C9
  text: Only a position you are actually watching may be sized to its defended payoff; anything you will
    not monitor must be sized to what it loses if you never touch it again.
  status: verified
  cite:
  - code: BTM
    page: 134
    extract_id: beat_market_1967#532
  - code: BTM
    page: 134
    extract_id: beat_market_1967#531
- id: C10
  text: Fix the exit level before entry and scale toward it, and exit when the condition you entered on
    has gone rather than when a price target is hit.
  status: verified
  cite:
  - code: BTM
    page: 58
    extract_id: beat_market_1967#186
  - code: BTM
    page: 160
    extract_id: beat_market_1967#664
  - code: BTM
    page: 61
    extract_id: beat_market_1967#204
- id: C11
  text: A structure is not an edge — the thing you are buying or selling has to be measurably mispriced
    against something before the trade is worth doing, or you are only collecting the shape of the payoff.
  status: verified
  cite:
  - code: BTM
    page: 43
    extract_id: beat_market_1967#150
- id: C12
  text: Refuse any rule whose only support is that it fitted the history; require a stated reason the
    effect exists that someone qualified has tried and failed to knock down.
  status: verified
  cite:
  - code: BTM
    page: 49
    extract_id: beat_market_1967#173
  - code: BTM
    page: 5
    extract_id: beat_market_1967#002
- id: C13
  text: Score a rule on every position it would have generated on those dates, not on the ones that worked
    — a claim backed by remembered winners with no count of the losers is not evidence.
  status: verified
  cite:
  - code: BTM
    page: 102
    extract_id: beat_market_1967#405
  - code: BTM
    page: 10
    extract_id: beat_market_1967#019
- id: C14
  text: Benchmark a rule against random selection and against the same trades with one component removed,
    and judge the result on how much the yearly outcomes vary, not on where the curve ends.
  status: verified
  cite:
  - code: BTM
    page: 8
    extract_id: beat_market_1967#013
  - code: BTM
    page: 96
    extract_id: beat_market_1967#386
  - code: BTM
    page: 96
    extract_id: beat_market_1967#387
- id: C15
  text: Carry the assumptions with every performance number — costs, leverage, and how fills were modelled
    — and restate the number net of them before comparing it to anything; where the instrument can move
    several percent in a day, assume the fills were worse than the model gave you.
  status: verified
  cite:
  - code: BTM
    page: 206
    extract_id: beat_market_1967#853
  - code: BTM
    page: 16
    extract_id: beat_market_1967#033
  - code: BTM
    page: 97
    extract_id: beat_market_1967#391
  - code: BTM
    page: 97
    extract_id: beat_market_1967#392
- id: C16
  text: Judge results by the compounded rate on a log scale, never by the average of the yearly returns,
    and read the straightness of that line as the real measure of how reliable the rate is.
  status: verified
  cite:
  - code: BTM
    page: 94
    extract_id: beat_market_1967#375
  - code: BTM
    page: 94
    extract_id: beat_market_1967#382
  - code: BTM
    page: 95
    extract_id: beat_market_1967#383
- id: C17
  text: A fitted relationship is an average, and individual names depart from it a long way; state the
    population it was fitted on and treat anything outside that population as untested.
  status: verified
  cite:
  - code: BTM
    page: 109
    extract_id: beat_market_1967#426
  - code: BTM
    page: 82
    extract_id: beat_market_1967#322
  - code: BTM
    page: 108
    extract_id: beat_market_1967#422
- id: C18
  text: Name the assumption about the future price distribution that your expected return depends on,
    and re-check it the moment you stop picking names at random and start picking them on a signal — selecting
    on the signal changes the distribution you assumed.
  status: verified
  cite:
  - code: BTM
    page: 200
    extract_id: beat_market_1967#838
  - code: BTM
    page: 200
    extract_id: beat_market_1967#839
  - code: BTM
    page: 201
    extract_id: beat_market_1967#845
- id: C19
  text: An edge holds only while the pricing condition that produced it holds; watch that condition directly,
    and when it compresses past the point that pays, stop and consider that the opposite position is now
    the trade.
  status: verified
  cite:
  - code: BTM
    page: 98
    extract_id: beat_market_1967#394
  - code: BTM
    page: 98
    extract_id: beat_market_1967#395
  - code: BTM
    page: 139
    extract_id: beat_market_1967#563
- id: C20
  text: Money kills an edge, not publicity — decay tracks the dollars pushed into the same trade, and
    the simplest and most fully written-down method is the one that goes first.
  status: verified
  cite:
  - code: BTM
    page: 192
    extract_id: beat_market_1967#808
  - code: BTM
    page: 195
    extract_id: beat_market_1967#817
  - code: BTM
    page: 195
    extract_id: beat_market_1967#815
- id: C21
  text: When nothing passes the screen, hold nothing and say so — long flat stretches are an output of
    a working method, not a failure of it.
  status: verified
  cite:
  - code: BTM
    page: 92
    extract_id: beat_market_1967#372
  - code: BTM
    page: 96
    extract_id: beat_market_1967#384
- id: C22
  text: Split capital evenly across candidates you genuinely rank as equals, put nearly all of it in one
    only when it is clearly better than the rest, and cut the weight of anything sitting close to the
    threshold that would have rejected it.
  status: verified
  cite:
  - code: BTM
    page: 183
    extract_id: beat_market_1967#776
  - code: BTM
    page: 184
    extract_id: beat_market_1967#781
  - code: BTM
    page: 88
    extract_id: beat_market_1967#359
- id: C23
  text: A stock trading above its eleven-month average tends to have its options priced below model value
    and one trading below that average tends to have them priced above it — measure the gap rather than
    assuming the trend is already in the option price.
  status: verified
  cite:
  - code: BTM
    page: 111
    extract_id: beat_market_1967#431
  - code: BTM
    page: 111
    extract_id: beat_market_1967#432
  - code: BTM
    page: 111
    extract_id: beat_market_1967#434
- id: C24
  text: Break a tie on what it costs to get in and out — spread, liquidity and the capital the position
    ties up are real costs, and between two equal candidates the cheaper one to trade wins.
  status: verified
  cite:
  - code: BTM
    page: 105
    extract_id: beat_market_1967#415
  - code: BTM
    page: 104
    extract_id: beat_market_1967#412
  - code: BTM
    page: 148
    extract_id: beat_market_1967#607
- id: C25
  text: Where a sizing rule gives you a growth-optimal bet, take a fraction of it rather than the whole
    thing.
  status: unsourced_retained
recognisers:
- id: R1
  if: a candidate's realised volatility sits in the top quartile of today's passing candidate set
  then: it ranks below a calmer candidate even if the calmer one has a longer expected time to resolve;
    volatility settles the ordering before horizon does
  fields:
  - realised_vol_30d
  - candidate_set_vol_rank
  - expected_hold_days
- id: R2
  if: (high_52w - low_52w) / ((high_52w + low_52w) / 2) is materially wider than the candidate set median
  then: the price band this position must survive is proportionally wider; widen the stop distance or
    cut the size, and do not treat it as interchangeable with a tighter-ranged name at the same score
  fields:
  - high_52w
  - low_52w
  - stop_distance_pct
  - position_size_pct
- id: R3
  if: the loss taken when the stop gaps through by one day's typical range exceeds the position's expected
    gain
  then: reject the position regardless of signal strength — the worst case, not the expected case, is
    the sizing constraint
  fields:
  - entry_price
  - stop_price
  - atr_14
  - expected_gain_r
  - position_size_pct
- id: R4
  if: the position will not be monitored intraday between entry and its scheduled review
  then: size it to the loss it takes with no intervention at all, not to the loss implied by the stop
    being honoured
  fields:
  - position_size_pct
  - stop_price
  - monitoring_interval
  - gap_risk_flag
- id: R5
  if: the close is above the mean of the last eleven monthly midpoints, each midpoint being (month high
    + month low) / 2
  then: expect the name's options to be priced cheap relative to model value; check implied against realised
    volatility before assuming an option leg is expensive
  fields:
  - close
  - monthly_high_11
  - monthly_low_11
  - implied_vol
  - realised_vol_30d
- id: R6
  if: a signal's reported hit rate was computed over fewer trades than the rule would have generated across
    the sample period
  then: the number is not usable — recount over the full generated set, losers included, before it may
    support a vote
  fields:
  - signal_id
  - backtest_trade_count
  - rules_generated_count
  - sample_start
  - sample_end
- id: R7
  if: the median edge across today's passing candidates has compressed against its own trailing median,
    or the count of names passing the screen has collapsed
  then: the condition the edge lives on is degrading; stop adding size and treat the opposite exposure
    as a live hypothesis rather than a contrarian indulgence
  fields:
  - signal_edge_current
  - signal_edge_trailing_median
  - candidates_passing_count
- id: R8
  if: round-trip spread plus slippage is a material share of the expected gain, or the name is being screened
    outside the universe the model was fitted on
  then: prefer the equally ranked candidate that trades tighter and sits inside the fitted universe; an
    untested population and a wide spread are both unpriced costs
  fields:
  - bid
  - ask
  - avg_daily_volume
  - expected_gain_r
  - universe_membership
