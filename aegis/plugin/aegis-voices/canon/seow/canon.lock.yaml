principles:
- id: C1
  text: 'SWING SYSTEM ONLY (Part II, s.51-90). Judge the chart with exactly two instruments and no more: a 20-period
    and a 40-period SIMPLE moving average, and a CCI oscillator with reference lines at +100 and -100. The moving
    averages give direction, the oscillator gives stretch. The author names no 50, 100 or 200 period average anywhere.'
  status: verified
  cite:
  - code: TSD
    page: 61
    extract_id: seow_tradersgps_2015#085
  - code: TSD
    page: 59
    extract_id: seow_tradersgps_2015#081
  - code: TSD
    page: 52
    extract_id: seow_tradersgps_2015#064
  system: swing
  scope_note: 'Re-read 2026-10-30: this line comes from the swing section. The deck''s Part I position system (s.21-42)
    uses other instruments and entries, so the line binds the swing system only.'
- id: C2
  text: Take the direction the two averages give you and no other. Go long only when the moving average is sloping
    up and the 20MA sits above the 40MA; go short only on the exact mirror, 20MA below a down-sloping 40MA. The
    short side is the long side with every condition reversed, not a separate method.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#082
  - code: TSD
    page: 68
    extract_id: seow_tradersgps_2015#093
  - code: TSD
    page: 88
    extract_id: seow_tradersgps_2015#118
  system: swing
- id: C3
  text: SWING SYSTEM ONLY (Part II, s.51-90). Buy the dip inside the up-move; never buy the extension. In a strong
    up trend a pullback that retests the RISING average is what puts you in buy mode, and the full long set-up is
    five conditions on one bar — up-sloping MA, 20MA above 40MA, CCI below -100, the bar's LOW touching or piercing
    the 20MA, and the CLOSE still above the 40MA. Four of five is not a set-up. (In the position system the buy
    signal is the break ABOVE the resistance line, C26 — buying strength is that system's entry.)
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#082
  - code: TSD
    page: 75
    extract_id: seow_tradersgps_2015#100
  - code: TSD
    page: 58
    extract_id: seow_tradersgps_2015#079
  system: swing
  scope_note: 'Re-read 2026-10-30: this line comes from the swing section. The deck''s Part I position system (s.21-42)
    uses other instruments and entries, so the line binds the swing system only.'
- id: C4
  text: Grade the pullback before you grade the set-up. It must have lasted fewer than 5 days, be made of measured
    bars rather than big ones, follow a recent high, and hold above the 40MA. Reject it outright if the advance
    into that high was parabolic — a near-vertical run disqualifies the dip that follows it.
  status: verified
  cite:
  - code: TSD
    page: 67
    extract_id: seow_tradersgps_2015#091
  - code: TSD
    page: 67
    extract_id: seow_tradersgps_2015#092
  system: swing
- id: C5
  text: A set-up does not authorise an entry; only price does. Place a buy stop one tick above the PRIOR DAY'S HIGH
    and let the market come and take it. If it does not fire, re-place it the next session against the newest prior-day
    high and keep doing so until the level is broken — the set-up stays live, it does not expire and it is never
    chased at market.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#083
  - code: TSD
    page: 63
    extract_id: seow_tradersgps_2015#087
  - code: TSD
    page: 33
    extract_id: seow_tradersgps_2015#041
  system: swing
- id: C6
  text: Do not take a long in a name weaker than what it trades against. Measure the stock's performance against
    the broad market index or against its own industry group over the comparison window, and confine longs to the
    stocks that are beating it. This is stated as an odds requirement, not a preference.
  status: verified
  cite:
  - code: TSD
    page: 8
    extract_id: seow_tradersgps_2015#012
  - code: TSD
    page: 8
    extract_id: seow_tradersgps_2015#011
  system: both
- id: C7
  text: 'Read the market in three layers and act on only two of them: the tide is the trend and you read it with
    the moving averages, the waves are retracements and you time them with CCI, the ripples are minor retracements
    and you MANAGE them with a trailing stop rather than trading them.'
  status: verified
  cite:
  - code: TSD
    page: 53
    extract_id: seow_tradersgps_2015#065
  - code: TSD
    page: 53
    extract_id: seow_tradersgps_2015#067
  system: swing
- id: C8
  text: The stop is fixed by the chart at the moment of entry, never chosen afterwards and never derived from how
    much you wish to lose. For an entry taken above the prior bar's high, put it one tick below the prior day's
    low, or one tick below the previous support, or one tick below the most recent swing low. For an entry on a
    breakout from a sideways base, put it one tick below the whole base or one tick below the breakout bar's low.
    Stop placement follows entry TYPE.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#084
  - code: TSD
    page: 64
    extract_id: seow_tradersgps_2015#088
  - code: TSD
    page: 81
    extract_id: seow_tradersgps_2015#109
  - code: TSD
    page: 82
    extract_id: seow_tradersgps_2015#110
  system: both
- id: C9
  text: Once the trade has gained more than 5% from the ideal entry price, move the stop to breakeven. The gain
    is measured against the entry the plan specified, not against a fill you improved on.
  status: verified
  cite:
  - code: TSD
    page: 83
    extract_id: seow_tradersgps_2015#111
  system: swing
- id: C10
  text: Trail the stop one tick below the PREVIOUS DAY'S LOW and re-set it every session. It ratchets up with the
    trade and never moves down.
  status: verified
  cite:
  - code: TSD
    page: 84
    extract_id: seow_tradersgps_2015#112
  system: swing
- id: C11
  text: SWING SYSTEM ONLY (Part II, s.51-90). Impose a time stop at day 5. If by the fifth day the profit objective
    has not been reached and the stop has not triggered, exit on time alone — the position has failed to do what
    it was nominated to do, and that is sufficient reason.
  status: verified
  cite:
  - code: TSD
    page: 85
    extract_id: seow_tradersgps_2015#113
  system: swing
  scope_note: 'Re-read 2026-10-30: this line comes from the swing section. The deck''s Part I position system (s.21-42)
    uses other instruments and entries, so the line binds the swing system only.'
- id: C12
  text: SWING SYSTEM ONLY (Part II, s.51-90). Run all four stops on the same position at the same time — the initial
    stop set at entry, the breakeven stop after the 5% move, the daily trailing stop, and the day-5 time stop —
    and exit on whichever triggers first. They are one governing set, not a menu to choose from.
  status: verified
  cite:
  - code: TSD
    page: 86
    extract_id: seow_tradersgps_2015#114
  system: swing
  scope_note: 'Re-read 2026-10-30: this line comes from the swing section. The deck''s Part I position system (s.21-42)
    uses other instruments and entries, so the line binds the swing system only.'
- id: C13
  text: Take profit in parts, never in one piece. Either cover 30-50% of the position at the next resistance (next
    support on a short), or scale out progressively and keep scaling until the candles turn against you. Do not
    require the exact high; entries and exits are taken inside the move, not at its extremes.
  status: verified
  cite:
  - code: TSD
    page: 66
    extract_id: seow_tradersgps_2015#090
  - code: TSD
    page: 72
    extract_id: seow_tradersgps_2015#099
  - code: TSD
    page: 87
    extract_id: seow_tradersgps_2015#116
  system: swing
- id: C14
  text: 'A long has exactly two sanctioned exit reasons and no others: the candlestick turns red, or price CLOSES
    below support. After a red candle you do not sell into it — you place the sell for the NEXT session below that
    candle''s low. A support break requires a close; an intraday penetration is not a trigger, and the sale may
    be done that day or the next. The red/blue candle colour is the vendor''s trend colouring on the TradersGPS
    chart (s.31, s.35), not defined in the deck; the seat reads it through the declared proxy in R15.'
  status: verified
  cite:
  - code: TSD
    page: 34
    extract_id: seow_tradersgps_2015#042
  - code: TSD
    page: 35
    extract_id: seow_tradersgps_2015#045
  - code: TSD
    page: 34
    extract_id: seow_tradersgps_2015#044
  - code: TSD
    page: 36
    extract_id: seow_tradersgps_2015#046
  system: position
- id: C15
  text: 'Size the position from the stop, with a formula, before you trade it: shares = (portfolio value x maximum
    risk percent per trade) / (entry price - exit price). The worked example risks 2% of a $120,000 book — $2,400
    over an $0.18 stop distance, giving 13,333 shares. A trade with no stop cannot be sized, which is why the stop
    must exist first.'
  status: verified
  cite:
  - code: TSD
    page: 76
    extract_id: seow_tradersgps_2015#104
  - code: TSD
    page: 76
    extract_id: seow_tradersgps_2015#105
  - code: TSD
    page: 79
    extract_id: seow_tradersgps_2015#108
  system: both
- id: C16
  text: 'Build the position across three signals rather than taking it at once: 50% of the intended size on the
    first signal, 30% on the second, 20% on the third — a declining ladder. Add only when the trade has proved you
    right, and sell fast when it proves you wrong. Adding to a losing position is not in the method at any size.'
  status: verified
  cite:
  - code: TSD
    page: 41
    extract_id: seow_tradersgps_2015#049
  - code: TSD
    page: 24
    extract_id: seow_tradersgps_2015#027
  - code: TSD
    page: 24
    extract_id: seow_tradersgps_2015#028
  system: position
- id: C17
  text: 'A trade proposal is incomplete, and therefore not tradable, until eleven fields are filled: stock, long
    or short, entry, target, exit (the stop), time frame, risk-reward, set-up, trigger, source and remarks. Entry
    price, profit target, stop price and intended holding period are the four the author asks for by name. A nomination
    missing any of them is not a weak nomination — it is an absent one.'
  status: verified
  cite:
  - code: TSD
    page: 46
    extract_id: seow_tradersgps_2015#052
  - code: TSD
    page: 77
    extract_id: seow_tradersgps_2015#106
  - code: TSD
    page: 56
    extract_id: seow_tradersgps_2015#076
  system: both
- id: C18
  text: State both the payoff and the probability BEFORE entry, not one of them. The payoff is the reward measured
    against the risk the stop defines; the probability is the historical hit rate of the set-up being taken. Mechanical
    trading means parameters that were back-tested on quantifiable data, so a set-up with no measured hit rate is
    not yet mechanical.
  status: verified
  cite:
  - code: TSD
    page: 4
    extract_id: seow_tradersgps_2015#002
  - code: TSD
    page: 22
    extract_id: seow_tradersgps_2015#022
  system: both
- id: C19
  text: Once entry and exit criteria are defined, take every signal they generate exactly as generated and skip
    none of them; a discretionary judgement at entry or exit is a departure from the method, not a refinement of
    it. Fix the holding-period time frame before trading rather than per trade — the author's swing band is 2-5
    days, which is what the day-5 time stop is calibrated to.
  status: verified
  cite:
  - code: TSD
    page: 22
    extract_id: seow_tradersgps_2015#023
  - code: TSD
    page: 22
    extract_id: seow_tradersgps_2015#024
  - code: TSD
    page: 16
    extract_id: seow_tradersgps_2015#020
  - code: TSD
    page: 16
    extract_id: seow_tradersgps_2015#021
  system: both
- id: C20
  text: Frame every decision from the loss side first. Think about losing money rather than making it, and protect
    what you already have before reaching for what you do not — the stop, the size and the time limit are all settled
    before the target is discussed.
  status: verified
  cite:
  - code: TSD
    page: 57
    extract_id: seow_tradersgps_2015#078
  system: both
- id: C21
  text: Do not open a daily long against a broken weekly structure; the higher timeframe frames the lower one, and
    a daily set-up inside a weekly breakdown is a set-up in the wrong direction.
  status: house
  reason: 'PM ruling 2026-10-30: keep as a HOUSE RULE. Not in the source (re-read 2026-10-30 confirms the deck is
    silent on multi-timeframe). Never cite it as the author''s.'
  system: both
- id: C22
  text: 'Pick the trading style before the trade, because the style sets the holding period: intraday; opportunity
    2-10 days; swing 2-5 days; position more than two weeks. The deck teaches two systems for this: Part I position
    trading and Part II swing trading. A name admitted on strength (MOMENTUM lane) is judged by the position system;
    a name admitted on a pullback (PULLBACK lane) by the swing system.'
  status: verified
  system: both
  cite:
  - code: TSD
    page: 16
    extract_id: seow_deck_reread_2026_10_30#s016
  - code: TSD
    page: 21
    extract_id: seow_deck_reread_2026_10_30#s021
  - code: TSD
    page: 51
    extract_id: seow_deck_reread_2026_10_30#s051
  added: '2026-10-30'
- id: C23
  text: 'Rank strength over the horizon you intend to hold: the short-term ranking for trades of one day to two
    weeks (momentum), the medium-term ranking for two weeks to three months (position), the long-term ranking for
    three months to two years.'
  status: verified
  system: both
  cite:
  - code: TSD
    page: 10
    extract_id: seow_deck_reread_2026_10_30#s010
  - code: TSD
    page: 11
    extract_id: seow_deck_reread_2026_10_30#s011
  added: '2026-10-30'
- id: C24
  text: 'Work top-down: rank markets and indices first, favour the sectors the economic-cycle map places in the
    current phase, then take only stocks stronger than their index or industry group.'
  status: verified
  system: both
  cite:
  - code: TSD
    page: 7
    extract_id: seow_deck_reread_2026_10_30#s007
  - code: TSD
    page: 8
    extract_id: seow_deck_reread_2026_10_30#s008
  - code: TSD
    page: 9
    extract_id: seow_deck_reread_2026_10_30#s009
  added: '2026-10-30'
- id: C25
  text: 'Apply a liquidity floor before anything else: a minimum price and an average volume that is large relative
    to your own trade size (the deck''s SGX calibration: above $0.50, above 500,000 shares, or 20-50 times the trade
    size). Only the rule is kept; the SGX numbers are not.'
  status: verified
  system: both
  cite:
  - code: TSD
    page: 25
    extract_id: seow_deck_reread_2026_10_30#s025
  - code: TSD
    page: 39
    extract_id: seow_deck_reread_2026_10_30#s039
  added: '2026-10-30'
- id: C26
  text: 'A position-trade buy signal comes from one of two sources: price breaking above the resistance line, or
    a market-cycle signal. Sell signals mirror them on the support line. Buying the break of resistance is this
    system''s entry; strength is the signal, not a flaw.'
  status: verified
  system: position
  cite:
  - code: TSD
    page: 26
    extract_id: seow_deck_reread_2026_10_30#s026
  - code: TSD
    page: 30
    extract_id: seow_deck_reread_2026_10_30#s030
  - code: TSD
    page: 31
    extract_id: seow_deck_reread_2026_10_30#s031
  added: '2026-10-30'
- id: C27
  text: 'Position entry: buy one cent above the previous candle''s high. If it is not taken, trail the buy stop
    to each new prior-day high until one breaks.'
  status: verified
  system: position
  cite:
  - code: TSD
    page: 32
    extract_id: seow_deck_reread_2026_10_30#s032
  - code: TSD
    page: 33
    extract_id: seow_deck_reread_2026_10_30#s033
  added: '2026-10-30'
- id: C28
  text: 'Confirm the signal with fund flow: cumulative momentum (COM) above zero is bullish and below zero bearish;
    read its slope and look for divergence. The trend-impulse histogram (TIF) sits alongside as confirmation. Both
    are proprietary; the seat uses declared proxies (R14).'
  status: verified
  system: position
  cite:
  - code: TSD
    page: 26
    extract_id: seow_deck_reread_2026_10_30#s026
  - code: TSD
    page: 28
    extract_id: seow_deck_reread_2026_10_30#s028
  - code: TSD
    page: 29
    extract_id: seow_deck_reread_2026_10_30#s029
  added: '2026-10-30'
- id: C29
  text: 'Position exits are the two in C14 and no others: a close below the support line (sell that day or the next)
    or the candle turning red (sell the next day below its low). The support line trails up under the trade. The
    breakeven-at-5% stop and the day-5 time stop belong to the swing system, not here; the deck''s own position
    example is held for about six months.'
  status: verified
  system: position
  cite:
  - code: TSD
    page: 34
    extract_id: seow_deck_reread_2026_10_30#s034
  - code: TSD
    page: 35
    extract_id: seow_deck_reread_2026_10_30#s035
  - code: TSD
    page: 36
    extract_id: seow_deck_reread_2026_10_30#s036
  - code: TSD
    page: 38
    extract_id: seow_deck_reread_2026_10_30#s038
  added: '2026-10-30'
- id: C30
  text: 'Pyramid on strength: each new buy signal is the next add, 50% then 30% then 20%. Add only when the trade
    is proving you right; cut fast when it proves you wrong. (Extends C16 to the signal source.)'
  status: verified
  system: position
  cite:
  - code: TSD
    page: 24
    extract_id: seow_deck_reread_2026_10_30#s024
  - code: TSD
    page: 41
    extract_id: seow_deck_reread_2026_10_30#s041
  added: '2026-10-30'
- id: C31
  text: 'The system is mechanical: it exists to take entry and exit choices away from the trader so emotion is removed.
    Once the criteria are set, follow every signal. (Re-states C19 for the position system.)'
  status: verified
  system: both
  cite:
  - code: TSD
    page: 22
    extract_id: seow_deck_reread_2026_10_30#s022
  - code: TSD
    page: 23
    extract_id: seow_deck_reread_2026_10_30#s023
  added: '2026-10-30'
- id: C32
  text: 'Shorts are every criterion reversed, in both systems. Out of scope for a long-only book: declare it, never
    apply it.'
  status: verified
  system: both
  cite:
