recognisers:
- id: R1
  if: sma20 > sma40 AND sma20[0] > sma20[5] AND cci20 < -100 AND low <= sma20 AND close > sma40
  then: mark this bar as a valid long SET-UP bar and arm an entry for the next session; if any one of the five is
    false there is no set-up and no order is placed
  fields:
  - ma_20
  - ma_40
  - ma_20_slope_5d_pct
  - cci_20
  - bar_low
  - bar_close
  system: swing
- id: R2
  if: a set-up bar exists AND today's high > prior_bar_high + 1 tick
  then: 'the long entry fires at prior_bar_high + 1 tick as a buy stop; if the level is not taken out, re-arm the
    same order tomorrow against the NEW prior-bar high and repeat until it fires or the set-up conditions break
    FIELD CONVENTION: at the morning run the last completed bar is yesterday, so ''the prior day''s high/low'' for
    today''s session is bar_high / bar_low (condition_vocab.json); prior_bar_* is the day before yesterday.'
  fields:
  - bar_high
  - bar_high
  - tick_size
  - setup_flag
  system: swing
- id: R3
  if: a long entry has just filled
  then: 'set the initial stop at min(prior_bar_low, most_recent_swing_low) - 1 tick, or at prior_support - 1 tick;
    for a fill on a break out of a sideways base use min(base_low, breakout_bar_low) - 1 tick. Compute share count
    as floor((portfolio_value * risk_pct) / (entry - stop)) — no stop, no size, no trade FIELD CONVENTION: at the
    morning run the last completed bar is yesterday, so ''the prior day''s high/low'' for today''s session is bar_high
    / bar_low (condition_vocab.json); prior_bar_* is the day before yesterday.'
  fields:
  - bar_low
  - fib_swing_low
  - prior_support
  - base_low_20d
  - breakout_bar_low
  - entry
  - portfolio_value
  - risk_pct
  system: both
- id: R4
  if: (close - entry) / entry > 0.05
  then: raise the protective stop to the entry price (breakeven) and never lower it again
  fields:
  - bar_close
  - entry
  system: swing
- id: R5
  if: the position is open and a new session has begun
  then: 'set stop = max(current_stop, prior_day_low - 1 tick); the trail ratchets one way only FIELD CONVENTION:
    at the morning run the last completed bar is yesterday, so ''the prior day''s high/low'' for today''s session
    is bar_high / bar_low (condition_vocab.json); prior_bar_* is the day before yesterday.'
  fields:
  - bar_low
  - current_stop
  - tick_size
  system: swing
- id: R6
  if: days_held >= 5 AND high_since_entry < target AND stop has not triggered
  then: exit the position on time alone at the next open — the trade failed to perform inside its stated holding
    band
  fields:
  - days_held
  - high_since_entry
  - target
  - stop
  system: swing
- id: R7
  if: days_since_swing_high >= 5 OR max(pullback_bar_range) > 2 * atr20 OR close < sma40 OR (high_20d_ago_to_high_run
    > 40% over <= 10 sessions)
  then: reject the long set-up as an unqualified pullback — too long, too violent, below the 40MA, or following
    a parabolic advance. The bar-count and the 40MA test are the author's; the range and parabolic thresholds are
    our computable stand-ins for 'big candles' and 'parabolic', which the deck states qualitatively
  fields:
  - days_since_swing_high
  - bar_range_5d
  - atr_14d
  - bar_close
  - ma_40
  - pct_run_10d
  system: swing
- id: R8
  if: stock_pct_change_63d <= index_pct_change_63d
  then: do not nominate the name long, regardless of set-up quality; substitute the stock's industry-group index
    for the broad index where a group series is available
  fields:
  - ret_63d
  - index_pct_change_63d
  - industry_group_pct_change_63d
  system: both
- id: R9
  if: position is open AND (close < open on today's bar) OR (close < support_level)
  then: arm the exit — on a down (red) candle place the sell for the NEXT session below that candle's low; on a
    close below support sell that session or the next. An intraday break of support with a close back above it is
    NOT a trigger. 'Candle turns red' is expressed here as close < open, which is the deck's own definition of a
    down candle, since the author's coloured candle is a vendor object
  fields:
  - bar_close
  - bar_open
  - bar_low
  - support_level
  system: position
- id: R10
  system: both
  if: at VOTE, the name's lane is MOMENTUM (the vote packet states the lane); at NOMINATE no lane exists yet
  then: 'At VOTE: a MOMENTUM-lane name is judged by the position system (C22, C26-C30, R11-R15) and a PULLBACK-lane
    name by the swing system (R1-R9); extension above the averages is not a fault in the position system. At NOMINATE:
    run both systems and name the one that fired in the reason line.'
  fields:
  - lane
- id: R11
  system: both
  if: elder_context.volume.avg_vol_20d is null OR entry x avg_vol_20d is small relative to a normal Aegis position
  then: state a liquidity caution in the reason line (C25). A caution, never a reject and never a conviction cap.
  fields:
  - elder_context.volume.avg_vol_20d
  - entry
- id: R12
  system: both
  if: holding horizon is position (2 weeks-3 months)
  then: the strength test is ret_63d above the index's 63-day return and a high rs_rank_pct; for a momentum horizon
    (under 2 weeks) use rs_spy_20d > 0; for long-term use ret_6m / ret_12m (C23, C6).
  fields:
  - ret_63d
  - rs_rank_pct
  - rs_spy_20d
  - ret_6m
  - ret_12m
- id: R13
  system: position
  if: structure_shift is BULLISH_BOS or ABOVE_STRUCTURE (close above the last confirmed pivot high) OR pct_from_pivot
    > 0
  then: a resistance-line buy signal is present (C26, light-green arrow proxy). Add the market-cycle signal when
    sector_rrg_quadrant is LEADING or IMPROVING (dark-green arrow proxy). Both are DECLARED PROXIES for the vendor's
    lines and arrows.
  fields:
  - structure_shift
  - pct_from_pivot
  - pivot_high
  - last_pivot_high.price
  - sector_rrg_quadrant
  - sector_trend_state
- id: R14
  system: position
  if: subcomponents.flow.cmf > 0
  then: 'fund flow confirms (COM above zero, C28); cmf < 0 is a bearish flow read stated as a caution. Trend impulse
    (TIF proxy): elder_pattern SUSTAINED or ACCELERATION confirms. Both DECLARED PROXIES.'
  fields:
  - subcomponents.flow.cmf
  - subcomponents.flow.mfi
  - elder_pattern
  - elder_5d
- id: R15
  system: position
  if: a position-system buy signal is present (R13)
  then: entry = buy stop 1 tick above bar_high (yesterday's high), condition word trade_above:bar_high, trailed
    to each new prior-day high (C27). Support-line proxy = max(fib_swing_low, base_low_20d); exit on a close below
    it, or on the trend-colour flip proxy (elder_pattern leaving SUSTAINED/ACCELERATION, or bar_close < bar_open
    after an up-run) - sell next session below that bar's low (C14, C29). Adds on later signals 50/30/20 (C30).
  fields:
  - bar_high
  - fib_swing_low
  - base_low_20d
  - elder_pattern
  - bar_open
  - bar_close
  - bar_low
