  sampled: 0
  confirmed: 0
  by: Ash
  basis: 'CHARTER-LEVEL confirmation, one step below every other voice in this canon and below even the
    O''Neil digest pattern (canon/oneil/spotcheck.json) — flagged explicitly rather than dressed up as
    equivalent. O''Neil''s digest was an independent third-party extraction that the PM then checked
    against the book. Crown has no independent extraction to check: the charter IS the PM-supplied build
    document, and no page, digest chunk or extract sample exists anywhere to sample against — canon_build.py''s
    lock command could not run here even in principle (see diff_sha_note). The grounding this voice rests
    on is PM authorship/supply of the charter itself, plus the explicit sign-off quoted in pm_signed_note.
    No principle below should be described as ''verified'' or ''digest-verified'' — every one carries
    status: unsourced_retained, and that status is accurate, not conservative. ADDED 2026-08-11 after
    live corroboration: the principles'' TEXT is still unverified against a page (CIPDK14 remains chat-upload-only),
    but the mechanism they describe is no longer speculative — a live AQE artifact
    (aqe_crown_macro_json, see sources) independently confirms the same structure: a `read_me_first`
    block matching this card''s 4-block output shape headline/why/so_what/what_would_change_it, a
    `the_call` block carrying `expression_family` + `size_multiplier` capped in practice at or below
    1.15x (observed 1.0x on 2026-08-11), a `scenario` block scoring "share of conditions met" rather
    than a probability (C34), and a `status`/`limits` field pair that refuses degraded inputs by name
    rather than silently zeroing them (C29/C30/C33 in practice, not just in principle). This is
    structural corroboration, not textual verification — status stays unsourced_retained throughout.'
