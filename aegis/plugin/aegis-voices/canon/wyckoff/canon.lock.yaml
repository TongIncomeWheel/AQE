- id: C17
  text: 'Risk is defined by the structure that produced the signal, not by a percentage: the stop is the DANGER
    POINT, just beyond the shakeout low or the trigger structure, where the reading is proven wrong, and the position
    is sized to it. Name it from structure; if the engine''s bracket has none, name your own level and say so -
    an absent engine stop is never a reason to reject (house rule R1).'
  status: verified
