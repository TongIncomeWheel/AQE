recognisers:
- id: R1
  system: both
  if: structure_shift is BULLISH_BOS or ABOVE_STRUCTURE AND pvp_position is ABOVE_VALUE
  then: TREND (imbalance up) - use the trend playbook (C2, C3, C7, C9, C10). structure_shift RANGE or pvp_position
    INSIDE_VALUE = RANGE - use the range playbook (C1, C6, C11). BEARISH_CHOCH = the up-structure failed; a long
    needs a fresh range and shakeout first.
  fields:
  - structure_shift
  - pvp_position
  - pvp_vah
  - pvp_val
  - pos_in_50d_range_pct
- id: R2
  system: trend
  if: TREND AND price is more than ~1 ATR above both structure_shift_ref (the broken Creek) and pvp_vah
  then: 'price is AWAY from value: do not chase (C3, C15). Vote HOLD-FOR-CONDITIONS with an observable test condition
    in the shared words, e.g. in_zone:structure_shift_ref, in_zone:pvp_vah, reclaim:vwap_14d, followed by the trigger
    h1_close_above:bar_high - extension sets the entry location, never an OPPOSE on its own. Within ~1 ATR of those
    levels = AT THE TEST (C7 entry zone).'
  fields:
  - entry
  - structure_shift_ref
  - pvp_vah
  - vwap_14d
  - atr_14d
- id: R3
  system: both
  if: structure_shift is BULLISH_BOS (a break that just happened)
  then: 'grade the break (C5): (bar_high - bar_low) >= atr_14d AND close location (bar_close - bar_low)/(bar_high
    - bar_low) >= 0.67 AND rvol_20d >= 1.0 = genuine-looking; rvol_20d < 1.0 = potential upthrust, stated as a caution
    until price holds outside the range. Thresholds are our stand-ins; the book gives none.'
  fields:
  - bar_open
  - bar_high
  - bar_low
  - bar_close
  - atr_14d
  - rvol_20d
  - structure_shift_ref
- id: R4
  system: trend
  if: pvp_position is ABOVE_VALUE AND bar_close > pvp_poc
  then: 'the bias stays long with the last accumulation (C9). A close back inside value after a breakout is a failed-breakout
    warning (C11 reversion principle): state it.'
  fields:
  - pvp_position
  - pvp_poc
  - pvp_vah
  - bar_close
- id: R5
  system: trend
  if: bar_close > vwap_14d AND elder_context.vwap_5d.slope_5d is RISING AND avwap_structure < bar_close
  then: 'value is stepping up: trend healthy (C10 proxy - AQE serves one 60-day profile, not successive ones). A
    falling 5-day VWAP or a close under avwap_structure questions the trend.'
  fields:
  - vwap_14d
  - elder_context.vwap_5d.value
  - elder_context.vwap_5d.slope_5d
  - avwap_structure
  - bar_close
- id: R6
  system: both
  if: bar_close > bar_open AND (bar_high - bar_low) >= atr_14d AND close location >= 0.67 AND rvol_20d >= 1.2
  then: 'a sign-of-strength bar is present (C12); the entry is a buy stop above bar_high, never a resting limit.
    Thresholds are our stand-ins for ''wide'' and ''relatively high volume''. Condition words: clv_ge:0.67 with
    vol_x_ge:1.2, entry trade_above:bar_high.'
  fields:
  - bar_open
  - bar_high
  - bar_low
  - bar_close
  - atr_14d
  - rvol_20d
- id: R7
  system: both
  if: a long is proposed
  then: 'name the danger point (C13, C17): below the trigger bar''s low, or below the structure (structure_shift_ref
    for a held breakout, base_low_20d or fib_swing_low for a range), behind pvp_val / vwap_14d where possible. If
    the engine bracket has no structural stop, name your own and say so - never a reject (house rule R1).'
  fields:
  - bar_low
  - structure_shift_ref
  - base_low_20d
  - fib_swing_low
  - pvp_val
  - vwap_14d
  - bracket.stop
- id: R8
  system: both
  if: targets are asked for
  then: 'first target = the next prior swing high (last_pivot_high.price if above price, else bracket.targets);
    high-volume-node targets are NOT SERVED yet (AQE ask). At the first target: partial or full exit and the stop
    to breakeven at minimum (C14).'
  fields:
  - last_pivot_high.price
  - bracket.targets
- id: R9
  system: range
  if: RANGE AND bar_low <= pvp_val AND bar_close > pvp_val
  then: 'value-area-low rejection: a range long toward pvp_poc then pvp_vah (C11). A bar_low under base_low_20d
    that closes back above it is a spring candidate (C6); confirm with the next move, never on the probe alone.'
  fields:
  - pvp_val
  - pvp_poc
  - pvp_vah
  - bar_low
  - bar_close
  - base_low_20d
  - pos_in_50d_range_pct
- id: R10
  system: both
  if: structure_shift is null, or the range/trend read is ambiguous on the fields served
  then: 'do not force it (C16): nominating nothing is a valid output; at VOTE, ABSTAIN with the reason.'
  fields:
  - structure_shift
  - pvp_position
- id: R11
  system: both
  if: I am asked for high/low-volume nodes beyond the value area, or last week's value area
  then: declare them NOT_SERVED (AQE asks filed 2026-10-30). pvp_poc / pvp_vah / pvp_val (60-day) ARE served and
    are my value-area read.
  fields:
  - pvp_poc
  - pvp_vah
  - pvp_val
- id: R12
  if: a held name carries hl_score or hl_state
  then: 'I treat it as a CONDITION read, never a STRUCTURAL one. My stop is the DANGER POINT (C17) — the level just
    beyond the spring''s low or the upthrust''s high — and no health band moves it. A deteriorating hl_score tells
    me the position is weakening; it does not tell me whether the structure that produced the signal is broken,
    which is the only question that closes a Wyckoff trade. Where hl_state reads EXIT and the structural low is
    still intact I say so plainly and let the PM adjudicate rather than defer to the score; where hl_state reads
    HOLD and the danger point has been violated, the danger point wins. I declare hl_flow NOT_SERVED: only the composite
    is exported, so I cannot separate effort-versus-reward decay (effort vs reward) from risk decay inside the score.'
  fields:
  - held
  - hl_score
  - hl_state
  - structure_shift
  - bracket.stop
  system: both
