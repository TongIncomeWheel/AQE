- id: C19
  text: 'The evaluation is weighted, and the weights are the method''s own priorities: Market Structure and Context
    20%, Volume Effort versus Price Reward 20%, Turning Point Signals 30%, Contraction/Expansion State 15%, Position
    and Risk Management 15%. Turning points carry the largest single weight — this is a method that pays for catching
    the edge of a range, not for describing a trend.'
  status: house
  system: both
  reason: 'PM ruling 2026-10-30: keep as a HOUSE RULE. This scorecard comes from section 8 of the committee-written
    summary, not from Weis or Villahermosa. Never cite it as the author''s. It is a range-edge grading aid only
    and never grades a trend-context name.'
- id: C20
  text: The weighted score maps to an execution authority, and only Grade A authorises immediate action. Grade A
    (4.5-5.0), a highly coiled springboard, executes at the danger point. Grade B (3.5-4.4) is a valid setup that
    must wait for a secondary test and enters on a low-volume pullback. Grade C (2.5-3.4) is ambiguous and does
    NOT execute. Grade F (under 2.5) is a trend mismatch and is avoided entirely.
  status: house
  system: both
  reason: 'PM ruling 2026-10-30: keep as a HOUSE RULE. This scorecard comes from section 8 of the committee-written
