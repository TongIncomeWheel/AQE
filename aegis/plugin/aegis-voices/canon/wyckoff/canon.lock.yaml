- id: C11
  text: 'Value-area principles: inside value, fade the edges toward the point of control or the far edge. If price
    re-enters value from outside, expect a run to the opposite edge. If price is rejected at the edge on its way
    back in, expect continuation in the breakout direction - the test-after-breakout trade.'
