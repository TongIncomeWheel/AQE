  added: '2026-10-30'
- id: C5
  text: 'Judge a breakout by three things together: a deep preceding shakeout; breakout bars with wide range, high
    volume and closes near the high; and price holding outside the old range without re-entering. A low-volume break
    is a potential upthrust until it proves itself.'
  status: verified
  system: both
