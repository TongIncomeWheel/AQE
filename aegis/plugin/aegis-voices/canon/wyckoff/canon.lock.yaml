- id: C6
  text: 'Weight the evidence: the most recent shakeout (spring or upthrust) sets the direction and outranks earlier
    range evidence; the Phase D breakout bar is second; volume across the range is third. A shakeout''s minimum
    target is the opposite edge of the range.'
