principles:
- id: C1
  text: RANGE CONTEXT ONLY. A trade is a study in Force — which side has the greater pulling power. The large-scale
    trades are not found in the middle of a move; they are found at the edges of trading ranges, where one side's
    force is about to be proven or broken.
  status: verified
  cite:
  - code: TATH
    page: 1
    extract_id: weis_trades_2013#001
  system: range
  scope_note: 'Re-read 2026-10-30: true of range context (WYK2 pp.280-283). In trend context the entry is the test
    after the breakout or a pullback zone (C3, C7).'
- id: C2
  text: 'Classify first: range (balance) or trend (imbalance); the answer picks the playbook. In a range, decide
    whether price is at an edge or in the middle; in a trend, whether it is still near the value it left or already
    away from it.'
  status: verified
  system: both
  cite:
