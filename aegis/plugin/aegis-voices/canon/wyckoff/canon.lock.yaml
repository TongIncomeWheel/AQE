  system: both
  amended: '2026-10-30: the line ''a setup without an identifiable danger point is not a setup'' removed - it read
    a bracket field as a reject, which R1 forbids.'
- id: C18
  text: 'SEATED 2026-08-06 FROM THE SECOND SOURCE (WYK2), THE VOLUME-AT-PRICE LAYER Weis''s method has no counterpart
    for. A volume profile''s VALUE AREA spans VAL (Value Area Low) to VAH (Value Area High) and contains exactly
    68.2% of the profile''s traded volume — the acceptance zone, one standard deviation of volume around the point
    of control. The VPOC (Volume Point of Control) is the single price level with the most volume traded, and structural
    break-outs cluster at it: in the worked example a breakout above equilibrium formed just above the profile''s
    High Volume Node, which was also its VPOC. ACCEPTANCE of a new price area is defined operationally — price HOLDS
    there (time) and active two-sided volume develops there; REJECTION is a quick reversal back into the old value
    area. And the TRADING RANGE PRINCIPLE follows mechanically from all of the above: while price stays inside a
    value area and conditions do not change, the market keeps generating value near the centre, which is WHY price
    rejects at the extremes — buy low, sell high inside a range is a consequence of volume distribution, not folk
    wisdom. This is the only principle in this spine with a direct, named counterpart in an Aegis-served field:
    the Energy engine''s vp_position_score is exactly this object, computed and thrown away at the composite-score
    stage. No other principle in this canon is this close to computable and unserved at the same time.'
  status: verified
  cite:
  - code: WYK2
    page: 186
    extract_id: villahermosa_wyckoff2_2021#175
