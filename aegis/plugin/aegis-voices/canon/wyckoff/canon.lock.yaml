- id: C7
  text: 'Preferred trend entry is the back-up / test of the broken Creek, ideally on light selling volume and where
    the Creek meets a value-area edge or volume node; it is the most conservative entry even when price looks high.
    Other allowed entries: the last point of support, a small base inside the uptrend, the first pullback after
    a high-volume impulse.'
