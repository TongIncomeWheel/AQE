- id: C12
  text: 'Trigger: a sign-of-strength bar - a wide bullish bar closing in its top third on relatively high volume
    - entered with a buy stop above it so follow-through is required. Never pre-place a limit order in anticipation
    of a test; that bets on two moves when only one can be projected.'
