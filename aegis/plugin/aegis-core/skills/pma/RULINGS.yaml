      stop on a held name was AQE's held_sl, null on all seven, which is why the 2026-09-26 brief told the PM
      he had no stops when he had six -- and hid the one position (WEAT) that truly had none. AQE already runs
      a 15-minute alert loop with email and dedup (src/alerts/, .github/workflows/alerts.yml); what it lacked
      was the committee's levels in a form it can read.
    check: tests.test_the_committee_levels_are_emitted_for_aqe_and_never_loosen_a_stop

  - id: R20.1
    title: Committee levels stay live for three sessions, additively
    status: active
    date: 2026-09-30
    binds_at: [LEVELS, PUBLISH]
    pm_words: >
      "I want AQE alerts to look at last 3 days - alternatively it is for PMA to write the levels additively
      for the last 3 days. reason is sometimes the levels and the alerts dont occur IMMEDIATELY and have some
      time lag due to market conditions"
    rule: >
      pma_levels.json carries the last three runs, not only today's. PMA owns the merge, so AQE reads one
      file: today's verdict on a name supersedes older ones; a name PASSED today, a row whose own kill or
      invalidation close is already broken by today's served close, any HELD or WATCH row from an earlier run,
      and anything older than three runs are retired with a stated reason; every other ADVANCE and
      HOLD-FOR-CONDITIONS row is carried, marked carried with its origin run and age. Trigger ids are stamped
      with the origin run so a fire is remembered for the row's whole life and never re-sent each morning.
    rationale: >
      The merge sits with PMA because only PMA knows which verdict superseded which; three separate files
      read by AQE would show a name as ADVANCE and PASS side by side. Carrying HELD rows would resurrect
      stale broker stops, so the broker read stays today-only.
    check: tests.test_levels_roll_forward_three_sessions_and_today_wins


