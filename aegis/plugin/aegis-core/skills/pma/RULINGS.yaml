    rule: >
      MTF runs after RANK for the room: a data-steward courier pulls daily history and 1-hour bars; mtf.py computes the W / D /
      H1 grid per name and declares NOT SERVED where bars are missing. The grid rides in the vote packet, the claims board and
      the tier-2 packets. Every tier-1 ruling carries tf {W, D, H1}; every tier-2 trigger names its frame. A missing frame is
      declared on the form, never silently skipped. This is information each voice uses by its own canon (Triple Screen, the
      weekly base, structure across frames, lower-frame timing), unlike premarket price, which is not.
    check: tests.test_multi_timeframe_grid_is_required

