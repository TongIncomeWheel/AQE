  - id: R36
    title: The rounds -- blind shortlist, challenge, blind vote both ways, open floor, slate, ratify, QA and hold, close
    status: active
    date: 2026-10-30
    binds_at: [NOMINATE, CHALLENGE, VOTE, SLATE, RATIFY, QA, DECIDE]
    status_note: round 3 (the open floor) is superseded by R38's two-tier funnel on 2026-11-02; the rest stands
    pm_words: >
      "One hearing round is not a committee." (18:59 SGT, 2026-10-30) The 12 Aug deliberation ruling, rebuilt.
    rule: >
      1 NOMINATE blind (R33). 1b CHALLENGE: Steenbarger's crowding / extension / overlap document on the room.
      2 VOTE blind, on an identical packet, with the CASE FORM on every name: stance, reason, the case AGAINST,
      entry trigger, wrong-if, horizon in sessions, what would change my mind, what I cannot see. 3 FLOOR: code
      (`board`) marks the contested names -- a blind split with both SUPPORT and OPPOSE present, or a name
      Steenbarger's challenge names; the Chair posts the board; deciders message each other by name; cap TWO
      messages per decider per name, counted by code (`floor-check`); Steenbarger may be called on by name.
      4 SLATE: the Chair drafts from what the seats said, never adds a view. 5 RATIFY per ticket. 6 QA: one note
      (did every decider read evidence; are reasons leaning on the same anchors; did a point go unanswered; does
      the slate say what the deciders said) and at most one HOLD per ticket, which reopens the floor and the
      ratification for that ticket only, once. 7 CLOSE: code counts (R34) and writes the record (R35).
      Rounds 1 and 2 are blind; discussion starts only after every decider is on record. The Chair is not a
      voice: no vote, no view, never judges the quality of a reason, only that every question was answered.
    check: tests.test_floor_caps_are_counted_by_code

