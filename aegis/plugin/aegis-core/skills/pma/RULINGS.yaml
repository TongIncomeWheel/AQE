  - id: R34
    title: The slate is at most 15; the objection rule replaces the consensus verdict rule; code counts
    status: active
    date: 2026-10-30
    binds_at: [SLATE, RATIFY, QA, DECIDE, WRITE]
    pm_words: >
      Settled 19:18 and 19:21 SGT, 2026-10-30. "Nobody objects = AGREED. 1 to 3 object = CONTESTED (stays
      listed, objections printed). 4 or more (half or more) = DROPPED (off the list, still tracked)."
    rule: >
      The Chair drafts a slate of at most 15 tickets across ADVANCE and WATCH (a ceiling, not a target; never
      padded), each with its entry trigger, where it is wrong, horizon, why the room agrees and who dissents.
      Each decider ratifies every ticket: AGREE, AGREE_WITH_RESERVATION, or OBJECT with the one thing that
      would clear it. `pma_pipeline.py ratify-count` counts OBJECT answers per ticket on the FINAL
      ratification: 0 = AGREED; 1..(ceil(n/2)-1) = CONTESTED (listed, objections and what-would-clear printed);
      >= ceil(n/2) of the n deciders present (4 of 7) = DROPPED (off the list, still recorded and tracked).
      Machine verdict words are unchanged for every downstream reader: slate ADVANCE -> ADVANCE, slate WATCH ->
      HOLD-FOR-CONDITIONS (rendered "WATCH"), DROPPED and not-slated room names -> PASS, each row carrying
      `status` AGREED|CONTESTED|DROPPED|NOT_SLATED. `conviction` on the row is an ORDERING figure derived from
      the ratification (AGREED 5 / with reservations 4 / CONTESTED 3 / DROPPED 2 / NOT_SLATED 1) and is never
      a gate. The old rule (support > oppose AND support >= 2 AND median conviction >= 3) is retired; `consensus`
      remains only as the blind-tally reader and prints that it is superseded.
    check: tests.test_objection_rule_counts_the_final_ratification

