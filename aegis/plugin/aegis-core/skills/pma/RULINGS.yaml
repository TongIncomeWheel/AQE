  - id: R38
    title: The two-tier funnel -- cross-examination, then decision -- replaces the open floor
    status: active
    date: 2026-11-02
    binds_at: [CLAIMS, CROSS, FUNNEL, PAIR, TIER2, TIMING, SLATE]
    pm_words: >
      "No minds changed sounds like something isn't working and a waste of effort, basically everyone agreeing their own
      cards." "One forced round doesn't represent a two tier funnel for me. That is essential for proper deliberation."
      "The new info should be voices looking at what others have tabled, and apply their lenses to it to form a supportive
      or non supportive view." "The chair needs to be smarter -- to trigger then cross intelligence across the voices and
      first funnel lost." (2026-11-02)
    rule: >
      TIER 1 (CLAIMS -> CROSS -> FUNNEL): code extracts each room name's sharpest claims (the two highest-conviction cases
      for and against) and routes each to two reviewers from another method family, opposite camp first. A reviewer RULES
      CONFIRM / REFUTE / CANNOT_SEE with its own method's evidence on the W/D/H1 grid and states its stance after. Code applies
      the survival rule: >= 1 support claim CONFIRMED cross-lens and CONFIRM >= REFUTE on support claims. TIER 2 (PAIR ->
      TIER2 -> TIMING): code puts every refute of a surviving claim in front of its author; each seat answers its refuters and
      DECIDES every survivor (stance; on SUPPORT: ACT_NOW | WAIT, ONE trigger with timeframe, wrong-if, market void). Code
      counts across all seven: < 4 SUPPORT not slated; ACT_NOW > WAIT ADVANCE else WATCH; tie = WATCH. The Chair runs the
      tools and writes why_agreed / dissent on tickets whose verdict and trigger code has fixed; it never votes. Every
      count is by code, never by hand. funnel.json and decision.json carry the measurement: rulings by kind, names dropped,
      stances changed on a peer's evidence, ACT_NOW vs WAIT splits.
    check: tests.test_two_tier_funnel_is_counted_by_code

  - id: R39
    title: Multi-timeframe (weekly / daily / 1-hour) is a required look on every ruling and every trigger
    status: active
    date: 2026-11-02
    binds_at: [MTF, VOTE, CROSS, TIER2, SLATE]
    pm_words: >
      "An alternative suggestion maybe is to force a multi timeframe look (weekly, daily, 1hour)." "Premarket and gap info
