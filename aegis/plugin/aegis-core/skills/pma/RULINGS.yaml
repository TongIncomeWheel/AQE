  - id: R42
    title: The committee speaks as one body - a 1-5 conviction and ONE deliberated rationale
    status: active
    date: 2026-11-04
    binds_at: [RATIFY, RATIONALE, ADOPT, POSITION, REPORT]
    pm_words: >
      Relayed by the conductor (2026-11-03): committee conviction 1-5 per slated ticket, and one committee rationale the
      deciders have deliberated, not seven separate reasons on the card.
    rule: >
      Each decider adds a 1-5 conviction (5 = best) to its ratification. Code counts the committee conviction as the median
      of the filed scores, ties to the lower, with a quorum of 4; a missing score is a gap, never filled in. The Chair drafts
      the rationale ONLY as verbatim-quoted, sourced clauses from what deciders filed (machine-verified against the filed
      forms). Each decider answers ADOPT / AMEND / DISSENT; the Chair merges and marks every amendment MERGED or NOT_MERGED;
      code attaches the minority notes (every DISSENT, every unmerged AMEND) verbatim. Cards print: Committee: Conviction n/5.
      Why. What would change it. Minority note. The earlier R34 `conviction` figure is renamed `ordering_score` (the old name
      stays as a deprecated alias). The conviction is a readout, never a gate on a verdict and never sizing.
    check: tests.test_committee_position_counts_the_median_and_never_invents_a_rationale

  - id: R43
    title: Three lanes assigned by code - lead seats decide, advisors are heard (APPROVED, switched off)
    status: approved
    date: 2026-11-04
    binds_at: [RANK, VOTE, RATIFY, REPORT]
    pm_words: >
      "Momentum and pullback; continuation is a subset of momentum." Voice leads for continuation: yes (Livermore, Seow, Elder,
      Raschke lead; O'Neil and Minervini advise). Relayed by the conductor, 2026-11-04.
    rule: >
      PM APPROVED 2026-11-04 (leads: breakout oneil/minervini/livermore/wyckoff, pullback seow/elder-lens/raschke/wyckoff, wyckoff an advisor on
      continuation, proportional counting: DROP at 2 of 4 leads). Stays behind parameters.lanes_v1 (off) until the first rerun with the lead seats
      seeing the continuation fields is dry-run and the PM says enable. Every ticket gets one lane from AQE fields by code (tools/lanes_v1.py
      assign_lane): MOMENTUM_BREAKOUT (at or under the base pivot, inside the 5% chase line), MOMENTUM_CONTINUATION (past the base
      pivot by more than 5% with a continuation pause high), PULLBACK (under the pivot, reclaim day or holding a rising average),
      else UNLANED (every seat counts, as today). In a laned ticket the lead seats' OBJECT answers decide AGREED / CONTESTED /
      DROPPED; an advisor's objection is printed on the ticket and never counted. Lead sets: continuation signed by the PM;
      breakout and pullback proposed. Two threshold modes are measured in docs/LANES_V1_SPEC.md; the PM picks one. Switching it
      on also requires the lead seats' packets to carry the continuation fields and the lane instruction (spec s4).
    check: tests.test_lanes_v1_assigns_by_code_and_leads_decide

