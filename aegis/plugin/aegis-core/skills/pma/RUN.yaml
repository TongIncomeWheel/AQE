# AEGIS PMA — THE RUN MAP, AS DATA.
#
# WHY THIS FILE EXISTS. The conductor card used to be a 117-line prose essay. An operator whose
# context is compacted mid-run cannot reliably re-derive a step's inputs, barrier and meter call
# from a paragraph. Every step below states its command, what it must read, what it must produce,
# what must be true to pass, and what it costs. Read this file, not a narrative.
#
# THE LOOP, for every step, without exception:
#   1. preflight_run.py step <NAME>      -- asserts inputs exist and rulings binding here
#   2. run `command` (tool) or spawn `spawns` seats (model)
#   3. registrar.py commit each produced artifact as it lands
#   4. registrar.py meter --step <NAME> [--tool-only]
#   5. registrar.py tick --step <NAME> --status done|degraded
# A finished step is NEVER re-run. `/pma resume` reads the scoreboard and restarts the first step
# not ticked done.

schema: aegis_run.v1
updated: 2026-11-02   # R38-R41 (docs/DECISIONS_2026-11-02.md): the two-tier funnel replaces the open floor; MTF grid; one trigger; Valen off tickets
# THE 30 OCT 2026 REDESIGN (RULINGS R31-R36; docs/DECISIONS_2026-10-30.md wins). Seven deciders +
# Steenbarger as QA; Detect-lens an independent list; the weather from AQE's Crown file and the Valen
# dashboard, never from a seat. Rounds: blind NOMINATE (cap 6) -> CHALLENGE (Steenbarger) -> blind VOTE
# with the case form -> FLOOR (Chair + deciders, on contested names) -> SLATE (Chair, <= 15) -> RATIFY
# -> QA (note + at most one hold per ticket, reopening FLOOR/RATIFY for that ticket once) -> DECIDE
# (ratify-count: 0 objections AGREED / 1-3 CONTESTED / >= 4 of 7 DROPPED). Code counts; voices judge.
# THE 2 NOV 2026 REDESIGN (R38-R41; docs/DECISIONS_2026-11-02.md). The open FLOOR is RETIRED: 151 messages moved no stance.
# In its place a TWO-TIER FUNNEL fed by the only new information a method-bound seat can act on -- another seat's testable
# claim, ruled on through its own lens: CLAIMS (code extracts + routes) -> CROSS (7 seats rule CONFIRM/REFUTE/CANNOT_SEE on
# the W/D/H1 grid) -> FUNNEL (code: survival rule) -> PAIR (code: every refute in front of its author) -> TIER2 (7 seats:
# answer your refuter; decide every survivor: stance, ACT_NOW|WAIT, ONE trigger + timeframe, market void) -> TIMING (code
# counts: <4 SUPPORT not slated; ACT_NOW>WAIT ADVANCE else WATCH, tie = WATCH). The Chair extracts, routes and pairs by
# running the tools and writes why_agreed/dissent on tickets whose verdict and trigger code has fixed. MTF (R39) after RANK.
parameters:
  deliberation_cap: 20
  desk_session: session_012zhnXnQA5r7e7u5j5RDBqe     # the PMA desk: where the PM reads the daily output (PM 2026-11-02)
  deciders: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
  qa_seat: steenbarger
  shortlist_cap: 6
  slate_cap: 25                 # PM 2026-11-04 (was 15): 17 survived on the first live R42 run and FA, an ADVANCE with 5 SUPPORT, was cut. The cut itself is CODE: pma_pipeline.py slate-plan
  floor_messages_per_seat_per_name: 2
  holds_per_ticket: 1
  case_form_effective: 2026-11-01
  pm_lens_min_checks: 5
  phase4_window: 5
  repeat_threshold: 2
  seat_budget_minutes: 15
  respawns: 1
  form_max_bytes: 24576
  brief_deadline_hours: 4
  card_report_artifact: "https://claude.ai/artifact/Q6FAPeqn2g8kvQuFja89Z3"   # R23: ONE fixed URL, updated in place every run
  max_quality_loops: 2
  claims_per_camp: 2            # R38: the two highest-conviction SUPPORT cases and the two highest-conviction OPPOSE cases per name
  claim_reviewers: 2            # R38: each claim is routed to two reviewers from a different method family / the opposite camp
  survive_rule: "support claims CONFIRMED >= 1 and CONFIRM >= REFUTE on support claims (claims-score)"
  slate_min_support: 4          # R38/R40: fewer than 4 of 7 SUPPORT after tier 2 = not slated
  tie_rule: WATCH               # R40: ACT_NOW == WAIT -> WATCH ("a higher win rate beats a bigger R")
  mtf_frames: [W, D, H1]        # R39
  committee_position: on        # R42 SWITCH: `off` = the conductor skips RATIONALE, ADOPT, RATIONALE-FINAL and POSITION for this run, ticks each `degraded` with the note 'R42 switched off', and writes that line at the top of run_notes.md. The Cards then print no committee block (no committee_position.json); verdicts and the conviction-free count are unaffected. No code change needed.
  r42_respawns: 1               # R42 cost cap: a seat or Chair form that fails validation is respawned ONCE (= `respawns`); a second failure stops that step at a declared gap (tick `degraded`) - never a third spawn, never all seven seats again

# ---------------------------------------------------------------------------- durability
# RESTORED 2026-09-16. stages/S0_preflight.md has always said it plainly -- "local disk is
# disposable -- it has been wiped five times in one build, and every artifact that survived did so
# because it was pushed" -- and stages/S7_cio_output.md requires the brief to reach a fixed GitHub
# path "so it is durable and diffable". The v5.4 conductor rewrite carried neither: not one of the
# 13 steps had a git action, so the 2026-09-15 run existed only inside a container that gets
# reclaimed. Twenty-seven model spawns and ~115k tokens of committee work sat on disposable disk.
#
# The capability was never missing -- tools/git_sync.py has been in this plugin since D-48, is
# self-healing (clones if the checkout is absent), order-blind, idempotent and fail-visible. It was
# simply never called from here. checkpoint_after marks the steps where a crash costs MODEL tokens
# rather than a cheap tool re-run; those are the only ones worth the push.
rerun:
  how: "registrar.py init --date <date> --rerun r2   # run_id pma-<date>-r2, run dir aegis/output/pma/run/<date>-r2; every <date> in the checkpoint --dest below becomes <date>-r2"
  rules: >
    RERUN MODE (PM 2026-11-03, 'rerun today on the new code, reusing what we hold'). The rerun is NOT live and cannot
    damage what is published. (1) IDENTITY: run_id pma-<date>-r2, run dir aegis/output/pma/run/<date>-r2, checkpoints
    there (git_sync --dest aegis/output/pma/run/<date>-r2); git_sync REFUSES any other destination while the manifest
    says rerun, and `check.py chain --run-dir aegis/output/pma/run/<date>-r2 --date <date>` accepts it. The dir name
    differs from run/<date>, so a watcher keyed on run/<date>/run_manifest.json never mistakes it for the live run.
    (2) PUBLISH: skip push_levels and push_scorecard and their read-backs entirely. Nothing is written to
    aegis/output/pma/pma_levels.json, levels/<date>.json, scorecard_log.jsonl or scorecard/<date>.md; the rerun's own
    levels, scorecard and brief exist only inside the r2 dir, and publish_receipt.json lists only paths inside it
    (check.py chain FAILs otherwise). The PM promotes a rerun to live explicitly, later, as a separate act.
    (3) REUSE: the committee data for <date> is taken as is when `check.py data` reads OK for it; the ledgers and the
    repeat-watch / carry-forward inputs are the ones on main, which are the ORIGINAL <date> record because a rerun
    never pushes a ledger. Pull only what is new (the fresh export, held rows, closes if stale).
    (4) INBOX-CLEAN is skipped: tick it `degraded` with the note 'skipped: rerun'.
    (5) The desk message starts 'PMA RERUN <date>-r2 DONE' and says it is not live.

checkpoint:
  tool: "skills/pma/tools/git_sync.py -m 'pma <date> checkpoint after <STEP>' --dest aegis/output/pma/run/<date> --paths run_manifest.json forms/ board.json claims_board.json funnel.json pairs.json decision.json slate.json slate_excluded.json floor_check.json consensus.json committee_record.json slate_plan.json rationale_draft.json rationale_final.json committee_position.json publish_receipt.json pma_cards_<date>.html pma_brief_<date>.md run_notes.md"
  path_rule: >
    THE CHECKPOINT PATH (PM 2026-10-30, BUILD_PLAN Phase 1). --dest puts every working file under
    aegis/output/pma/run/<date>/ in the checkout -- the ONE prefix deploy-hf.yml ignores. Without it the bare
    run-dir names landed at the repo root and every checkpoint push would have rebuilt the HF Space and killed
    the AQE container; which is why the 29 Oct run held everything on disposable disk until the end. git_sync.py
    now REFUSES (exit 1, reason printed) to stage anything outside aegis/output/ unless --allow-outside-output
    is passed explicitly. /pma resume reads the pushed run dir back from that path.
  tool_note: >
    git_sync.py ships INSIDE skills/pma/tools/ as well as at the plugin root. The run's working set
    copies skills/ and not the plugin's top-level tools/, so a checkpoint pointed at the root copy
    would not resolve during an actual run -- the same duplication the pma tools already carry, for
    the same reason. Keep the two copies identical.
  after: [GATHER, NOMINATE, CHALLENGE, VOTE, CROSS, TIER2, SLATE, RATIFY, QA, RATIONALE, ADOPT, WRITE, PUBLISH]
  first_and_last: >
    GATHER's checkpoint is the RUN LOCK: it pushes run_manifest.json (written by `registrar.py init`) before any
    model spawn, so the READY watcher and the pma-auto backstop see `aegis/output/pma/run/<date>/run_manifest.json`
    on main and never start a second committee the same day. PUBLISH's checkpoint runs AFTER the PUBLISH tick and
    is the LAST push of the run: the 18:00 gate reads the manifest from origin/main and `check.py chain` FAILs any
    step still pending there (contract audit 2026-11-02 -- before this, the last push was after WRITE and CHECK /
    LEVELS / REPORT / PUBLISH never reached main, so the gate would have failed every clean run).
  rule: >
    A checkpointed step is not closed until its artifacts are pushed. Tool steps are not
    checkpointed -- re-running consensus or repeat-watch costs nothing and pushing after each
    would only add failure surface. `/pma resume` reads the scoreboard, so what has to survive is
    run_manifest.json plus the committed forms; with those, a reclaimed container costs the step
    in flight, never the run.
  on_fail: >
    Declare the degradation and CONTINUE -- a push failure must never halt a committee that has
    already done the expensive work. The run is then knowingly on disposable disk and the brief
    header says so.

steps:

  - name: INBOX-CLEAN
    kind: tool
    connector: Gmail (ash.tzl@gmail.com)
    queries: ['from:"AQE Alerts"', 'subject:"[AQE]"']
    command: >
      TWO searches, because Gmail drops the brackets in subject:"[AQE]" and matches any subject containing
      the word AQE -- on 2026-10-23 that query also returned GitHub "[TongIncomeWheel/AQE] Run failed"
      notifications, which are NOT alerts and must never be trashed.
      (1) search_threads from:"AQE Alerts" -> trash_thread on every thread returned.
      (2) search_threads subject:"[AQE]" -> trash_thread ONLY where the subject literally starts with
      "[AQE]" (case-sensitive, after stripping whitespace); every other hit is left untouched and counted
      as skipped. Page with nextPageToken until each search is empty of matches. Then re-run both and
      confirm zero matching threads remain.
    produces: [inbox_clean.json]
    barrier: "re-search finds 0 matching threads"
    on_fail: "declare it in the brief header (count trashed, count left) and CONTINUE -- never block the committee"
    rulings: [R24]
    must_also: >
      R24 (PM 2026-10-23): "add one step when we run daily PMA ... search my mailbox for emails with
      "[AQE]" in subject line or from "AQE Alerts" as sender.. move all these mails to trash." Trash only
      (recoverable for 30 days) -- never permanently delete, never touch any other mail. Write
      inbox_clean.json {queries, found, trashed, skipped_not_aqe, remaining, at} and report it in one line.
      Run it at the START of the morning run: the overnight check-ins have already read the session's alerts.
    meter: "--tool-only"

  - name: GATHER
    kind: tool
    reads: []
    produces: [run_manifest.json, aqe_daily_export.json, aqe_crown_macro.json, aqe_valen_dashboard.json, candidate_set.json, packets/, fundamentals_pack.json, phase4_ledger.json, verdict_ledger.json, data_health.json, closes_scorecard.json]
    producers: >
      run_manifest.json <- registrar.py init. The AQE files, candidate_set.json, packets/ and the two ledgers <- fetched
      from main by the data-steward. fundamentals_pack.json and closes_scorecard.json <- COPIED VERBATIM from
      aegis/output/committee_data/ on main (PM 2026-11-03: fetching is code, not a model): the daily AQE run fetched
      them from FMP with its own key (src/pipeline/committee_data.py) and `check.py data` proved the manifest, the
      sha256s, the run date and the coverage BEFORE you copy a byte. The same directory holds mtf_grid.json, which
      the MTF step reads by path. data_health.json <- the data-steward's one-page note (agents/data-steward.md step 3),
      which now quotes the manifest's status and counts. The tick refuses on any missing file.
      COURIER FALLBACK, loud and declared: ONLY if `check.py data` FAILs on committee_data (manifest missing, stale,
      FAILED, sha mismatch) OR the manifest is PARTIAL. ONE coverage rule: any file under 95% served is PARTIAL and
      `check.py data` FAILs it; at or above 95% the per-name gaps are a WARN that names them, and the run PROCEEDS with
      those names as declared gaps (3 Nov proof run: fundamentals 347/351 = OK). The courier fallback is about 1.5M
      metered tokens (3 Nov: 46% of the run), so it is the PM's call, not the conductor's: STOP AND PAGE with two replies,
      'couriers' (run the fallback and write `committee_data_fallback` to the manifest degradations) or 'skip' (proceed
      with the unserved names as declared gaps). FAILED / missing / stale / torn are the same stop-and-page.
    source: "TongIncomeWheel/AQE@main aegis/output/"
    barrier: "aqe_daily_export.json present and parses"
    on_fail: "FATAL - halt and page the PM. No export, no run."
    rulings: [R7, R12]
    checkpoint_after: true        # the run lock -- run_manifest.json on main before any seat is spawned
    first: "registrar.py init --date <date>   # writes run_manifest.json (the scoreboard); every later tick needs it. RERUN: add --rerun r2 (see `rerun:` above)"
    must_also: >
      THE BOOK AND ITS STOPS (R20, PM 2026-11-02: "Stop from Tiger is correct. That's the dependency").
      The book of record is the close's journal on main, aegis/data/journal/aegis_journal_<last close>.json
      (Tiger positions + Tiger's working orders, read at 05:30); AQE's export carries the same stops
      (held_sl / held_stop_order / held_stop_check, merged with the 06:20 pre-AQE Tiger read). Build
      broker_stops.json FROM THE JOURNAL: `pma_levels.py stops --journal <journal> --previous <yesterday's
      broker_stops.json> --out broker_stops.json`. If this session has the Tiger connector, ALSO pull
      get_open_orders + get_stock_positions (read-only) and run instead `pma_levels.py stops --journal
      <journal> --orders <o> --positions <p> --previous <...> --out broker_stops.json` -- the live read is
      restricted to the journal's book and every disagreement is written to `disagreements`. Then run
      `check.py data --output-dir aegis/output --broker-stops broker_stops.json`: a missing, stale or
      unread-orders journal, or any disagreement, is a FAIL -- page the PM, do not guess which is right.
      A held name with NO stop order is a WARN the Cards must show as UNPROTECTED. A name the close
      auto-included is in the book (PM: he says on review if it is not Aegis). A position that vanished
      since yesterday is listed for the PM to confirm -- the broker's fill query has missed a stop-out
      (GLD 2026-09-28).
      Record the sha256 of every tool this run will execute onto the scoreboard (R7).
      THE HELD BOOK IS AN INPUT, NOT AN AFTERTHOUGHT (R12). aqe_daily_export.json carries
      export.held_positions — AQE forces every ticker the PM owns through the scoring engines
      whether or not it still clears the curated screen, so the read is complete and includes
      hl_state, its own health verdict. `pma_pipeline.py trim` carries that record onto the
      universe WHOLE under `held_book`; it is never sliced and a held name is never screened out.
      VALEN (PM 2026-10-23): fetch aegis/output/aqe_valen_dashboard.json beside the export. It feeds the
      vote packet's VALEN block (r2digest --valen) and the card report's Valen panel. Missing = declared gap.
      Pull the FMP fundamentals batch HERE — it was lost on 2026-09-06 when this step was
      shortcut, and surfaced only after RANK.
    meter: "--tool-only"

  - name: PREPARE
    kind: tool
    reads: [candidate_set.json, packets/]
    produces: [packets_manifest.json, voice_menus.json]
    barrier: "every seat has a packet and its md5 is recorded; voice_menus.json copied to the run root"
    rulings: [R5, R12]
    must_also: >
      Copy the skill's contracts/voice_menus.json to the run root as voice_menus.json (CHALLENGE and the
      packet verify read it there). VERIFY ONLY otherwise. AQE publishes candidate_set.json; consume it as
      published. No local filter, no screen, no column stripping (R5). One grep for qs_market
      across seat packets; a hit is FATAL.
      THE HELD FLOOR (R12): every seat packet carries held, the cost basis, the size, the
      unrealised, AQE's hl_state/hl_score, the written stop and target, the kNN path and the
      ATR fallback stop on every held row. cmd_packets REFUSES to build without them — on
      2026-09-16 all three positions read EXIT and no seat was shown it.
    meter: "--tool-only"

  # SEAT TRANSPORT (standard since 2026-10-21, recorded 2026-10-23): in this harness the compiled
  # aegis-voices:voice-* agent types carry NO file tools (tools: []), so on 2026-10-21 all nine first
  # spawns correctly refused to work blind. Every seat at MACRO / NOMINATE / CHALLENGE / VOTE is spawned
  # as a general-purpose agent told to read ONLY its own card (aegis-voices agents/voice-<seat>.md) and its
  # own packet by path, write its form, and self-validate with registrar.py validate --packet. R2's
  # inlining is replaced by path-read; the figure audit is the check. Seats write figures as
  # "field value" (the audit also reads field=value since 2026-10-23).
  # MACRO step RETIRED 2026-11-01 (R31): Crown and Druckenmiller stood down as voices. The weather is
  # read by code from AQE's Crown file (aqe_crown_macro.json: the_call, scenario, read_me_first) and the
  # Valen dashboard -- `r2digest --crown` puts it in the vote packet, the card report renders it in Part 1.

  - name: NOMINATE
    kind: model
    spawns: 7
    seats: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
    reads: [packets/<seat>.tsv, cards/voice-<seat>.md]
    produces: [forms/r1/*.json]
    barrier: "6 of 7"
    on_fail: "halt and report - no committee"
    rulings: [R1, R2, R3, R31, R33]
    must_also: >
      Blind and isolated. No seat sees the tally, another seat, or any ordering hint.
      Validate each return on arrival; one respawn, then absent.
      R33: at most SIX nominations per decider (fewer is valid, never padded); the registrar REJECTS a
      seventh. R16's floor is unchanged -- every nomination filed is seated.
    checkpoint_after: true        # 7 seats
    meter: "--spawns 7"

  - name: PM-LENS
    kind: tool
    command: "pm_lens.py --export <export> --out pm_lens.json"
    reads: [aqe_daily_export.json]
    produces: [pm_lens.json]
    lane: independent
    must_also: >
      Runs on the FULL export, not the top 20, BEFORE RANK (review finding 10, 2026-11-01: RANK reads
      pm_lens.json for the PM_LENS door, so it cannot run after RANK). Blocks nothing; rejoins at WRITE.
    meter: "--tool-only"

  - name: RANK
    kind: tool
    command: "pma_pipeline.py tally --nominations forms/r1 --out tally.json"
    then: "pma_pipeline.py rank --tally tally.json --candidates candidate_set.json --export <export> --cap 24 --door-budget 8 --pm-lens pm_lens.json --pm-lens-min 5 --out phase4.json"
    reads: [forms/r1/*.json, candidate_set.json, aqe_daily_export.json, pm_lens.json]
    produces: [tally.json, phase4.json, phase4_ledger.json]
    floor:
      NOMINATED: "R16 -- nominated by ANY seat at ANY conviction. Seated UNCONDITIONALLY. Never cut, never ordered against a machine find, never bounded by --cap."
      HELD: "R16 + R12 -- a position the PM owns. Seated unconditionally so the ADD question is asked, not only keep/exit."
    doors:
      note: "ADDITIONS ONLY (R16). These fill --door-budget (default 8) ON TOP of the floor and can never displace a nomination or a held position. --cap bounds the doors alone."
      SEATS: "nominated by >= 2 seats (a floor name; the count orders the floor for reading and sets the lane)"
      SOLO: "nominated by 1 seat at conviction >= 4 (a floor name; label retained, its second-door requirement made moot by R16)"
      ELDER+LENS: "elder >= 7 on each of the last 2 bars AND >= 3 of 6 lenses strong"
      LENS: ">= 4 of 6 lenses strong, no elder-bar test"
      STRENGTH: "rs_spy_20d in top decile of today's list OR mp >= 75 AND mp_accel_state ACCELERATING"
      PM_LENS: ">= 5 of the PM's 6 checks"
      AQE_LEADER: "elder_pattern SUSTAINED|ACCELERATION AND rs_leadership LEADER (R13: mp_state not consulted)"
    lanes: "MOMENTUM if STRENGTH or AQE_LEADER opened, else PULLBACK (R14); written on every phase4 row"
    ordering_key: >
      R16: the floor is admitted WHOLE and FIRST, ordered seat_count > conviction_sum >
      thematic_support > sc_momentum for READING ONLY -- ordering never removes a name. Door
      additions then fill --door-budget by doors_opened > lenses_strong > AQE rank. The STRENGTH
      RESERVE IS RETIRED (--strength-reserve accepted and ignored).
    rulings: [R4, R12, R13, R14, R15, R16]
    must_also: >
      run `ledger` immediately after, so names the doors did not add are logged too. cmd_rank ASSERTS
      the R16 invariant and aborts the run if any nomination is cut. A nomination the served universe
      carries no row for is reported under nominations_off_universe as a declared DATA GAP -- never as
      a cut, never silently dropped.
    meter: "--tool-only"

  - name: MTF
    kind: tool
    spawns: 0                      # PM 2026-11-03: the grid is computed by the daily AQE run; no courier unless the fallback fires
    command: "mtf.py build --grid aegis/output/committee_data/mtf_grid.json --phase4 phase4.json --date <date> --out mtf.json"
    fallback_command: "mtf.py build --bars mtf_bars --phase4 phase4.json --export aqe_daily_export.json --date <date> --out mtf.json   # after ONE courier writes mtf_bars/; only if the line above exits 2; meter --spawns 1"
    reads: [phase4.json, "aegis/output/committee_data/mtf_grid.json (daily AQE run)"]
    produces: [mtf.json]
    barrier: "mtf.json present; every room name has a row (served, served with a labelled GAP, or declared NOT SERVED)"
    on_fail: "declare it; the vote packet, the claims board and the tier-2 packets carry 'MTF NOT SERVED' on the affected names and CONTINUE"
    rulings: [R39]
    must_also: >
      R39 (PM 2026-11-02): "force a multi timeframe look (weekly, daily, 1hour)". PM 2026-11-03: the bars are fetched
      by CODE. The daily AQE run (src/pipeline/committee_data.py) pulls FMP's native 1hour bars for every export name
      plus held (a superset: the room is only known after RANK), takes the daily bars from the panel it already holds,
      and publishes mtf_grid.json (schema mtf_grid.v1, per-name `fetch` status, sha256 in the manifest). This step only
      selects the room's rows from it: no FMP call, no model, no spawn. mtf.py exits 2 -- loudly, with the reason -- on
      a grid that is missing, malformed or for another run date; that, and only that, fires the fallback_command: one
      data-steward courier writes mtf_bars/<TICKER>.json {daily:[...], h1:[...]} (or {daily, m15} -- mtf.py rolls 15-minute
      bars up to :30-anchored hourly bars), transcribed exactly, nothing estimated, "unserved": true for a name that
      returns nothing. Declare the fallback in the brief header. A room name the grid does not hold is declared NOT SERVED. mtf.py then computes the W / D / H1 grid per name (close vs EMA9/EMA21, EMA order, last bar colour,
      higher-high/higher-low over the last 3 bars, distance to the 20-bar high, 1H position vs the day's range) and the
      weekly bars from the daily. The courier forms no opinion (data-steward rules). The grid rides in the vote packet
      (r2digest --mtf), the claims board and every tier-2 packet; every tier-1 ruling and tier-2 trigger names its frame.
    meter: "--tool-only"

  - name: CHALLENGE
    kind: model
    spawns: 1
    seats: [steenbarger]
    command: "pma_pipeline.py challenge-packets --menus voice_menus.json --universe candidate_set.json --phase4 phase4.json --forms forms/r1 --date <date> --outdir seat_packets --seats steenbarger"
    reads: [phase4.json, forms/r1/*.json, candidate_set.json]
    produces: [forms/challenge/steenbarger.json]
    barrier: "1 of 1"
    on_fail: "declare it; the floor's contested set then comes from the blind split alone"
    rulings: [R1, R2, R3, R31, R36]
    validate_with: "registrar.py validate --file forms/challenge/steenbarger.json --kind challenge --candidates candidate_set.json"
    must_also: >
      Crowding, extension and overlap reads on the room BEFORE anyone votes (contracts/challenge.schema.json).
      Never a nomination, never a vote. Names it flags are CONTESTED on the board.
    checkpoint_after: true        # 1 seat
    meter: "--spawns 1"

  - name: VOTE
    kind: model
    spawns: 7
    seats: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
    reads: [VOTE_PACKET.txt]
    packet: "pma_pipeline.py r2digest --export <export> --fundamentals fundamentals_pack.json --steenbarger forms/challenge/steenbarger.json --crown aqe_crown_macro.json --valen aqe_valen_dashboard.json --mtf mtf.json --out VOTE_PACKET.txt"
    produces: [forms/r2/*.json]
    barrier: "6 of 7"
    on_fail: "watch-table-only run, declared"
    rulings: [R1, R2, R3, R31, R32, R36]
    validate_with: "registrar.py validate --file <form> --round 2 --candidates candidate_set.json --phase4 phase4.json --packet VOTE_PACKET.txt"
    before: "check.py coverage --packets-dir packets --export aqe_daily_export.json --phase4 phase4.json --out coverage.json"
    must_also: >
      PER-VOICE DATA COVERAGE, BEFORE any seat is spawned (PM 2026-11-03: "BLOCK before the vote on a gap, loud,
      never a silent pass"). Run the `before` command. Exit 1 = a seat's charter reads a field its packet does not
      serve (a NEW gap, not in contracts/voice_coverage.json known_gaps): STOP, page the PM with the FAIL lines, and
      do not spawn the vote. Exit 0 prints, per voice, what is served, the standing gaps that are waived but still
      NOT SERVED (named every run), the fields that are off the voice's menu (a menu choice, never a gap), and the
      name-level blanks scoped to this room: quote the NOT SERVED and name-level lines in the brief header, so a
      vote taken on a hole is a vote the PM can see was taken on one. coverage.json is the full report; commit it.
      Packet is built by `pma_pipeline.py r2digest` and is IDENTICAL for every seat.
      Every seat votes on EVERY deliberation-set name. Commit per vote, not at end of stage.
      R36 CASE FORM (contracts/case_form.schema.json): every vote carries `case` -- for, against, entry
      trigger, wrong-if, horizon in sessions, what would change my mind, cannot see. Reasons BOTH ways;
      the registrar rejects a vote without it. R32: all seven count on every name; the lane is a label.
      BLIND: no seat sees another's vote until the board is posted at FLOOR.
      VALIDATE WITH --packet, ALWAYS (R2, amended 2026-09-16). Without it the figure audit does
      not run and a seat that invented its numbers is committed as if it had read the row. The
      md5 half of R2 never ran once -- no seat has a hashing tool, so all eleven declared
      NOT_VERIFIED on 2026-09-15 and nobody noticed it had become routine. This is the check
      that replaced it, and it only runs if the flag is passed.
      D123 (PM 2026-10-02): paste contracts/conditions_block.md into every round-2 seat prompt. Every
      SUPPORT carries a `conditions` block in the shared words of contracts/condition_vocab.json; the
      registrar rejects one that is missing, types a level as a number, uses a word outside the
      vocabulary, or steps outside the seat's own method (contracts/voice_primitives.json). The vote,
      the verdict rule and the lanes are UNCHANGED -- the block only writes down what the seat already
      judged, in a form AQE's live alerts can watch.
    checkpoint_after: true        # 7 seats (R31), the single largest model line in the run
    meter: "--spawns 7"
    split_ballots: >
      R16.1 -- under R16 the room is as large as the seats made it, so a seat's votes may not fit one
      24,576-byte form (measured ~953 bytes per name over eleven real 2026-09-24 ballots, so about 25
      names per file THEN; with the R36 case form the dry run of 2026-11-01 measured ~750 bytes per name on a
      50-name room, so about 30 names per part NOW -- a room over 30 ALWAYS splits; tell each seat its parts up front
      names per file). A seat then files parts: validate each with
      `registrar.py validate --file forms/r2/<seat>.partNofM.json --round 2 --part N --of M` (a
      declared part need not cover the set), then
      `registrar.py merge --glob 'forms/r2/<seat>.part*.json' --out forms/r2/<seat>.json --phase4 phase4.json`
      which PROVES the parts cover the deliberation set exactly -- refusing a gap, a duplicate and an
      outsider -- before DECIDE runs. Tell each seat its part and the names in it. A FILE SIZE LIMIT
      MUST NEVER AGAIN DECIDE WHICH OF THE PM'S ANALYSTS ARE HEARD.

  - name: CLAIMS
    kind: tool
    command: "pma_pipeline.py claims --round2 forms/r2 --phase4 phase4.json --challenge forms/challenge/steenbarger.json --mtf mtf.json --date <date> --out claims_board.json --packets-dir claims_packets"
    reads: [forms/r2/*.json, phase4.json, forms/challenge/steenbarger.json, mtf.json]
    produces: [board.json, claims_board.json, claims_packets/]
    first: "pma_pipeline.py board --round2 forms/r2 --phase4 phase4.json --challenge forms/challenge/steenbarger.json --date <date> --out board.json   # the blind splits + cases, kept for the record and ratify-count"
    barrier: "every name with a SUPPORT vote carries >= 1 claim; every claim is routed to exactly claim_reviewers reviewers from another method family"
    on_fail: "FATAL for the funnel -- halt and declare; the run cannot slate without tier 1"
    rulings: [R1, R38, R39]
    must_also: >
      THE CLAIMS BOARD (R38). Per room name: the sharpest claims = `case.for` of the two highest-conviction SUPPORT seats and
      `case.against` of the two highest-conviction OPPOSE seats (ties by seat order). Names with no SUPPORT vote are out and get
      no claims. Each claim is routed to two reviewers from a DIFFERENT METHOD FAMILY (oneil+minervini = breakout template;
      livermore = pivotal strength; elder-lens = impulse; seow = position system; raschke = swing pattern; wyckoff = structure/volume),
      preferring the OPPOSITE CAMP, then abstainers, then the lowest-conviction same-camp seats of another family; load-balanced
      round-robin. Steenbarger's claims on a name ride on the board as context. claims_packets/<seat>.json holds exactly the
      claims routed to that seat, with the name's MTF grid and its row -- never the author's stance count or any other ruling.
      It computes NO verdict (asserted).
    meter: "--tool-only"

  - name: CROSS
    kind: model
    spawns: 7
    seats: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
    reads: [claims_packets/<seat>.json]
    produces: [forms/cross/*.json]
    barrier: "6 of 7"
    on_fail: "a missing reviewer's claims are re-routed once (claims --reroute <seat>); then declared absent"
    rulings: [R1, R31, R38, R39]
    validate_with: "registrar.py validate --file forms/cross/<seat>.json --kind cross --claims claims_board.json"
    must_also: >
      TIER 1 -- CROSS-EXAMINATION (contracts/cross_ruling.schema.json). A reviewer RULES on each claim routed to it --
      CONFIRM / REFUTE / CANNOT_SEE -- with the evidence its own method reads, on the W / D / H1 grid (R39), and states its
      own stance on the name after ruling (changed_mind + what_moved_me when it moved). It never restates its own case and
      never sees another reviewer's ruling. Blind: no seat sees the rulings until funnel.json is posted. R1 as everywhere.
    split_forms: >
      R16.1 applies (2026-11-02): a reviewer routed ~40 claims may not fit one 24,576-byte form. It files
      forms/cross/<seat>.partNofM.json, each validated with `--kind cross --claims claims_board.json --part N --of M`, then
      `registrar.py merge --kind cross --glob 'forms/cross/<seat>.part*.json' --claims claims_board.json --out forms/cross/<seat>.json`
      proves the parts cover its routing exactly. The counters skip the parts.
    checkpoint_after: true
    meter: "--spawns 7"

  - name: FUNNEL
    kind: tool
    command: "pma_pipeline.py claims-score --claims claims_board.json --rulings forms/cross --date <date> --out funnel.json"
    reads: [claims_board.json, forms/cross/*.json]
    produces: [funnel.json]
    barrier: "claims-score exits 0; every room name is SURVIVES / DROPPED / OUT with its tallies"
    on_fail: "FATAL -- a funnel that cannot count is not a funnel; halt and declare"
    rulings: [R38]
    must_also: >
      THE FIRST FUNNEL, by code. A name SURVIVES when >= 1 of its support claims is CONFIRMED by a cross-lens reviewer AND its
      support claims are not net-refuted (CONFIRM >= REFUTE). Names with no SUPPORT vote are OUT. Everything else is DROPPED
      here with the refuting evidence on the record. funnel.json also carries the measurement the PM asked for: claims issued,
      rulings by kind, names dropped at tier 1, seats whose stance changed on a peer's evidence, and the post-cross stance
      of every seat on every name. NEVER hand-tallied.
    meter: "--tool-only"

  - name: PAIR
    kind: tool
    command: "pma_pipeline.py pair --claims claims_board.json --rulings forms/cross --funnel funnel.json --mtf mtf.json --date <date> --out pairs.json --packets-dir tier2_packets"
    reads: [claims_board.json, forms/cross/*.json, funnel.json, mtf.json]
    produces: [pairs.json, tier2_packets/]
    barrier: "every REFUTE on a surviving claim is one pair (author, refuter, claim, evidence); every decider has a tier2 packet listing the survivors it must decide"
    rulings: [R38]
    must_also: >
      THE ADVERSARY PAIRING. Code puts each REFUTE of a surviving claim in front of the claim's AUTHOR, with the refuter's
      evidence and grid quoted. tier2_packets/<seat>.json = the pairs where the seat is the author (to answer) + the full
      survivor list with each name's MTF grid and the tier-1 tallies (how many confirmed / refuted, never who) + the
      condition vocabulary. The Chair runs it; it adds nothing.
    meter: "--tool-only"

  - name: TIER2
    kind: model
    spawns: 7
    seats: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
    reads: [tier2_packets/<seat>.json]
    produces: [forms/tier2/*.json]
    barrier: "6 of 7"
    on_fail: "one respawn, then absent; decide-timing counts the deciders present (n) and drops at >= ceil(n/2) as everywhere"
    rulings: [R1, R31, R38, R39, R40]
    validate_with: "registrar.py validate --file forms/tier2/<seat>.json --kind tier2 --pairs pairs.json --funnel funnel.json"
    must_also: >
      TIER 2 -- DECISION (contracts/tier2.schema.json). Each decider files ONE form: (a) an ANSWER to every refutation of its own
      claims -- quote the point in ten words or fewer, answer by its own method on the grid, concede when the refuter's evidence
      is evidence its method cares about; (b) a DECISION on EVERY survivor: stance; on SUPPORT the timing ACT_NOW | WAIT, the
      ONE trigger the PM should act on (condition-vocab word with a FIELD level, timeframe W/D/H1, plain words), where it is
      wrong, and the market condition that voids it (optional). One form, no replies to replies: the pairing IS the exchange.
    split_forms: >
      R16.1 applies (2026-11-02): a form over 24,576 bytes is filed as forms/tier2/<seat>.partNofM.json, each validated with
      `--kind tier2 --pairs pairs.json --funnel funnel.json --part N --of M`, then `registrar.py merge --kind tier2 --glob
      'forms/tier2/<seat>.part*.json' --pairs pairs.json --funnel funnel.json --out forms/tier2/<seat>.json` proves every
      pair and every survivor is covered. decide-timing skips the parts.
    checkpoint_after: true
    meter: "--spawns 7"

  - name: TIMING
    kind: tool
    command: "pma_pipeline.py decide-timing --tier2 forms/tier2 --funnel funnel.json --phase4 phase4.json --date <date> --out decision.json"
    reads: [forms/tier2/*.json, funnel.json, phase4.json]
    produces: [decision.json]
    barrier: "decide-timing exits 0; every survivor carries support/act_now/wait counts, a verdict proposal and ONE trigger"
    on_fail: "FATAL -- halt and declare"
    rulings: [R38, R40]
    must_also: >
      THE SECOND FUNNEL, by code. Per survivor, across ALL deciders present: SUPPORT < slate_min_support (4) -> NOT SLATED (PASS);
      otherwise ACT_NOW > WAIT -> ADVANCE, else WATCH (tie_rule WATCH). The ticket's trigger = the modal (word, tf) among the
      winning timing camp, its plain text from the seat that stated it most completely; ties by the higher conviction seat's.
      The slate-wide MARKET KILL = the modal market_void across all SUPPORT decisions (null when none, declared). Held names: the
      same count on the ADD question; the hold line (KEEP / TIGHTEN) = the modal stated wrong_if of the supporters. Writes the
      measurement block (act_now vs wait splits) into decision.json. NEVER hand-tallied.
    meter: "--tool-only"

  - name: SLATE
    kind: model
    spawns: 1
    seats: [chair]
    reads: [decision.json, funnel.json, forms/tier2/*.json, forms/cross/*.json, claims_board.json]
    produces: [slate_plan.json, slate.json, slate_excluded.json]
    first: "pma_pipeline.py slate-plan --decision decision.json --cap 25 --out slate_plan.json --excluded slate_excluded.json   # the cap cut by CODE (most SUPPORT, then ACT_NOW, then ADVANCE first, then A-Z)"
    barrier: "registrar.py validate --file slate.json --kind slate --phase4 phase4.json --decision decision.json --plan slate_plan.json --run-dir . exits 0"
    on_fail: "fix the slate (one re-file); a slate that cannot validate halts the run and is declared"
    rulings: [R1, R34, R38, R40]
    must_also: >
      The Chair drafts the committee's AGREED BEST (contracts/slate.schema.json v2): at most 25 tickets (parameters.slate_cap), exactly the names in slate_plan.json. The VERDICT and the ONE
      TRIGGER of every ticket are COPIED from decision.json -- the registrar REJECTS a ticket that differs (R40). The Chair's own
      work is `why_agreed` (the confirming reviewers' evidence and the deciders' reasons, quoted and attributed), `dissent`
      (every OPPOSE / WAIT-against-ADVANCE seat in its own words), the horizon (median of the supporters' stated horizons) and
      `market_kill` copied from decision.json. Over the cap the CODE cuts (slate-plan) and writes slate_excluded.json with a reason per name. Every why_agreed / wrong_if
      piece reads  voice: "verbatim quote"  from a SUPPORT seat on that ticket and a form where that seat's stance was SUPPORT (registrar checks it). Built ONLY from what the seats said; the Chair never votes, ranks by its own view or judges a reason.
    checkpoint_after: true
    meter: "--spawns 1"

  - name: RATIFY
    kind: model
    spawns: 7
    seats: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
    reads: [slate.json]
    produces: [forms/ratify/*.json]
    barrier: "6 of 7"
    on_fail: "halt and declare -- fewer than 4 ratifications is no committee (ratify-count refuses)"
    rulings: [R31, R34, R35]
    validate_with: "registrar.py validate --file <form> --kind ratify --slate slate.json"
    must_also: >
      Each decider answers EVERY ticket (contracts/ratification.schema.json): AGREE, AGREE_WITH_RESERVATION
      (say the reservation), or OBJECT with the one thing that would clear it. Commit per form on arrival.
    checkpoint_after: true
    meter: "--spawns 7"

  - name: QA
    kind: model
    spawns: 1
    seats: [steenbarger]
    reads: [funnel.json, decision.json, forms/cross/*.json, forms/tier2/*.json, slate.json, forms/ratify/*.json]
    produces: [forms/qa/steenbarger.json]
    barrier: "registrar.py validate --file forms/qa/steenbarger.json --kind qa --slate slate.json exits 0"
    on_fail: "declare it and CONTINUE to DECIDE without a hold -- a missing QA note never blocks the count"
    rulings: [R31, R35, R36]
    must_also: >
      ONE note (contracts/qa_note.schema.json): did every decider read evidence; are reasons leaning on the
      same few anchors; did anyone's point go unanswered; does the slate say what the deciders said. He may
      HOLD a ticket (at most once per ticket). ON A HOLD: the conductor reopens deliberation on the held tickets
      only -- one floor message per decider per held ticket to forms/floor2/ (contracts/floor_message.schema.json; validated
      `registrar.py validate --file <m> --kind floor --phase4 phase4.json`), `floor-check --messages forms/floor2 --qa forms/qa/steenbarger.json`,
      then `pma_pipeline.py slate-cut --slate slate.json --qa forms/qa/steenbarger.json --out slate_held.json` and the
      deciders ratify the held tickets again to forms/ratify2/, each validated with `registrar.py validate --file <f>
      --kind ratify --slate slate_held.json`. One hold, one re-ratification, then the result stands. He cannot vote or veto.
    checkpoint_after: true
    meter: "--spawns 1"

  - name: DECIDE
    kind: tool
    command: "pma_pipeline.py ratify-count --slate slate.json --ratifications forms/ratify --ratifications2 forms/ratify2 --qa forms/qa/steenbarger.json --board board.json --cross forms/cross --tier2 forms/tier2 --messages2 forms/floor2 --phase4 phase4.json --date <date> --out consensus.json --record committee_record.json"
    then: "pma_pipeline.py record-verdicts --consensus consensus.json --candidates candidate_set.json --phase4 phase4.json --ledger verdict_ledger.json --date <date>"
    reads: [slate.json, forms/ratify/*.json, forms/ratify2/*.json, forms/qa/steenbarger.json, board.json, forms/cross/*.json, forms/tier2/*.json]
    produces: [consensus.json, committee_record.json, verdict_ledger.json]
    rule: "R34: count OBJECT answers per slate ticket on the FINAL ratification of the deciders present (n). 0 = AGREED; 1..ceil(n/2)-1 = CONTESTED (listed, objections and what-would-clear printed); >= ceil(n/2) (4 of 7) = DROPPED (off the list, still tracked). Slate ADVANCE -> ADVANCE; slate WATCH -> HOLD-FOR-CONDITIONS (shown as WATCH); DROPPED and never-slated room names -> PASS. `conviction` is an ordering figure only, never a gate. All seven count on every name (R32)."
    rulings: [R1, R8, R9, R32, R34, R35]
    must_also: >
      NEVER hand-tallied. --ratifications2 / --messages2 are optional and only exist after a QA hold. The
      ledger row is written HERE, before any narrative step (R8). committee_record.json (R35) carries every
      decider's blind vote, horizon, floor messages, change of mind and ratification per ticket; the scorecard
      grades each voice at its own horizon from it. Brackets attach AFTER, render-only.
    meter: "--tool-only"

  - name: RATIONALE
    kind: model
    spawns: 1
    seats: [chair]
    reads: [consensus.json, forms/ratify/*.json, forms/cross/*.json, forms/tier2/*.json]
    produces: [rationale_draft.json]
    barrier: "registrar.py validate --file rationale_draft.json --kind rationale --stage draft --consensus consensus.json --run-dir . exits 0"
    on_fail: "declare it and CONTINUE: the Cards print no rationale for the run (a declared gap), the conviction still counts"
    rulings: [R42]
    must_also: >
      The Chair drafts ONE rationale per AGREED/CONTESTED ticket as short clauses, each a verbatim quote of what a decider
      filed with its source (voice, form, field). No paraphrase, no new claim.
    checkpoint_after: true
    meter: "--spawns 1"

  - name: ADOPT
    kind: model
    spawns: 7
    seats: [oneil, minervini, livermore, elder-lens, seow, raschke, wyckoff]
    reads: [rationale_draft.json, consensus.json]
    produces: [forms/adopt/*.json]
    barrier: "6 of 7"
    on_fail: "declare it and CONTINUE: a seat that does not answer is listed as no answer, never counted as ADOPT"
    rulings: [R42]
    validate_with: "registrar.py validate --file <form> --kind adopt --draft rationale_draft.json"
    must_also: >
      Each decider answers every ticket: ADOPT, AMEND (with the text it wants added) or DISSENT (with its own words).
    checkpoint_after: true
    meter: "--spawns 7"

  - name: RATIONALE-FINAL
    kind: tool
    command: "pma_pipeline.py rationale-final --draft rationale_draft.json --run-dir . --out rationale_final.json"
    reads: [rationale_draft.json, forms/adopt/*.json]
    produces: [rationale_final.json]
    barrier: "registrar.py validate --file rationale_final.json --kind rationale --stage final --consensus consensus.json --run-dir . exits 0"
    on_fail: "declare it and CONTINUE: the Chair's draft is shown, labelled as a draft"
    rulings: [R42]
    must_also: "P2: CODE attaches every AMEND text verbatim as 'Also (voice): ...' (byte-capped; the overflow is a minority note). The Chair merges nothing."
    meter: "--tool-only"

  - name: POSITION
    kind: tool
    command: "pma_pipeline.py committee-position --consensus consensus.json --ratifications forms/ratify --ratifications2 forms/ratify2 --draft rationale_draft.json --final rationale_final.json --adopts forms/adopt --run-dir . --record committee_record.json --date <date> --out committee_position.json"
    reads: [consensus.json, forms/ratify/*.json, rationale_draft.json, rationale_final.json, forms/adopt/*.json]
    produces: [committee_position.json]
    rulings: [R42]
    on_fail: "declare it; the Cards render without the committee block"
    must_also: >
      LOUD (conductor + PM, 2026-11-03): every line `committee_position.json` carries under `declared` goes at the TOP of
      run_notes.md. The Cards show a banner at the top ("DRAFT, not adopted" / "NOT FILED") and label each ticket's
      rationale. A rationale that is not the adopted final is never presented as if it were.
    meter: "--tool-only"

  - name: CONDITIONS
    kind: tool
    command: "pma_conditions.py compile --consensus consensus.json --forms 'forms/r2/*.json' --export aqe_daily_export.json --candidates candidate_set.json --date <date> --out conditions.json --md conditions.md --html conditions.html"
    reads: [consensus.json, "forms/r2/*.json", aqe_daily_export.json, candidate_set.json]
    then: "pma_cards.py triggers --conditions conditions.json --export aqe_daily_export.json --broker-stops broker_stops.json --out cards.json"
    produces: [conditions.json, conditions.md, conditions.html, cards.json]
    barrier: "pma_conditions.py exits 0"
    on_fail: "declare it; LEVELS then runs without --conditions and the alert file carries triggers only"
    meter: "--tool-only"
    must_also: >
      D123: copies the verdicts, decides nothing. Puts numbers on every analyst's named levels, lists what
      the supporters share and every exit line highest first. conditions.md goes in the brief;
      conditions.html (ticker -> block) goes under each card in the report. Unresolved levels are declared.

  - name: REPEAT-WATCH
    kind: tool
    command: "pma_pipeline.py repeat-watch --ledger phase4_ledger.json --verdicts verdict_ledger.json --date <date> --out repeat_watch.json"
    then: "purity_check.py --export <export>"
    reads: [phase4_ledger.json, verdict_ledger.json]
    produces: [repeat_watch.json, purity_check.json]
    barrier: "purity_check invariance == PASS"
    on_fail: "do not publish on that ranking; fix at RANK, max 2 loops, else watch-table-only declared"
    meter: "--tool-only"

  - name: BRACKET
    kind: tool
    command: "pma_pipeline.py brackets --consensus consensus.json --phase4 phase4.json --export <export> --date <date> --out brackets.json"
    reads: [consensus.json, phase4.json, aqe_daily_export.json]
    then: "pma_pipeline.py repeatmarks --ledger verdict_ledger.json --consensus consensus.json --brackets brackets.json --date <date> --out repeat_marks.json"
    produces: [brackets.json, repeat_marks.json]
    rulings: [R1, R19]
    must_also: >
      PM ruling 2026-09-25: queue levels for every ADVANCE and HOLD-FOR-CONDITIONS name. This gives
      brackets.json its FIRST PRODUCER -- it had been a declared gap on five consecutive runs, which
      meant every level on every card was hand-picked rather than computed. R1 IS NOT WEAKENED:
      brackets attach AFTER the vote, are render-only, and can never reach a seat, a door, the tally,
      the ranking or a verdict; purity_check still proves rank invariance to every bracket field. A
      HELD name is skipped by design with a stated reason -- you do not bracket what you already own.
      Sizing needs dynCap from the journal, which the committee run does not carry, so a bracket
      without it returns LEVELS and refuses to SIZE; `sized` says which, per name.
    repeat_marks: >
      R19 (PM 2026-09-25): the same step also writes repeat_marks.json, which puts the committee's own
      memory on the FACE of every verdict -- consecutive-advance streak, drift since the streak started
      AND since the first call ever, plus REVERSED and LEFT_THE_ROOM for names the committee has turned
      on. It runs after brackets because the STANDING/DRIFTED separator is the name's own computed stop
      distance. Nothing here changes a verdict, a conviction or an ordering.
    meter: "--tool-only"

  - name: SCORECARD
    kind: tool
    command: "pma_scorecard.py grade --ledger verdict_ledger.json --closes closes_scorecard.json --export <run_date>=<that run's aqe_daily_export.json> (one per graded run) --asof <last close> --horizon 5 --beta-cap 2.5 --out scorecard.json --md scorecard.md --html scorecard.html --log scorecard_log.jsonl"
    reads: [verdict_ledger.json, closes_scorecard.json, aqe_daily_export.json,
            "scorecard_log.jsonl (yesterday's, read from AQE main aegis/output/pma/scorecard_log.jsonl BEFORE today's push)"]
    produces: [scorecard.json, scorecard.md, scorecard.html, scorecard_log.jsonl]
    barrier: "pma_scorecard.py exits 0 -- exit 3 means a ledger price disagrees with the close it would be graded from"
    on_fail: "re-pull the disagreeing closes once; if still refused, publish the scorecard with the refused rows declared"
    meter: "--tool-only"
    must_also: >
      D122.1 (PM 2026-10-01): every call is graded three ways -- vs SPY, vs the equal-weight AQE list it
      was picked from, and net of beta -- with median and share-that-beat beside the mean. closes_scorecard.json
      is written by the daily AQE run (PM 2026-11-03; src/pipeline/committee_data.py): the panel's closes (or FMP's
      daily bars for a ledger name the panel does not hold) for every ledger name in the last 45 days, every export
      name and SPY, with `_missing` naming any it could not serve. Exit 3 (a ledger price disagrees with its close):
      re-pull ONLY the disagreeing closes once, by hand, and say so. The brief and the card report carry
      scorecard.md in place of any hand-built performance table; the card report embeds scorecard.html.
      MONITORING (PM 2026-10-01: "add this scorecard into daily PMA output, keep it running so we can log
      and monitor ... will review after 2 weeks"): scorecard_log.jsonl gains one line per close (a re-run
      replaces that close's line) and is pushed at PUBLISH to AQE main aegis/output/pma/scorecard_log.jsonl,
      read back and blob-verified like the levels file. A run that cannot push declares it; the log is never
      rebuilt from memory. Review due 2026-10-15. Grading only: it changes no verdict.

  - name: WRITE
    kind: model
    spawns: 1
    seats: [brief-writer]
    reads: [consensus.json, phase4.json, tally.json, pm_lens.json, repeat_watch.json,
            purity_check.json, forms/**, skills/cio-voice/SKILL.md,
            aegis-voices/skills/weather-crown/SKILL.md, aegis-voices/skills/weather-valen/SKILL.md]
    spawn_as: >-
      general-purpose with agents/brief-writer.md AND skills/cio-voice/SKILL.md inlined, plus the two WEATHER
      cards (aegis-voices skills/weather-crown + weather-valen, 2026-11-01) read by path before the weather paragraphs.
      The brief-writer agent type returned tool_uses:0 twice on 2026-09-02 -- it printed
      unexecuted tool syntax as plain text and produced nothing. This is the pattern that
      works, recorded so it is not rediscovered every run.
    d123: >
      R21: put conditions.md in the brief under the cards, and conditions.html's block under each card in the
      report (who said what, in plain words). Any trade_above entry in cards.json uses yesterday's INTRADAY
      high (bar_high), never yesterday's close or high_52w (a closing high) -- LEVELS refuses a line pinned
      to the close.
    produces: [pma_brief_<date>.md, cards_text.json]
    cards_text: >
      R23: the writer ALSO writes cards_text.json -- WORDS ONLY, schema in agents/brief-writer.md
      (bottom line, market reads, money, book, changed, one case+why+readiness per ADVANCE, one line per
      HOLD and PASS, plan, caveats). Every number on the card report comes from the run files, not this file.
      The trigger levels in cards.json are tool-built at CONDITIONS; WRITE never hand-builds triggers.
    sections: ["0 verdicts", "0A executive consensus", "0B what these were picked on + momentum fit",
               "1 macro", "1A valen", "2 sectors", "3 held book", "4 repeat watch", "5 QS", "6 PM lens",
               "7 cards", "8 near misses", "9A what to do with what I own", "9B what to trade today",
               "9C the day's plan", "A vote record"]
    the_five_questions:
      1: "market shape / regime / macro -> S1"
      2: "sectors and thematics showing signal -> S2"
      3: "what to do with what I own -> S3 + S9A"
      4: "what to trade today -> S0/S0A/S0B + S9B"
      5: "the day's plan -> S9C"
    rulings: [R1, R9]
    must_also: >
      Narrative only — changes no verdict, ranking, conviction or cap. A missing input renders as
      a one-line declared gap. THE BRIEF ALWAYS LANDS.
    checkpoint_after: true        # the brief itself; S7 requires it to reach a fixed GitHub path
    meter: "--spawns 1"

  - name: CHECK
    kind: tool
    command: "pma_pipeline.py gate --brief pma_brief_<date>.md --consensus consensus.json --verdict-ledger verdict_ledger.json --date <date>"
    barrier: "0 FAIL"
    on_fail: "fix at the owning stage, max 2 loops, residuals declared in the footer"
    meter: "--tool-only"

  - name: LEVELS
    kind: tool
    command: "pma_levels.py emit --date <date> --window 3 --conditions conditions.json --slate slate.json --history <yesterday's aegis/output/pma/pma_levels.json from AQE main, read BEFORE today's push> --out pma_levels.json"
    reads: [consensus.json, brackets.json, repeat_marks.json, cards.json, broker_stops.json, candidate_set.json, phase4.json, conditions.json]
    produces: [pma_levels.json]
    barrier: "pma_levels.py exits 0 -- it REFUSES to write on a broken contract"
    on_fail: "fix cards.json at WRITE (the conditions must be numbers), max 2 loops; if still refused, publish nothing to AQE and declare it"
    rulings: [R1, R17, R20, R21]
    must_also: >
      R20 (PM 2026-09-30): the committee's levels leave the run as numbers AQE's 15-minute alert loop
      watches, so actionable items reach the PM's inbox in market hours. One row per ADVANCE,
      HOLD-FOR-CONDITIONS, HELD and WATCH name. The tool REFUSES if a HOLD condition has no trigger and
      no stated not_structured_yet reason, if a WATCH row carries a trigger (R17), or if a committee exit
      line sits BELOW the PM's broker stop (a committee line may never loosen a stop he has).
      Render-only: nothing here places, changes, cancels or sizes an order.
      R40 (PM 2026-11-02): --slate slate.json carries the MARKET KILL line into pma_levels.json as top-level `market_kill`
      {symbol, word, level, plain, seats} so the alert loop can say 'market condition broken -- take no new triggers'. A held
      name on HOLD-FOR-CONDITIONS gets its hold card from the shared ADD line (pma_cards.py triggers, fixed 2026-11-02).
      R41: no Valen flag reaches this file.
      R20.1 ROLLING WINDOW (PM 2026-09-30): the file carries the last THREE runs additively, because a
      committee level often triggers a session or two late. Read yesterday's published pma_levels.json from
      AQE main (git fetch is read-only and works) BEFORE pushing today's, and pass it as --history; it already
      carries its own window, and the cut is made on each row's origin run. Dated archives are also accepted. Today wins on any name voted
      today; PASS today, a broken kill line, HELD/WATCH from earlier runs and anything older than the
      window are retired with a reason; every trigger id is stamped <origin_run>:<id> so AQE remembers a
      fire for the row's whole life. A missing history file is declared, never fatal.
    meter: "--tool-only"

  - name: REPORT
    kind: tool
    command: "pma_cards.py render --text cards_text.json --position committee_position.json --out pma_cards_<date>.html"
    reads: [cards_text.json, consensus.json, aqe_daily_export.json, cards.json, brackets.json, broker_stops.json, phase4.json, aqe_valen_dashboard.json, aqe_crown_macro.json, scorecard.md]
    produces: [pma_cards_<date>.html]
    barrier: "pma_cards.py exits 0 -- it REFUSES (exit 2) a words file missing any ADVANCE card, HOLD line or PASS line"
    on_fail: "fix cards_text.json at WRITE, max 2 loops; the markdown brief still lands"
    rulings: [R23]
    must_also: >
      R23 (PM 2026-10-23: "why is the PMA report format always changing, the cards form always works the
      best"). The card report is the PM's primary read and its LAYOUT IS FIXED IN CODE (pma_cards.py render);
      never hand-write or restyle the HTML. R41 (PM 2026-11-02): Valen's no-buy / parabolic flags do not print on any card,
      hold row or pass row -- Valen is Part 1 weather only. Publish it with the Artifact tool to the ONE fixed URL in
      parameters.card_report_artifact (update in place, never a new artifact per day), then print the link.
    meter: "--tool-only"

  - name: PUBLISH
    kind: tool
    checkpoint_after: true        # the LAST push: the manifest with every step ticked reaches main for the 18:00 gate
    produces: [publish_receipt.json, remote:aegis/output/pma/pma_levels.json, remote:aegis/output/pma/levels/<date>.json, remote:aegis/output/pma/scorecard_log.jsonl]
    rulings: [R10, R20]
    push_levels: >
      R20: push pma_levels.json to TongIncomeWheel/AQE branch main at BOTH
      aegis/output/pma/pma_levels.json (the file AQE's alert loop reads) and
      aegis/output/pma/levels/<date>.json (the dated record), with cards.json and broker_stops.json
      beside the dated copy. Use the GitHub connector (push_files, one commit) or tools/git_sync.py.
      THE PATH MUST STAY UNDER aegis/output/ -- .github/workflows/deploy-hf.yml rebuilds the HF Space on
      every push to main EXCEPT aegis/output/**, so a levels file written anywhere else would redeploy the
      Space every morning and kill the container mid-run. A failed push is declared in the brief header and
      the PM is told plainly that today's levels are NOT being watched.
      READ-BACK, ALWAYS: after the push, fetch aegis/output/pma/pma_levels.json from origin/main and compare it
      with the run's file (parsed JSON equality). The connector takes the file as inline text; on 2026-09-30
      the first push carried one transcription slip (APH mp 56.0 for 60.0) that only the read-back caught.
      Mismatch -> re-push, then re-verify; never tick PUBLISH on an unverified file. The durable fix is a
      byte-exact git push (tools/git_sync.py), which needs TongIncomeWheel/AQE added to the session's
      authorised repositories -- a PM action.
    push_scorecard: >
      D122.1: push scorecard_log.jsonl to aegis/output/pma/scorecard_log.jsonl and scorecard.md to
      aegis/output/pma/scorecard/<date>.md in the same commit as the levels (scorecard.json, ~150KB, is too large to transcribe through the connector and is rebuildable from the ledger and closes). Same path rule (stay under
      aegis/output/), same read-back (fetch, compare blob sha to `git hash-object`), same declaration on failure.
    objection_channel: >
      PM 2026-11-01 ("by 6pm I approve, or by default it loads"): the levels stand unless the PM objects by 18:00 SGT.
      The objection is a FILE -- aegis/output/pma/run/<date>/PM_OBJECTION.md on main, any content -- or a message in
      the project. `check.py chain` FAILs when that file exists, so the 18:00 gate refuses the default load; the REPORT
      line tells the PM the path. Nothing in the run writes or deletes that file.
    desk_done_message: >
      PM 2026-11-02 ("the report appears on the desk automatically each day; the conductor needs a done message to
      the desk"). AFTER the FINAL checkpoint has reached origin/main and `check.py chain` has run, send ONE short
      message with `send_message` to parameters.desk_session (the PMA desk). Content, plain text, no attachment:
      "PMA DONE <date>. Chain: <the check.py chain verdict line, Healthy or the FAIL lines>. Slate <n>; AGREED <a>,
      CONTESTED <c>, PASS <p>. Files on main under aegis/output/pma/run/<date>/: pma_cards_<date>.html,
      pma_brief_<date>.md, run_notes.md. Est tokens <n>, wall clock <hh:mm>." The desk does NOT trust the message:
      it re-reads main, re-runs the chain check and then shows the Cards and brief to the PM. Therefore the
      Cards HTML, the brief and run_notes.md MUST be in the final checkpoint's --paths (add pma_cards_<date>.html
      pma_brief_<date>.md run_notes.md to the final `git_sync.py` call) -- the desk renders from main, not from your
      disk. If the send fails, say so in your DONE push to the PM; never retry in a loop. When the run STOPS stuck,
      send the same one-liner starting "PMA STUCK <date>: <step>, <reason>" so the desk can tell the PM which
      step is waiting.
    must_also: >
      Write publish_receipt.json in the run dir: {pushed: [paths], read_back: {path: sha_match}, at} -- the tick
      checks THAT file; the remote paths are declared and proven by the read-back, not by a local existence test.
      Print the full brief on screen — the brief in chat is the deliverable, not the files.
      Report the run's est_tokens and wall clock from `registrar.py status` in one line.
    meter: "--tool-only"
