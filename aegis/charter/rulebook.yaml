meta:
  version: 1.1.0-draft
  ratified: false
  review_by: '2026-10-18'
  note: 'LAW: doctrines and structures — committee + PM ratification to change. Numbers
    live in parameters.yaml.'
identity:
  doctrine: 'Aegis is ONE of THREE strategies sharing co-mingled capital across TWO
    brokers (D-17). The other two (Income Wheel, Protege9) are out of scope for this
    kernel entirely — Aegis must never read, size against, or risk-gate their positions,
    and must never assume a broker account''s totals belong to it alone.'
  strategy_tag: AEGIS
  other_strategies_for_context_only: [income_wheel, protege9]
  brokers: [tiger, ibkr]
  order_tagging:
    internal: 'ACHIEVABLE NOW, our own audit trail: every staging-gatekeeper record
      (preview, confirm, refusal) is stamped strategy_tag=AEGIS and broker={tiger|ibkr},
      cross-referenced to the broker''s own returned order id once filled. This is
      law regardless of what the broker itself displays.'
    broker_native: 'BLOCKED as of 18 Jul — the current Tiger/IBKR MCP tool wrappers
      (place_stock_order, create_order_instruction) expose no client-order-tag, remark,
      or reference field; the underlying broker APIs likely support one but the MCP
      surface Aegis is required to reuse (PM ruling: do not rebuild Tiger/Alpaca MCPs)
      does not pass it through. Interim (Phase 1 only, PM stages personally per RB:orders.phase_1):
      the staging preview MUST instruct the PM to add an AEGIS tag/memo manually in
      the broker''s own app at submission. Real fix is BL-028 (MCP passthrough param
      — needs the PM, as owner of that hosting relationship, to request it) or Phase
      2 auto-staging simply cannot claim broker-native tagging until it ships.'
  capital_segregation: 'Aegis''s dynCap (RB:capital.dyncap_method) is computed from
    AEGIS-tagged positions/fills ONLY, never from co-mingled broker account totals.
    RB:risk.gates (beta/VaR/leverage/combined-stop) apply to the Aegis sub-fund book
    exclusively. Positions predating this rule carry no tag and cannot be attributed
    automatically — BL-027 is the one-time PM reconciliation that seeds the split;
    until it''s done, any risk-gate reading taken from raw broker totals is provisional
    and must say so.'
capital:
  dyncap_method: prior dynCap + realised P&L from CLOSED trades only; never recomputed
    from market value; computed on the AEGIS-tagged book only (RB:identity.capital_segregation),
    never on co-mingled broker totals
  sizing_steps: 'two-step mandatory: R-size then vol-cap; take the smaller (tools/calculators/sizing.py)'
risk:
  beta_gate_window: beta_30d (D-6 FINAL; beta_60d = monitoring colour only, never
    a gate input)
  breach_rule: combined stop risk breach leads every output until resolved
universe:
  frequency: daily_premarket
  ledger_continuity: names that leave the screen remain tracked in the Nomination
    Ledger until their 15-day window closes
  pm_rationale: 'PM rationale on record: if a name drops out, the signal was not strong
    or persistent'
committee:
  voices_active:
  - lynch
  - oneil
  - wyckoff
  - raschke
  - steenbarger
  - thorp
  - seow
  - minervini
  - druckenmiller
  voices_reserve:
  - demark
  - pardo
  - elder
  - dalio
  - murphy
  detect_lens_seat: true
  non_deliberated_output: ranked watch table in the daily plan; all nominations recorded
    in ledger regardless
  macro_brief_first: druckenmiller
  bear_case_mandatory: true
  unanimity_challenge: preliminary >= 6/7 agreement triggers rotating adversarial
    challenge (thorp/pardo/steenbarger)
  event_filter:
    mna: announced or rumoured bid / strategic review -> EVENT-DRIVEN, cannot advance
    activist: hostile campaign / board action -> EVENT-DRIVEN, cannot advance
    single_catalyst: '>15% move in <10 days on one announcement -> EVENT-DRIVEN, cannot
      advance'
  anti_anchoring: voices nominate from the same universe file in isolation; no pipeline
    tags, no detect reveals, no ordering hints pre-nomination
  event_filter_timing: post-nomination, pre-deliberation, on nominated names only
    (D-11); flagged names visible but cannot advance
brackets:
  source: AQE export bracket object, verbatim; never recomputed by an agent
  validity_gates: atr>=RB:risk.per_trade.stop_atr_distance_min AND rr>=RB:risk.per_trade.rr_min_to_tp2
    AND risk% <= RB:regime.stop_pct_ceiling
  entry_orders: LIMIT
  exit_orders: MARKET
  stop_staging: only after fill confirmed, at actual fill price; post-fill actual-risk
    check, flag if delta > $50
orders:
  sole_path: staging-gatekeeper is the ONLY agent that may produce previews, confirm
    orders, or run post-fill; orchestrators may only request
  default_mode: PREVIEW — every passing request ends as a preview for the PM to act
    on
  autopilot: PM-owned switch, default OFF. When the PM arms it (tools/autopilot.py,
    logged, with expiry), the gatekeeper — and no other agent — may execute the Tiger
    two-step (place preview -> confirm) for APPROVED preauthorised plan names, inside
    RB:autopilot window and caps. Any auto_off condition disarms immediately. Tiger
    is default execution broker.
  arming: only the PM can arm; arming is a dated, logged, auto-expiring state — never
    a standing default
  phase_1: 'pre-authorised conditional brackets: PM approves exact if/then orders
    by 21:00 SGT and stages them personally in the broker; the system monitors only
    unless autopilot is armed'
regime:
  red_rule: no new entries
  hurst_note: MEAN_REVERT label is surfaced to committee as caveat; throttles deployment
    posture, never the list
srm:
  role: context_only
  layers: 11 GICS sector ETFs + thematic baskets, RRG quadrants; full trend_state
    label always shown with grade
model_tiers:
  doctrine: 'three planes, three cost tiers (D-16), scope-not-capability (D-18 correction).
    Judgment plane (the 10 voices, the 5 Engineering Bench seats, committee-desk
    deliberation, the Intraday Review Pod) ALWAYS runs RB:model_tiers.judgment —
    pinned explicitly inside every compiled agent file itself, never left to inherit
    whatever tier the orchestrator session happens to be running that day; its job
    is open-ended multi-framework analysis with no fixed ruleset. Control plane (the
    orchestrator executing each process skill, the exception ladder, staging-gatekeeper''s
    checklist relay) runs RB:model_tiers.control — a genuinely capable model, not
    the cheapest available, because it exercises real autonomous judgment inside
    a BOUNDED ruleset (which degradation path applies, whether an anomaly warrants
    disarm-first, how to phrase a page or summary for the PM) — this is different
    scope from judgment plane, not less intelligence. Data plane (tools/*.py) runs
    no model at all — plain deterministic code, zero LLM cost, unchanged by this
    doctrine.'
  never_silent_downgrade: 'a judgment-plane agent tier is pinned in its own file
    at build time (inline_rb), so a PM switching the cockpit or orchestrator session
    to a cheaper model for cost reasons can never accidentally downgrade a voice,
    a bench seat, or a deliberation without a deliberate parameters.yaml change'
  verify_not_assume: 'model pinning is a documented capability on both platforms
    but community reports exist of it being silently ignored on Claude Code in some
    versions; confirm actual behaviour via the usage/cost dashboard in the practice
    week (BL-026), not by assumption'
topology:
  engines: Claude cloud workspace (primary, sole order path) + KimiClaw cloud workspace
    (full parallel shadow) each run the scheduled phases on their own schedulers (D-15);
    Kimi engine live only after smoke test passes (BL-021)
  pc_role: AQE feed server + intraday alert watcher ONLY; every export/alert pushed
    to GitHub immediately on write — the clouds' fresh-feed source (BL-022)
  cockpit: ONE command surface — the Claude app chat. All approvals, arming, steering
    there and nowhere else; the Kimi surface is read/diff only
  kimi_credentials: read-only broker data permitted (scoping BL-023); NO order-capable
    credential ever enters the Kimi cloud; staging-gatekeeper ships only in the Claude
    package
data_sources:
  scores_and_analytics: AQE export (GitHub repo engine) — verbatim
  equity_spot_live: Tiger MCP (cloud-hosted, reuse) -> IBKR fallback
  options_chain_greeks: Alpaca MCP (cloud-hosted, reuse; 15-min delayed) — never for
    spot
  bars_and_screen: FMP
  positions_fills: IBKR + Tiger connectors/MCP; broker pull is execution truth
  currency: USD_only
  staleness: export older than T-1 must be flagged and PM-acknowledged before use
journal:
  naming: aegis_journal_YYYY-MM-DD.json; one canonical current file; dated files immutable;
    no CORRECTED/SUPERSEDED/Copy-of suffixes ever again
  retention: current + dated archive; Drive sync is replication, not the access path
audit:
  completeness: every voice ran; every deliberated name addressed; every data pull
    tagged source+time
  breach_classes:
  - PROTOCOL_FAILURE
  - FIELD_MISREAD
  - FABRICATION
  - CONDUCT_FAILURE
exceptions:
  ladder: DETECT (checks are built into every step) -> RETRY ONCE (transient service
    pulls only, never validation failures) -> DEGRADE along a NAMED safe path only
    -> STAND DOWN fail-closed when no safe path exists -> DISARM FIRST if autopilot
    is armed and anything is in doubt -> RECORD an exception file always -> NOTIFY
    by severity
  classes:
  - DATA_MISSING_OR_STALE
  - DATA_INVALID
  - SERVICE_UNREACHABLE
  - AGENT_FAILURE
  - STATE_CORRUPT
  - MISSED_CLOCK
  - HUMAN_ABSENT
  gate_refusals_are_not_exceptions: a gatekeeper refusal is a designed outcome with
    its own record, never an error
  page_now:
  - tripwire BLOCK
  - journal fails validation or is PROVISIONAL
  - any fabrication finding
  - any anomaly during an armed session
  - alert engine not alive at watch-window start
  - broker unreachable while armed
  morning_summary:
  - voice shortfall (ran with 8-9 of 10)
  - hedge check skipped on tool failure
  - GitHub push queued after retry
  - single-name data gaps
  - CS Weekly missing
  named_degradations:
    voice_fails: re-spawn once; still invalid -> proceed with the remaining voices
      (minimum 8), tally notes the empty seats, auditor flags the session INCOMPLETE
    hedge_tools_fail: plan ships WITHOUT the hedge block, flagged in the plan headline
    ibkr_down_at_reconcile: Tiger-only reconcile, journal marked PARTIAL_SOURCES,
      page
    broker_pulls_down_at_reconcile: journal built from gatekeeper records only, marked
      PROVISIONAL -> downstream mutations HALT (ledger, held-list emit), page; engine
      reuses last GOOD journal
    github_push_fails: retry once, then queue the commit locally and note in the morning
      summary
    spot_fails_at_revalidation: that trigger stands down, logged MISSED_BY_FAILURE
      (distinct from MISSED-BY-DESIGN); never confirm on stale spot
  no_safe_degradation:
  - 'feed missing/stale or tripwire BLOCK -> the whole premarket stands down: no plan,
    no alerts loaded, nothing armed; held book protected by broker-side stops'
  - universe screen cannot run -> premarket stands down (voices have nothing lawful
    to read)
  - journal invalid -> everything downstream of it halts
  - autopilot state unreadable -> OFF (already in the tool)
  missed_clock: 'a run that never fired or overran is itself an exception: next run
    detects the gap via freshness checks; a stood-down trading day = no new trades,
    broker stops still protect the book; post-market NEVER skips — it records the
    quiet day'
  recovery: next scheduled run self-heals where a fresh input fixes it; anything else
    becomes a backlog item automatically
