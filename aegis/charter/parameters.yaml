meta:
  version: 1.0.0
  note: PM-TUNABLE parameters. Change via tools/set_param.py (plain-English through
    the agent) — every change auto-logged to decisions_log.md. Law lives in rulebook.yaml
    and needs committee.
sub_fund:
  note: 'D-21/D-23: Aegis sub-fund capital moved to a plain editable file — config/aegis_fund.md
    (PM ruling: a simple MD I can adjust). That file is the ONE place; read it via
    tools/fund_config.py. Not duplicated here.'
capital:
  one_r_pct_of_dyncap: 1.5
  sizes:
    standard_r: 1.0
    high_conviction_r: 2.0
    runner_hedge_addon_r: 0.5
    catalyst_unconfirmed_r: 0.5
  vol_cap_pct_of_dyncap:
    GREEN: 2.0
    YELLOW: 1.5
trailing:
  note: 'D-33 exit lifecycle — PM-tunable. Hybrid trail (breakeven then structure ratchet),
    milestone locks, scale-out. Engine: tools/calculators/trailing_stop.py; owner: Risk desk.'
  breakeven_trigger_r: 1.0        # move stop to breakeven after +1R
  breakeven_buffer_pct: 0.0       # optional cushion above entry at breakeven
  ratchet: true                   # a trailing stop NEVER lowers — invariant
  structure_source: AQE operative stop (fresh daily) — never below current stop
  milestone_locks: true           # after TP1 -> stop>=entry; after TP2 -> stop>=TP1
  structural_buffer: 0.3          # D-35: when price CLEARS a structural level (20MA/fib), tuck the
                                  # stop this % BELOW the reclaimed level (the "just below" cushion)
  scale_out:
    tp1_fraction: 0.33            # take 1/3 of original at TP1
    tp2_fraction: 0.33            # take 1/3 of original at TP2
    remainder: runs on the trail  # the last third rides the trailing stop
  cadence: daily post-market recompute for next session + intraday tighten on a target hit
risk:
  gates:
    portfolio_beta:                       # BL-030 (PM 2026-07-19): weighted-beta soft 2.0 / hard 2.5
      soft: 2.0
      hard: 2.5
    var_95_1m_pct_of_dyncap:              # BL-030: PM set 1-month VaR 20% as the HARD cap; soft warning 18
      soft: 18
      hard: 20
      method: parametric                  # D-42 (PM ruling): single-factor variance-covariance VaR,
      #                                     95% one-month, z=1.645, computed by tools/calculators/var_parametric.py
      #                                     from per-name exposure (PTJ) + beta/vol (AQE export) + SPY vol (historical store).
      #                                     NOT historical/simulated. Checked on the POST-ADD book -> var_ok for gate_check.
    leverage_x_dyncap:
      soft: 2.5
      hard: 3.0
    combined_stop_risk_pct_of_dyncap_max: 12   # BL-030: PM "total known risk 12%" (sum of open distance-to-stop)
    sector_exposure_pct_of_dyncap:      # D-34: single-sector concentration on the held book
      soft: 25                          # flag for rotation review
      hard: 35                          # over-exposed — rotation candidate
  per_trade:
    rr_min_to_tp2: 2.0
    stop_atr_distance_min: 1.0
regime:
  vix_bands:
    GREEN: <18
    YELLOW: 18-25
    ORANGE: 25-30
    RED: '>30'
  stop_pct_ceiling:
    GREEN: 12
    YELLOW: 8
    ORANGE: 6
  atr_stop_multiple_base:
    GREEN: 1.5
    YELLOW: 2.0
    ORANGE: 2.5
  elder_adjustment:
    8-10: -0.25
    5-7: 0.0
    1-4: 0.5
  atr_multiple_clamp:
  - 1.0
  - 3.5
universe:
  screen:
    market: US primary listings, common stock only
    price_vs_ema: close at/above ANY of EMA20, EMA50, EMA100
    market_cap_min_usd: 2000000000
    volume_rule: current volume >= 30-day average volume
  near_miss:                 # D-37: names just outside the screen are SURFACED (not nominated) for PM/committee revival
    ema_band_pct: 2.0        # close within 2% below the nearest EMA
    vol_band_pct: 10.0       # volume within 10% below the 30-day average
committee:
  nominations_per_voice: 10
  deliberation_threshold: nomination_count >= 2 OR lens top tier OR (single nominator AND
    conviction >= solo_high_conviction_min)   # D-37: a strong lone signal isn't cut early
  solo_high_conviction_min: 4                  # a single voice at >=4/5 earns full deliberation
  conviction_high: 7            # D-55: >=7 voices nominating a name = high conviction (roster now 11; supersedes stale "5 of 9")
quality_flags:                 # D-39: thresholds for the restored voice quality-evaluation flags
  # SOFT signals surfaced at deliberation (D-37/D-38) — never a gate. tools/quality_flags.py reads these.
  squeeze_min: 5.0             # energy.squeeze_score at/above -> volatility squeeze (breakout pending)
  base_dur_min: 10             # bq.bq_base_dur (days) minimum for a "tight base"
  range_tight_min: 12          # bq.bq_range_tight minimum (paired with base_dur) for a tight base
  overextended_sma_pct: 25.0   # sma_distance_pct at/above -> extended, late to chase
  rs_down_day_min: 2.0         # rs_down_day_20d at/above -> resilient on down days
  knn_prob_min: 0.6            # knn_prob at/above (AND knn_significant) -> favorable historical edge
data_sources:
  ptj:                                    # D-21/D-41: the Aegis book source of truth (held book + dynCap mark)
    drive_folder_id: '15PR74ws_kTXTqCcEfRGga_jjHrMvbCEM'   # unchanged from before (PM 2026-07-19); also in config/aegis_fund.md
    read: latest dated file matching aegis_trade_journal_YYYY-MM-DD_PTJ.json (the /ptj skill's output name — do NOT rename)
    archive_master: aegis_trade_journal_ARCHIVE_master.json
    written_by: the /ptj (print-trade-journal) skill — same write location & naming as before; the kernel only READS it
    used_for: premarket step 4 held-book read + mark-to-market dynCap refresh (dyncap_ledger.py update)
  staleness: plan/export/journal older than the current session date is stale — fix or stand down (premarket step 1)
schedule:
  weekly_run: Sunday
  premarket_plan_ready: '16:00'
  pm_approval_deadline: '21:00'
  autonomous_window: 21:30-05:30 SGT (US session to the fixed 05:30 autopilot expiry, D-7a; the old 10:00 cap is RETIRED — MED-2 fix)
  us_market_hours_sgt: 21:30-04:00 (summer)
  morning_summary: '10:00'
  market_watch_mode: code watches (AQE alert engine); committee wakes on trigger only
    — no timed AI polling loops
  alert_feed_minutes: 15                    # D-62: AQE writes alerts every 15 min to the inbox (not email)
  alert_scope: today_strong_momentum_universe   # D-62 (supersedes D-54 full_universe): scope, not cadence, kills the noise
  alert_inbox_path: data/alerts/DATE/inbox.jsonl   # D-62: AQE writes here; session sweeps via tools/alert_inbox.py
  market_watch_sweep_minutes: 15            # session sweep cadence over the inbox; pod runs only on pre-filtered survivors (cheap)
  market_watch_triggers: [breakout, stop_hit_or_approaching, approaching_buy]
flag_condition:                  # D-57: RATIFIED replacement for the rudimentary sc_momentum>70. Builds the SOD quality WATCH SET; the live price then TRIGGERS (D-54). Everything except event_clear is a SCORE, never a gate (D-4/D-52 doctrine).
  hard_gate: event_clear         # the ONLY binary exclusion (D-11). An earnings/event name cannot flag.
  score_factors:                 # weighted, not all-or-nothing
    - structure_integrity        # structure, structure_shift (reward BOS/tight base; penalise CHoCH)
    - participation              # DISCRIMINATING combo: rvol>=1.5 AND flow>0 AND rs_spy_20d>0 (rs_leadership==LEADER is table-stakes, weak alone)
    - detect_lens                # lens_positive >= 4 of 6
    - elder_force                # elder_5d rising; elder_pattern in {ACCELERATION, CORRECTION_REENTRY}; penalise INTERRUPTED
    - bracket_exercisable        # a workable stop exists via the bracket exercise (D-52) — soft
    - extension_penalty          # large sma_distance_pct penalised in mean-revert tape
    - sector_rotation_alignment  # sector_rrg in {LEADING, IMPROVING} rewarded; the de-rate engine penalised
  composite_rank: tiebreak_only  # sc_momentum/rank DEMOTED from driver to floor/tiebreak — a high score is a caution in a de-rate
  profile: robust_first          # D-57 (Pardo guard): ship ONE robust profile now (structure+participation+event_clear+extension). The regime-adaptive/sector-rotation reweighting is BEHIND walk-forward validation before it goes live — no shipping an in-sample fit.
  tiers: {WATCH_A: high_threshold, WATCH_B: lower_threshold_visible_not_discarded}  # filtered names stay VISIBLE (WATCH_B), never silently dropped — use all the data (PM)
retention:
  raw_days: 30
  ledger_window_days: 15
  learning_lookback_days: 5
  archive: monthly zip to Drive after raw_days; rollup summary kept forever
autopilot:
  default: OFF — preview only, always
  max_r_per_order: 1.0
  max_orders_per_session: 3
  scope: ONLY tickers on today's PM-APPROVED plan with preauthorised=true
  auto_deliberate_execute: OFF   # D-58: when the PM ARMS this, an intraday mover is auto-deliberated (judgment tier) and, if it clears the consensus bar, auto-executed within caps via the gatekeeper. Default OFF — routine watch is haiku, preview-only.
  auto_execute_consensus_min: 6  # D-58 (PM): auto-execute only if the quick deliberation reaches >=6 voices in consensus. Below 6 -> page the PM, never auto-fire.
  auto_off_on:
  - tripwire block
  - any portfolio gate breach
  - broker error
  - window end
  - expiry
  expiry: fixed 05:30 SGT next occurrence — definitive, no timezone math (D-7a)
  window: arm at/after plan approval; expires 05:30 SGT — covers the full US session
    summer or winter
performance:
  note: 'Success criteria evaluated EVERY post-market by the scorer (D-14). Verdicts:
    PASS / WATCH / FAIL. All bands PM-tunable.'
  voice:
    eval_window_sessions: 15
    hit_d5_min_pct: 45
    excess_d5_vs_universe_min_pct: 0.0
    watch_band_pct: 5
    fail_consecutive_windows: 2
    detect_seat_eval_horizon_months: 12
  committee:
    advanced_vs_watchtable_excess_d5_min_pct: 0.5
    bear_case_present_pct_min: 100
  plan:
    trigger_fire_rate_band_pct:
    - 10
    - 60
    missed_by_design_avg_move_tracked: true
  execution:
    slippage_vs_plan_max_bps: 50
    unjustified_refusals_max_per_week: 0
  system:
    runs_on_time_pct_min: 95
    page_exceptions_max_per_week: 3
    journal_validation_fail_max: 0
  memory:
    standing_lessons_max_per_voice: 5
    lesson_expiry_sessions: 30
    open_nominations_shown_max: 10
model_tiers:
  note: 'PM-tunable per D-16. Judgment = analysis/deliberation, always the top reasoning
    tier. Control = orchestration/sequencing, the economy tier. Cockpit = the phone
    chat surface. Data plane tools/*.py take no model at all, unaffected by this
    block.'
  judgment: opus
  control: sonnet
  cockpit: sonnet
  watch: haiku                   # D-58: the CHEAP tier. The 30-min market-hours poll (held-book checks + off-plan scan) runs here by default. Escalate to judgment ONLY on PM request or an armed auto-deliberate. Anti-overfit/anti-cost: never spend opus on a routine poll.
  kimi_judgment: kimi-for-coding-highspeed
  kimi_control: kimi-for-coding
notifications:   # D-45/D-46: PM-tunable — which operational events ping the phone. Emitter tools/notify.py (order-blind).
  channel: cowork              # D-46 (PM): PILOT runs on Claude Cowork — the run's message rides the scheduled-task NATIVE push; no external service. whatsapp is the POST-MIGRATION channel, OFF until AEGIS_NOTIFY_CHANNEL=whatsapp.
  pre_run_minutes: 15          # heartbeat lead time (used by the pre-run heartbeat task)
  on:                          # events that ping (PM: all pings on, 2026-07-19)
    pre_run: true
    run_ok: true
    run_fail: true             # ALWAYS on and visually unmistakable — the failure page is the point
    healed: true
    alert: true
  key_runs:                    # the runs that get a T-minus pre-run heartbeat
  - premarket
  - ptj
  - post_market
  quiet_hours: none            # no suppression — PM wants all pings (2026-07-19)
  migration:                   # D-46: activated only AFTER the pilot, on the local box / Kimi — NOT wired for the Cowork pilot
    whatsapp: WHATSAPP_* / TWILIO_* in config/.env
    watchdog: external dead-man's-switch (healthchecks.io / cloud cron) in WATCHDOG_URL — only meaningful when WE run the infra (local box), not on Cowork
self_heal:       # D-45: PM-tunable — the OPERATIONAL self-heal net (tools/self_heal.py, Engineering & Change). Extends D-40 data self-heal; never places an order (constitution law 1).
  max_retries: 3               # bounded retries for transient failures (feed/ptj/store)
  auto_heal:                   # failure classes the system may fix WITHOUT the PM (data plane only)
  - feed_pull                  # transient — re-fetch + revalidate + tripwires
  - ptj_pull                   # transient — re-pull both brokers, refresh dynCap
  - store_stale                # transient — reseed via D-40 historical_store
  escalate_only:               # NEVER auto-healed — page the PM with the manual fix (/recover)
  - schema
  - config
  - logic
  stand_down:                  # a hard gate is stood down, never healed; PM clears/overrides (recorded)
  - tripwire
  - gate
  log: data/eod/<date>/self_heal_<date>.jsonl
