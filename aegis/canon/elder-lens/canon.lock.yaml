principles:
- id: C1
  text: The Impulse System exists to forbid, not to propose. Its stated role is to mark the bars on which
    buying or shorting is off limits; the trade idea has to originate somewhere else. Elder warns in the
    same breath that running it as an automatic method would whipsaw the trader repeatedly, so it belongs
    beside a separately sourced entry. This supersedes the card's construction of this seat as a nominator
    that manufactures buy candidates out of the Elder read itself.
  status: verified
  relation: supersedes
  supersedes: voice-elder-lens/SKILL.md role line — 'nominates on Alexander Elder's Force / Impulse reading'
    — the seat as an originator of buy candidates.
  cite:
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-022
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-029
- id: C2
  text: The colour is a function of exactly two slopes and of nothing else. The fast exponential average's
    slope measures the crowd's inertia; the MACD-Histogram's slope measures market power. Both rising
    is green, both falling is red, and any disagreement between the two is blue. Both slopes are read
    on the last bar, so the colour is recoverable without coloured bars. Folding the pair into one blended
    number destroys the disagreement case, because a middling score cannot say which component fell.
  status: verified
  cite:
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-021
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-024
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-025
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-026
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-027
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-033
- id: C3
  text: 'Red forbids buying, green forbids shorting, blue forbids nothing. The lifting rule is the half
    most often lost: the ban on buying ends at the bar where red ceases to be red, whether what follows
    is blue or green, and nobody waits for green. For a long-only book the operative content is therefore
    that red is a hard no-buy and blue is already permission, so the boundary that governs entry sits
    at blue.'
  status: verified
  cite:
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-023
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-028
- id: C4
  text: The best signals come from a colour vanishing, never from a colour being present. Red going away
    lifted the ban and completed a double bottom, which argued for buying; green going away during a powerful
    upswing marked that swing's approaching end and argued for booking profit. The signal is the transition
    bar itself. This supersedes the card's rule that a high reading held across a five-bar window is what
    triggers a nomination.
  status: verified
  relation: supersedes
  supersedes: voice-elder-lens/SKILL.md step 2 — 'Nominate names showing SUSTAINED or ACCELERATING force'
    — sustained presence as the trigger.
  cite:
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-030
  - code: NTFLSG
    page: 137
    extract_id: new_trading_living_sg_2014#0008-031
- id: C5
  text: 'The Force Index is one number a day: today''s close less yesterday''s close, sign retained, multiplied
    by today''s volume. It has to carry three things at once — which way price moved, how far it moved,
    and the volume behind the move. The volume term is a pure magnitude weight and supplies no direction,
    since the quantity bought and the quantity sold are equal by construction. The series is signed and
    unbounded, not a bounded score.'
  status: verified
  cite:
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-021
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-020
  - code: NTFLSG
    page: 112
    extract_id: new_trading_living_sg_2014#0003-024
- id: C6
  text: The 2-day EMA of Force Index is a pullback timer, not a strength meter. Once the price average
    has turned up, buy on each occasion that short smoothing dips under zero, which is where the name
    is briefly oversold. The mirror short is taken when it lifts through zero in a falling market. This
    supersedes the card's step 2, which nominates while the force reading is holding at its top — the
    point at which Elder is not buying at all.
  status: verified
  relation: supersedes
  supersedes: voice-elder-lens/SKILL.md step 2 — 'a single high reading is NOT enough; persistence of
    force is the signal' — high-and-holding as the buy condition.
  cite:
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-023
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-028
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-029
- id: C7
  text: The 13-day EMA of Force Index is the regime layer and does a different job from the 2-day. Which
    side of zero it sits on classifies the zone, above being bullish and below bearish, and its crossings
    of that line are read as trend reversals, upward for bullish and downward for bearish. This regime
    read is per instrument, built from that one name's price and volume. It is not a market-wide tape
    colour.
  status: verified
  cite:
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-024
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-032
- id: C8
  text: Force Index carries a divergence signal of its own against price, and it warns that a reversal
    is approaching. Each force peak lower than the one before it says the bullish side is weakening. The
    bullish case is a price low that price immediately recoils from while force traces a far shallower
    low. This divergence is measured on the force series itself and is a separate instrument from any
    oscillator divergence computed elsewhere.
  status: verified
  cite:
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-025
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-034
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-027
- id: C9
  text: Never act on a force reading standing alone. The long wants two conditions held together — Force
    Index positive, and the exponential average of price rising — and only then is an entry taken, on
    pullbacks back into that average rather than at the price in front of you. The short side is the exact
    mirror, a falling average confirming the downtrend. One condition on its own is a fragment, not a
    set-up.
  status: verified
  cite:
  - code: NTFLSG
    page: 128
    extract_id: new_trading_living_sg_2014#0006-035
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-026
  - code: NTFLSG
    page: 136
    extract_id: new_trading_living_sg_2014#0008-017
- id: C10
  text: 'The slope of the price average decides which side may be traded at all: while it rises bulls
    hold control and longs are the only permitted entry, while it falls only shorts are. With the average
    pointing up, pullbacks are the opportunity, and the buy rests slightly under the average instead of
    chasing. Calibrate that offset by averaging how deep recent pullbacks pushed beneath the average,
    then bid shallower than that figure for a more reliable fill.'
  status: verified
  cite:
  - code: NTFLSG
    page: 120
    extract_id: new_trading_living_sg_2014#0005-009
  - code: NTFLSG
    page: 120
    extract_id: new_trading_living_sg_2014#0005-012
  - code: NTFLSG
    page: 120
    extract_id: new_trading_living_sg_2014#0005-014
  - code: NTFLSG
    page: 127
    extract_id: new_trading_living_sg_2014#0006-031
  - code: NTFLSG
    page: 149
    extract_id: new_trading_living_sg_2014#0011-003
  - code: NTFLSG
    page: 149
    extract_id: new_trading_living_sg_2014#0011-004
- id: C11
  text: 'Channels are fitted, never drawn by eye. Move the coefficient until the band holds 90 to 95 percent
    of the action over the past 50 to 100 bars. The average is then the value line and the walls are where
    normal behaviour ends: under the lower wall is undervalued, over the upper wall is manic. Do not start
    a long above the upper wall. A sustained excursion outside does happen, so size for it rather than
    assume the reversal.'
  status: verified
  cite:
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-039
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-037
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-038
  - code: NTFLSG
    page: 149
    extract_id: new_trading_living_sg_2014#0011-002
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-036
- id: C12
  text: 'A channel''s slope classifies the regime one name at a time: rising is bullish, falling is bearish,
    flat is neutral. When a breakout runs with the slope the trend is powerful, and the pullback to the
    average is then the entry in the trend''s direction. A flat channel inverts the instruction — trade
    the swings between its walls and avoid entering at the average, because average entries work when
    the channel is slanted.'
  status: verified
  cite:
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-040
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-041
  - code: NTFLSG
    page: 138
    extract_id: new_trading_living_sg_2014#0008-042
- id: C13
  text: 'Grade both fills, and grade each against its own day''s bar. The buy grade is the distance from
    that day''s high down to the fill over that day''s range: a 2 dollar bar filled 1.50 under the high
    scores 75 percent, and anything over 50 percent means the lower half. The sell grade is the fill above
    the EXIT day''s low over that day''s range, so 1 dollar inside a 3 dollar bar is 33 percent. Two different
    bars.'
  status: verified
  cite:
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-018
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-017
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-020
- id: C14
  text: The trade grade is the share of the entry-day channel height the trade actually captured, and
    it outranks the other two for reviewing performance. Its denominator is the channel measured on the
    day of entry, which stands as the realistic maximum gain available because the channel holds nearly
    all recent action. Two dollars out of a 6 dollar channel earns an A. The book fixes that A boundary
    twice and inconsistently, at one third and at 30 percent.
  status: verified
  cite:
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-023
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-021
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-022
  - code: NTFLSG
    page: 149
    extract_id: new_trading_living_sg_2014#0011-005
- id: C15
  text: 'Risk on any one trade is capped at 2 percent of account equity, and that allowance must absorb
    slippage and commissions on top of the distance to the stop. On a 28,000 dollar account the cap is
    560 dollars: with the stop 98 cents away, 500 shares put 490 dollars at stop risk and leave 70 for
    costs, and a larger size is reckless. Planned risk over the cap is not a businessman''s risk, it is
    a real loss.'
  status: verified
  cite:
  - code: NTFLSG
    page: 146
    extract_id: new_trading_living_sg_2014#0010-015
  - code: NTFLSG
    page: 146
    extract_id: new_trading_living_sg_2014#0010-016
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-024
- id: C16
  text: The 6 percent rule is a monthly circuit breaker on accumulated losses, not a test on any single
    trade. Once the month's losses reach that level, trading stops outright; the cooling-off period goes
    on reviewing the system and studying markets, and the desk returns only in the following month. The
    rule watches losses alone and counts profits at month end. Restart with smaller risk per trade, realistic
    targets, and size rebuilt gradually.
  status: verified
  cite:
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-028
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-029
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-030
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-031
- id: C17
  text: 'Answer three questions in this order and no other: the largest dollar risk acceptable on this
    trade, then where the entry goes, then where the stop goes. Risk per share is the entry-to-stop distance,
    and maximum size is the acceptable dollar risk divided by it. Entry, target and stop are the three
    essential numbers and all three are written down first; without them the position is a gamble. The
    ordering stops the allowance being back-fitted.'
  status: verified
  cite:
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-026
  - code: NTFLSG
    page: 147
    extract_id: new_trading_living_sg_2014#0010-027
  - code: NTFLSG
    page: 136
    extract_id: new_trading_living_sg_2014#0008-009
  - code: NTFLSG
    page: 136
    extract_id: new_trading_living_sg_2014#0008-010
- id: C18
  text: The stop goes on at the instant of entry, not later, and thereafter it travels in one direction
    only for the life of the trade — toward the position, as profit accumulates, protecting a share of
    it. A long stop may be held or raised and never lowered; a short stop held or lowered and never raised.
    A losing trade is never handed more room. There is no exception for a name the desk happens to like.
  status: verified
  cite:
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-016
  - code: NTFLSG
    page: 146
    extract_id: new_trading_living_sg_2014#0010-019
  - code: NTFLSG
    page: 146
    extract_id: new_trading_living_sg_2014#0010-020
- id: C19
  text: 'Put the stop outside the noise band, and measure that band deliberately: channel width, SafeZone
    and ATR each separate normal swings from abnormal ones in their own way. Nearness to support is not
    a substitute, because a level can sit well inside the noise. Keep the stop slightly clear of the obvious
    price extreme and of round numbers, both of which collect other traders'' stops. After a kangaroo
    tail, never place it beyond the tail''s tip.'
  status: verified
  cite:
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-013
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-014
  - code: NTFLSG
    page: 150
    extract_id: new_trading_living_sg_2014#0011-015
  - code: NTFLSG
    page: 117
    extract_id: new_trading_living_sg_2014#0004-031
  - code: NTFLSG
    page: 117
    extract_id: new_trading_living_sg_2014#0004-028
- id: C20
  text: 'An indicator''s season is fixed by two facts about the reading: its slope, and whether it sits
    above or below its centreline. Rising below centre is spring, rising above centre is summer, falling
    above centre is autumn, falling below centre is winter. Longs belong in spring and shorts in autumn.
    A reading pinned at its top is summer, which Elder does not name as the buying season, and brief counter-season
    stretches change nothing about that ordering.'
  status: verified
  cite:
  - code: NTFLSG
    page: 128
    extract_id: new_trading_living_sg_2014#0006-037
  - code: NTFLSG
    page: 128
    extract_id: new_trading_living_sg_2014#0006-038
  - code: NTFLSG
    page: 128
    extract_id: new_trading_living_sg_2014#0006-039
  - code: NTFLSG
    page: 128
    extract_id: new_trading_living_sg_2014#0006-040
- id: C21
  text: Read the higher timeframe first and the trading timeframe second. Starting on the daily and consulting
    the weekly afterwards prejudices the eye, so the sequence is a control and not a preference. The two
    charts stand about five to one, which makes weekly the required partner of a daily book and rules
    monthly out. The first screen then acts as a censor, striking one directional choice out and leaving
    the other or abstention.
  status: verified
  cite:
  - code: NTFLSG
    page: 135
    extract_id: new_trading_living_sg_2014#0008-003
  - code: NTFLSG
    page: 135
    extract_id: new_trading_living_sg_2014#0008-004
  - code: NTFLSG
    page: 135
    extract_id: new_trading_living_sg_2014#0008-005
  - code: NTFLSG
    page: 136
    extract_id: new_trading_living_sg_2014#0008-012
- id: C22
  text: A directional trader holds exactly three choices — buy, short, or stand aside — and the third
    is a decision rather than the absence of one. The transitional ground between an uptrend and a downtrend
    is the hardest to trade, and the instruction there is to take nothing until a clear trend appears.
    When unsure, stay out entirely instead of trading smaller. Sizing the read down is not the sanctioned
    response to a murky tape.
  status: verified
  cite:
  - code: NTFLSG
    page: 136
    extract_id: new_trading_living_sg_2014#0008-011
  - code: NTFLSG
    page: 120
    extract_id: new_trading_living_sg_2014#0005-015
  - code: NTFLSG
    page: 111
    extract_id: new_trading_living_sg_2014#0003-008
- id: C23
  text: 'Elder''s own persistence test is a volume test. A trend runs on while volume is steady or climbing
    in an orderly way, and it expires either in a burst of volume or in a drastic shrinkage of it. At
    each new high or new low, set volume against the volume at the previous extreme: contraction at a
    fresh extreme warns of reversal or pause. No trend survives once the losing side stops turning up.'
  status: verified
  cite:
  - code: NTFLSG
    page: 125
    extract_id: new_trading_living_sg_2014#0006-003
  - code: NTFLSG
    page: 125
    extract_id: new_trading_living_sg_2014#0006-005
  - code: NTFLSG
    page: 125
    extract_id: new_trading_living_sg_2014#0006-004
- id: C24
  text: 'Force sustained across a multi-day window, in strong tape, precedes an upward burst often enough
    to nominate on, and a name whose sustained force is rolling over is a tighten-or-exit case rather
    than a fresh entry. This is retained without citation because the book nowhere states it: its persistence
    claims are volume-based or inertia-based, its strongest Impulse signals are transitions rather than
    continuations, and the claim rests on the PM''s 18 to 20 July observation and on Ledger evidence alone.'
  status: unsourced_retained
recognisers:
- id: R1
  if: 'NOT_AVAILABLE: impulse_colour_last_bar == RED — needs a fast-EMA slope and a MACD-Histogram slope,
    neither of which exists as a field'
  then: 'veto every long on the name for as long as the bar prints red, and lift the veto on the first
    bar that is not red. To build it: a fast EMA of close, a MACD-Histogram series, their one-bar slopes,
    and a three-state per-bar colour field. The elder 0-to-10 score cannot substitute, because a mid-range
    value cannot say which of the two components is falling'
  fields: []
- id: R2
  if: 'NOT_AVAILABLE: impulse_colour_last_bar != impulse_colour_prior_bar — needs the same per-bar colour
    on two consecutive bars'
  then: 'raise the transition, not the level: red giving way is the buy-permission event, green giving
    way on a held name is the profit-taking event. Requires the R1 colour field plus one bar of history
    on it. This is the single highest-value item in the backlog, because Elder''s best signals live here
    and the card currently reads only the presence of strength'
  fields: []
- id: R3
  if: 'NOT_AVAILABLE: force_index_ema_2 < 0 AND price_ema_slope > 0 — needs a signed Force Index series
    and a 2-bar EMA of it'
  then: 'time the long here: a dip of the short force smoothing under zero while the price average rises
    is Elder''s buy trigger. To build it: (close - close[1]) * volume as a signed series, a 2-period EMA
    of it, and a zero line. Note this fires on WEAKNESS inside a rising market, so it cannot be expressed
    on a 0-to-10 scale that has no negative region'
  fields: []
- id: R4
  if: 'NOT_AVAILABLE: force_index_ema_13 > 0 — needs a 13-bar EMA of the same signed Force Index series'
  then: treat the name as being in a bullish zone and read crossings of zero as trend reversals. This
    is Elder's regime layer and it is PER NAME, computed from that name's own price and volume; it would
    replace, for this seat, the market-wide tape colour the card scales by. Needs the R3 series plus a
    13-bar EMA and its crossing events
  fields: []
- id: R5
  if: 'NOT_AVAILABLE: price > channel_upper — needs a fitted moving-average channel (coefficient tuned
    to hold 90-95% of the last 50-100 bars)'
  then: refuse to initiate a long above the upper wall. The same channel is the denominator of the trade
    grade and the reference target for a rally, so one build unlocks three rules. sma_distance_pct is
    the nearest existing field and is a crude stand-in only — it is outside this voice's menu and it measures
    distance from a simple average, not containment of recent action
  fields: []
- id: R6
  if: 'NOT_AVAILABLE: weekly_trend_direction == UP — needs a weekly resample of the daily bars, read BEFORE
    the daily'
  then: 'permit daily longs only while the weekly trend is up, and otherwise stand aside. This is cheap
    and entirely computable: aggregate five daily bars into one weekly bar and take a trend read on it.
    elder_context is an HOURLY object and is a step in the wrong direction — Elder''s ratio is five to
    one UPWARD from the traded timeframe'
  fields: []
- id: R7
  if: held == true AND elder_5d[-1] < elder_5d[-2]
  then: raise the name as a TIGHTEN or EXIT case on the single-bar drop, not on the whole series rolling
    over — Elder's trigger is one bar losing its colour and his prescription is to book profit. `held`
    sits outside this voice's stated menu and would need the card widened; elder_5d is the closest thing
    we own to a per-bar Elder state
  fields:
  - held
  - elder_5d
- id: R8
  if: elder_pattern == 'CORRECTION_REENTRY' AND mp_state == 'STRONG'
  then: 'treat as the only menu-legal analogue of Elder''s dip-and-reclaim entry, and treat it as incomplete:
    his version also requires the pullback''s volume to be contracting and one or more bars to fail to
    extend the downmove. rvol would supply the volume half and is outside the menu; nothing exposes the
    failure-to-extend test, so this recogniser is weaker than the book''s'
  fields:
  - elder_pattern
  - mp_state
- id: R9
  if: ma_20 > ma_50 AND entry <= ma_20
  then: 'flag a pullback into value under a rising average stack — the shape Elder buys. Every field here
    is outside this voice''s menu and would need the card widened. Two honest caveats: ma_20 and ma_50
    are SIMPLE averages where Elder specifies exponential ones, and no slope field exists, so the 20-over-50
    stack is standing in for a rising average rather than measuring one'
  fields:
  - ma_20
  - ma_50
  - entry
- id: R10
  if: bracket.valid == false OR malformed_bracket == true
  then: do not nominate the name at all — without a usable stop there is no entry-to-stop distance, so
    neither the size nor the reward-to-risk can be computed and Elder's three essential numbers do not
    exist. Both fields are outside this voice's menu, which is why an elder-lens nomination can currently
    be raised on a name with no tradeable bracket
  fields:
  - bracket
  - malformed_bracket
- id: R11
  if: choch_state == 'BEARISH' OR structure_shift == 'BEARISH_CHOCH'
  then: 'suppress the long: the previous swing low has been taken out, which throws the higher-highs-and-higher-lows
    read into doubt, and Elder''s uptrend structure is gone before any force reading is consulted. Both
    fields exist and both are outside this voice''s menu, so the seat can today nominate a name whose
    structure has already broken'
  fields:
  - choch_state
  - structure_shift
- id: R12
