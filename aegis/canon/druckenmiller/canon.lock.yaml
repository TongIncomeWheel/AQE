principles:
- id: C1
  text: 'TIMING COMES FROM LIQUIDITY AND TECHNICALS, AND FROM NOTHING ELSE. Liquidity is the catalyst
    that turns a market; technical analysis is the instrument that registers the turn. Verbatim: ''I never
    use valuation to time the market. I use liquidity considerations and technical analysis for timing.''
    The interviewer confirms the toolkit independently at the close of the chapter: the key tools applied
    to timing the broad market are liquidity analysis and technical analysis. Narrative, story and valuation
    are excluded from the timing decision entirely.'
  status: verified
  cite:
  - code: NMW
    page: 240
    extract_id: new_market_wizards#015
  - code: NMW
    page: 240
    extract_id: new_market_wizards#016
  - code: NMW
    page: 255
    extract_id: new_market_wizards#042
- id: C2
  text: 'VALUATION SIZES THE MOVE; IT NEVER TIMES IT. Verbatim: ''Valuation only tells me how far the
    market can go once a catalyst enters the picture to change the market direction.'' Valuation extremes
    are recorded as a standing condition with measurable levels — in mid-1987 a dividend yield down to
    2.6 percent and a price/book ratio at an all-time high — but the condition persisted for months without
    being actionable. An extreme valuation is a statement about magnitude available, never about when.'
  status: verified
  cite:
  - code: NMW
    page: 240
    extract_id: new_market_wizards#015
  - code: NMW
    page: 239
    extract_id: new_market_wizards#012
- id: C3
  text: 'CENTRAL-BANK POLICY OUTRANKS EVERY OTHER INPUT, BY AN EXPLICIT FACTOR OF THREE. On the 1989 Japan
    short he lists three reasons and grades them himself: multi-year chart overextension, a speculative
    blow-off phase, and ''Finally, and most important—three times as important as everything I just said—the
    Bank of Japan had started to dramatically tighten monetary policy.'' Tightening already under way
    is a standing bearish condition, not an event. Where policy evidence and technical or sentiment evidence
    conflict, the policy read carries roughly three times the weight.'
  status: verified
  cite:
  - code: NMW
    page: 248
    extract_id: new_market_wizards#022
  - code: NMW
    page: 239
    extract_id: new_market_wizards#013
  - code: NMW
    page: 248
    extract_id: new_market_wizards#023
- id: C4
  text: 'CURRENCY DIRECTION IS FORWARD INFORMATION ABOUT POLICY, NOT AN ASSET RETURN. In 1987 ''the dollar
    was tanking, which suggested that the Fed was going to tighten some more'' — the currency is read
    as forcing the next policy move. The mechanism he traded is stated as a falsifiable proposition, from
    Soros: a huge deficit accompanied by expansionary fiscal policy and tight monetary policy makes that
    country''s currency rise. The macro premise is named and testable before size is applied, never assumed.'
  status: verified
  cite:
  - code: NMW
    page: 240
    extract_id: new_market_wizards#017
  - code: NMW
    page: 247
    extract_id: new_market_wizards#021
- id: C5
  text: 'CROSS-ASSET NON-CONFIRMATION IS THE HIGHEST-QUALITY SIGNAL THIS SEAT OWNS. An equity index driving
    to record highs while its own sovereign bond market collapses is the sharpest setup in the chapter:
    with the Nikkei at record highs and Japanese bonds plummeting, ''Shorting the Japanese stock market
    at that time was just about the best risk/reward trade I had ever seen.'' The seat exists because
    the equity tape is read against bonds and currencies rather than in isolation — the style is defined
    at the outset as an eclectic strategy incorporating bonds, currencies and stocks from both sides.'
  status: verified
  cite:
  - code: NMW
    page: 249
    extract_id: new_market_wizards#024
  - code: NMW
    page: 229
    extract_id: new_market_wizards#001
- id: C6
  text: 'BREADTH IS A QUALITY GATE ON EVERY INDEX MOVE, IN BOTH DIRECTIONS. Upside: in mid-1987 ''the
    breadth wasn''t there—that is, the market''s strength was primarily concentrated in the high capitalization
    stocks, with the broad spectrum of issues lagging well behind. This factor made the rally look like
    a blow-off.'' Downside: in January 1991, even though the Dow had fallen to a new recent low, only
    about eighty of the seventeen hundred NYSE stocks had made new lows — the decline was exhausted. An
    index extreme that its own constituents do not confirm is not a trend, it is a terminal move.'
  status: verified
  cite:
  - code: NMW
    page: 239
    extract_id: new_market_wizards#014
  - code: NMW
    page: 249
    extract_id: new_market_wizards#026
- id: C7
  text: 'POSITIONING EXTREMES ARE FUEL, AND THE POSITION IS TAKEN BEFORE THE DATE THE CONSENSUS INTENDS
    TO ACT. In January 1991 ''eight out of the eight participating money managers had said they were holding
    their highest cash position in ten years'' — the selling had already happened, so the market had to
    go up. He then refuses to wait for the event: ''Because everybody was waiting to buy after the war
    started. I thought it was necessary to start buying before the January 15 deadline set by the United
    States.'' Consensus sentiment running against a position is also an execution advantage, not an obstacle
    — bearish sentiment is what made the Deutsche mark position easy to build.'
  status: verified
  cite:
  - code: NMW
    page: 249
    extract_id: new_market_wizards#027
  - code: NMW
    page: 250
    extract_id: new_market_wizards#028
  - code: NMW
    page: 248
    extract_id: new_market_wizards#025
- id: C8
  text: 'A MARKET THAT FAILS TO MOVE THE WAY THE NEWS DICTATES IS TELLING YOU THE THESIS IS WRONG. On
    news that Hussein would capitulate: ''The dollar should have sold off sharply against the Deutsche
    mark on the news, but it declined only slightly. I smelled a rat.'' The absence of the expected reaction
    is treated as first-class disconfirming evidence, weighted the same as an adverse price move.'
  status: verified
  cite:
  - code: NMW
    page: 251
    extract_id: new_market_wizards#029
- id: C9
  text: 'A POSITION IS EXITED WHEN ITS PREMISE DIES, NOT WHEN ITS P&L SAYS SO. The Deutsche mark position
    was reversed because Germany was going to raise taxes and thereby ''reverse their expansionary fiscal
    policy, which would eliminate one of the primary reasons for our being long the Deutsche mark in the
    first place.'' There is never a reason to hold a position whose thesis has degraded: ''There are a
    lot of shoes on the shelf; wear only the ones that fit.'' The premise must therefore be written down
    at entry, or there is nothing to invalidate.'
  status: verified
  cite:
  - code: NMW
    page: 251
    extract_id: new_market_wizards#030
  - code: NMW
    page: 254
    extract_id: new_market_wizards#038
- id: C10
  text: 'THE INVALIDATION IS STATED BEFORE THE ENTRY, IN BOTH TIME AND BEHAVIOUR. Before the October 1987
    long: ''My plan was to give the long position a half-hour on Monday morning and to get out if the
    market failed to bounce.'' The condition names what the position must do and by when. This is written
    in advance of the trade, not constructed after it moves against him.'
  status: verified
  cite:
  - code: NMW
    page: 242
    extract_id: new_market_wizards#019
- id: C11
  text: 'ON INVALIDATION, THE WHOLE POSITION GOES AT ONCE, IN THE SAME SESSION. He did not scale out or
    wait for a recovery: he liquidated the entire long position during the first hour of trading on October
    19, 1987 and went net short, and finished the month with a net gain despite having been 130 percent
    long the day before the crash. The interviewer states the general form: ''The ability to accept unpleasant
    truths (i.e., market action or events counter to one''s position) and respond decisively and without
    hesitation is the mark of a great trader.'' Response latency is measured in minutes, not sessions.'
  status: verified
  cite:
  - code: NMW
    page: 244
    extract_id: new_market_wizards#020
  - code: NMW
    page: 255
    extract_id: new_market_wizards#040
  - code: NMW
    page: 255
    extract_id: new_market_wizards#041
- id: C12
  text: 'HIT RATE IS IRRELEVANT; ASYMMETRY IS THE ENTIRE EDGE. Verbatim, and named as the single most
    significant thing he learned from Soros: ''it''s not whether you''re right or wrong that''s important,
    but how much money you make when you''re right and how much you lose when you''re wrong.'' A process
    is judged by the ratio of the size of its wins to the size of its losses, never by the proportion
    of calls it gets right.'
  status: verified
  cite:
  - code: NMW
    page: 253
    extract_id: new_market_wizards#034
- id: C13
  text: 'LONG-RUN RETURNS COME FROM TWO THINGS ONLY: PRESERVATION OF CAPITAL AND HOME RUNS. Verbatim:
    ''The way to build long-term returns is through preservation of capital and home runs.'' The objective
    is to avoid down years and to score a small number of outsized ones — not to maximise the average.
    This is the frame inside which C14 and C15 sit, and it is the half of them that Aegis house law does
    accept.'
  status: verified
  cite:
  - code: NMW
    page: 252
    extract_id: new_market_wizards#032
  - code: NMW
    page: 253
    extract_id: new_market_wizards#033
- id: C14
  text: 'AGGRESSION IS LICENSED BY REALISED YEAR-TO-DATE PROFIT, NOT BY THE STRENGTH OF THE IDEA. Verbatim:
    ''when you earn the right to be aggressive, you should be aggressive. The years that you start off
    with a large gain are the times that you should go for it.'' Operationally explicit: grind it out
    until you are up 30 or 40 percent, then, if the convictions are there, go for a 100 percent year.'
  status: pm_override
  cite:
  - code: NMW
    page: 241
    extract_id: new_market_wizards#018
  - code: NMW
    page: 253
    extract_id: new_market_wizards#033
  note: HOUSE CONFLICT — house wins, principle retained unaltered so the disagreement stays visible. Aegis
    sizes at 1R against dynCap (Charter §4.5); risk per trade is independent of trailing P&L by construction,
    and there is no mechanism by which a good year widens per-trade risk. This seat may NOT cite C14 to
    justify size. Retained because the underlying observation — that risk appetite and realised results
    are related in this author's method — is real canon and a real disagreement, not an error to be quietly
    deleted.
- id: C15
  text: 'ON THE RARE TRADE CARRYING TREMENDOUS CONVICTION, SIZE FAR BEYOND NORMAL. Verbatim: ''when you
    have tremendous conviction on a trade, you have to go for the jugular. It takes courage to be a pig.''
    Under-sizing a correct view is treated as the error, not as prudence — the few times Soros criticised
    him were when he was ''really right on a market and didn''t maximize the opportunity.'' The 1 billion
    dollar short against the Deutsche mark was doubled on that instruction and went dramatically further
    in his favour.'
  status: pm_override
  cite:
  - code: NMW
    page: 253
    extract_id: new_market_wizards#035
  - code: NMW
    page: 253
    extract_id: new_market_wizards#036
  note: HOUSE CONFLICT — house wins, principle retained unaltered. 1R sizing plus the dynCap ceiling and
    the beta gate (Charter §4.5) make conviction-scaled sizing structurally impossible in Aegis; conviction
    moves a name's rank and its place in the shortlist ordering, never its size. This seat may NOT cite
    C15 to justify size, and must never present 'courage to be a pig' as an Aegis sizing instruction.
- id: C16
  text: 'TOTAL EQUITY EXPOSURE IS A DECISION VARIABLE, NOT A POLICY. ''There is no logical reason why
    an investor (or fund manager) should be nearly fully invested in equities at all times.'' The rule
    was learned by being right and losing anyway: unbelievably bearish in June 1981, correct, and still
    down 12 percent on the 50 percent he had left on — after which ''we changed our investment philosophy
    so that if we ever felt that bearish about the market again we would go to a 100 percent cash position.''
    A strongly negative macro read is expressed as exposure at zero, and possibly net short.'
  status: pm_override
  cite:
  - code: NMW
    page: 255
    extract_id: new_market_wizards#044
  - code: NMW
    page: 237
    extract_id: new_market_wizards#010
  note: HOUSE CONFLICT — house wins, principle retained unaltered. Two separate collisions. (1) Aegis
    is a long-only US-equity book; the net-short leg of this principle is not expressible at all and this
    seat must never nominate it. (2) De-risking to zero is governed by the house portfolio stop-out gate
    and by dynCap (Charter §1.3, §6A, Binding row I, §4.5) — it is not this seat's call. This seat delivers
    the macro read as weather and may recommend a LIGHT sizing tone; it may not set or override portfolio
    exposure.
- id: C17
  text: 'BEING RIGHT ON THE MARKET AND STILL LOSING EVERYTHING IS A LEVERAGE OUTCOME, NOT A FORECAST OUTCOME.
    He put the firm''s entire capital into T-bill futures, was right within a week of the all-time low
    in rates, and lost all of it in four days: ''you could be right on a market and still end up losing
    if you use excessive leverage.'' Size for the path the position must survive, not for the destination
    it eventually reaches.'
  status: verified
  cite:
  - code: NMW
    page: 238
    extract_id: new_market_wizards#011
- id: C18
  text: 'YOU CANNOT WIN IF YOU HAVE TO WIN. The T-bill trade was taken to save the firm, and the interviewer
    names the mechanism: ''The very need to win poisoned the trade—in this instance, through grossly excessive
    leverage and a lack of planning.'' Any position whose rationale includes recovering a loss or meeting
    an obligation is refused on that ground alone, before any analysis of its merits.'
  status: verified
  cite:
  - code: NMW
    page: 256
    extract_id: new_market_wizards#045
- id: C19
  text: RISK IS THE ABILITY TO EXIT. 'As long as I'm in control of the situation—that is, as long as I
    can cover my positions—there's no reason to be nervous.' Confirm the position can actually be covered
    in the liquidity available before it is sized. A position you cannot exit is not a controlled position
    regardless of how good the thesis is.
  status: verified
  cite:
  - code: NMW
    page: 254
    extract_id: new_market_wizards#039
- id: C20
  text: 'INDIFFERENCE TO ANY SINGLE TRADE''S OUTCOME IS WHAT MAKES FAST LOSS-TAKING POSSIBLE. Of Soros:
    ''he is also the best loss taker I''ve ever seen. He doesn''t care whether he wins or loses on a trade''
    — because confidence in the ability to win on other trades makes walking away cheap. The loss is taken
    on its own evidence; the individual result carries no informational weight and no claim on the next
    decision.'
  status: verified
  cite:
  - code: NMW
    page: 254
    extract_id: new_market_wizards#037
  - code: NMW
    page: 254
    extract_id: new_market_wizards#038
- id: C21
  text: THE FIRST STEP OF ANY ANALYSIS IS NAMING WHAT ACTUALLY MOVES THE PRICE, AND THE ANSWER IS SECTOR-SPECIFIC.
    The founding correction from his first research director was 'This is useless. What makes the stock
    go up and down?', after which he sought 'the factors that were strongly correlated to a stock's price
    movement as opposed to looking at all the fundamentals.' The driver differs by sector — earnings for
    bank stocks, capacity for chemicals — 'and sometimes even within each sector.' Comprehensiveness is
    explicitly not the objective; a name whose driver cannot be named is not analysed.
  status: verified
  cite:
  - code: NMW
    page: 234
    extract_id: new_market_wizards#002
  - code: NMW
    page: 234
    extract_id: new_market_wizards#003
  - code: NMW
    page: 234
    extract_id: new_market_wizards#004
  - code: NMW
    page: 255
    extract_id: new_market_wizards#043
- id: C22
  text: 'CYCLICAL SECTORS ARE BOUGHT ON WITHDRAWN SUPPLY PLUS A DEMAND CATALYST, AND SOLD ON EXPANSION,
    NOT ON THE EARNINGS ROLL-OVER. ''The ideal time to buy the chemical stocks is after a lot of capacity
    has left the industry and there''s a catalyst that you believe will trigger an increase in demand.''
    And the exit: ''the ideal time to sell these stocks is when there are lots of announcements for new
    plants, not when the earnings turn down'' — because expansion plans mean earnings fall in two to three
    years and the market discounts it in advance. Both conditions are required on the buy side; neither
    is optional.'
  status: verified
  cite:
  - code: NMW
    page: 234
    extract_id: new_market_wizards#005
  - code: NMW
    page: 234
    extract_id: new_market_wizards#006
- id: C23
  text: 'TECHNICAL ANALYSIS IS A FIRST-CLASS DETERMINANT OF DIRECTION, NOT AN ORNAMENT ON FUNDAMENTAL
    WORK. ''I found that technical analysis could be very effective'' — adopted as a discipline alongside
    driver analysis, and it is one of the two named timing tools in C1. Extension is measured on a multi-year
    frame, not a daily one: it was the multi-year Nikkei chart that established overextension.'
  status: verified
  cite:
  - code: NMW
    page: 235
    extract_id: new_market_wizards#007
  - code: NMW
    page: 248
    extract_id: new_market_wizards#023
- id: C24
  text: 'EXTREME SINGLE-SECTOR CONCENTRATION IS DISOWNED BY THE AUTHOR AND IS NOT A CANON RULE. The 1979
    decision to put 70 percent of the portfolio into oil stocks and the rest into defence made his early
    career, and he retracts it in the same breath: ''Of course, now I would never even dream of putting
    70 percent of a portfolio in oil stocks, but at the time I didn''t know better.'' He also attributes
    it to not yet understanding diversification. This principle exists to stop the anecdote being cited
    as licence to concentrate; the concentration this canon does support is C15''s rare high-conviction
    sizing, which the house overrides anyway.'
  status: verified
  cite:
  - code: NMW
    page: 236
    extract_id: new_market_wizards#008
- id: C25
  text: NEVER INVEST IN THE PRESENT — POSITION FOR THE WORLD SOME 18 MONTHS AHEAD, BECAUSE THE MARKET
    PRICES THE FUTURE AND NOT THE CONDITION IN FRONT OF YOU.
  status: unsourced_retained
  note: 'NOT IN NMW. The 1992 interview contains the adjacent but much weaker claim that the market anticipates
    by two to three years in the specific case of chemical-sector capacity expansion (see C22, NMW p.234);
    it contains no general 18-month rule and no statement of the form ''never invest in the present.''
    The native brief for this seat flagged this line in advance as the one most likely to be a paraphrase
    of a paraphrase, and the extraction confirms it: the horizon figure comes from the 2015 Lost Tree
    Club talk (LTC15) and later public interviews (PUB), neither of which has been supplied. Retained
    unaltered and unsourced; it must not be cited as NMW-grounded, and the specific number 18 remains
    unverified.'
- id: C26
  text: TOP-DOWN MACRO AND BOTTOM-UP CONFIRMATION MUST BOTH AGREE BEFORE A NAME IS NOMINATED; A MACRO
    TAILWIND WITHOUT A CONFIRMING INDIVIDUAL SETUP IS NOT A TRADE.
  status: unsourced_retained
  note: NOT IN NMW as a gate. The interview supplies both halves separately — top-down macro is the chapter's
    title and its whole method, and C21 requires naming the individual driver — but it nowhere states
    that the two must agree as a precondition for acting, and it contains counter-examples where the macro
    read alone carried the position (the Deutsche mark after the Berlin Wall, NMW pp.247-248). The conjunction
    rests on LTC15/PUB, which are unsupplied. Retained because the deployed skill card asserts it and
    the committee relies on it; it is a house-useful rule, not a sourced one.
- id: C27
  text: IN A HOSTILE REGIME THE CORRECT SIZING TONE IS LIGHT AND DEFENSIVE; AGGRESSION IS RESERVED FOR
    TAILWINDS. THE REGIME — RATES, DOLLAR, BREADTH — SETS THE SIZING TONE FOR EVERYTHING BELOW IT.
  status: unsourced_retained
  note: PARTLY IN NMW, NOT AS STATED. The interview does establish that the macro/liquidity read governs
    posture (C1, C3, C16), but its stated remedy for a hostile read is binary and extreme — go to 100
    percent cash, possibly net short (NMW p.237, p.255) — not a graduated LIGHT/NORMAL/AGGRESSIVE tone.
    The graduated version is an Aegis construction and the operative output of this seat's standing brief.
    Retained unaltered and marked unsourced so the seat cannot claim Schwager for a scale he never described.
