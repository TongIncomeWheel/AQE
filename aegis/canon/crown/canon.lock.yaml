pm_spot_check:
  sampled: 0
  confirmed: 0
  by: Ash
  basis: 'CHARTER-LEVEL confirmation, one step below every other voice in this canon and below even the
    O''Neil digest pattern (canon/oneil/spotcheck.json) — flagged explicitly rather than dressed up as
    equivalent. O''Neil''s digest was an independent third-party extraction that the PM then checked
    against the book. Crown has no independent extraction to check: the charter IS the PM-supplied build
    document, and no page, digest chunk or extract sample exists anywhere to sample against — canon_build.py''s
    lock command could not run here even in principle (see diff_sha_note). The grounding this voice rests
    on is PM authorship/supply of the charter itself, plus the explicit sign-off quoted in pm_signed_note.
    No principle below should be described as ''verified'' or ''digest-verified'' — every one carries
    status: unsourced_retained, and that status is accurate, not conservative.'
  per_source: {}
principles:
- id: C1
  text: Positioning, breadth and regime come before price. Price lags all three.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C2
  text: The hierarchy is the method, not a table of contents. Reading a later step without an earlier
    one is a different process, not a shortcut.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C3
  text: An unreadable market stops the process. Low confidence is not small size. Nothing downstream is
    computed, and that is a result rather than a failure.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C4
  text: The regime dictates the allowed family. The individual setup comes after and is not this voice''s
    job.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C5
  text: Size is a multiplier on someone else''s budget, never an absolute, and the arithmetic behind it
    is always shown.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C6
  text: Tactical families cap size rather than compounding it. Multiplying two independent size opinions
    understates by design rather than by evidence.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C7
  text: 'A partial match reported with its unmet conditions beats a clean "no match". Name the closest
    family and what it failed.'
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On sequence and authority'
- id: C8
  text: The index and the average stock tell different stories. The ratio between them is the question
    worth asking.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On breadth'
- id: C9
  text: Read the chart before the label. A range position means nothing without the range it refers to.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On breadth'
- id: C10
  text: Regime and range position are one reading. Either alone is half a statement.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On breadth'
- id: C11
  text: A tired trend is more actionable than a live one. The end of a range tells you to prepare for
    the turn; the start only tells you to go with it.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On breadth'
- id: C12
  text: Breadth deterioration shows in the ratio''s own move before the regime label flips. A gap to a
    moving average is self-damping, because the average chases the ratio.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On breadth'
- id: C13
  text: Trend funds all run broadly the same rule, so their selling arrives together. That is what makes
    it anticipable.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C14
  text: The tradeable output of a trend model is the flip level, not the positioning estimate. The level
    is arithmetic; the estimate is a guess about someone''s book.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C15
  text: Crowding is fragility, not conviction. When two thirds of the complex is stretched, the process
    cuts size even though the bias looks clean.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C16
  text: 'Positioning data is context, never timing. It is stale by construction and answers exactly one
    question: is the crowd already positioned the way price is moving?'
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C17
  text: Read the percentile, never the raw contract count. A number without its own range means nothing.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C18
  text: Dealer hedging sets the short-term character of the tape. Positive gamma damps moves; negative
    gamma amplifies them.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C19
  text: A dealer map is a model, not a measurement. Who is long and who is short is never published, so
    the convention used is an assumption and ships as one.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On positioning'
- id: C20
  text: Index calm can hide single-stock stress. The gap between the two is the tell, not the level of
    either one.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On volatility'
- id: C21
  text: Level and direction are separate questions and both must be stated. An extreme reading that is
    easing is stress leaving the market; buying downside into it buys the end of the move.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On volatility'
- id: C22
  text: A high VIX is not a sell. It means protection is already expensive.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On volatility'
- id: C23
  text: Two instruments that must move opposite each other are a cross-check. Agreement is evidence; disagreement
    is a warning to distrust the primary reading.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On volatility'
- id: C24
  text: Divergence is momentum failing behind price, in exactly three forms - classic oscillator, cross-asset
    non-confirmation, and positioning against price. Widening what each type reads is fine; adding a fourth
    type is not.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On divergence'
- id: C25
  text: Divergence earns its weight by agreement, not by existence. One is a straw; four that line up are
    a pile.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On divergence'
- id: C26
  text: A single-horizon reading is a readout, not a trigger. Measure the false positive rate before promoting
    any detector to a warning.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On divergence'
- id: C27
  text: A bounded oscillator drifting off its plateau is what a healthy trend looks like. Do not read the
    normal state of a trend as a warning.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On divergence'
- id: C28
  text: The read is only as current as its oldest input. A run stamped today built on three-week-old data
    is a three-week-old read, whatever the timestamp says.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C29
  text: Stale-but-present is the sneaky half of a failed fetch. Guard freshness by recency, never by size
    - a file that stopped updating still has plenty of rows.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C30
  text: 'A missing input is refused, not zeroed. "Unavailable" and "neutral" are different claims, and
    a map of zeros reads as the second.'
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C31
  text: An assumption ships as an assumption, in its own field, on every reading that depends on it.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C32
  text: A proxy is labelled and kept, never silently substituted and never dropped. Dropping it shrinks
    the denominator and silently re-rates everything else.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C33
  text: A skipped check must never look like a passed check. Report coverage alongside the result.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C34
  text: A share of conditions met is not a probability. Nothing fitted, nothing backtested, no base rate
    measured.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C35
  text: A thin reading cannot lead. A story scoring on two of seven conditions is not comparable to one
    scoring on seven of seven, and ranking them together lets a reading win on the strength of the data
    that is missing.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C36
  text: What is not true is as informative as what is. Carry the falsifiers - the conditions that would
    have to change for the reading to become right.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C37
  text: Two stories fitting one tape is contested, not a call.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C38
  text: Where the publisher gives the data away, go to the publisher. Paying a reseller for a public file
    is the wrong call.
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
- id: C39
  text: 'No jargon without its meaning, and no claim without its number. "Breadth is weak" cannot be checked;
    "0.328" cannot be understood.'
  status: unsourced_retained
  cite:
  - code: CVC
    section: '5 - Principles - On honesty about data'
recognisers:
  note: 'PROPOSED field mappings only — see build_status. src/macro/crown/ does not exist in this repo,
    so the `fields` below are drawn from the charter''s own s11 concept map (heartbeat / cta / cot / gamma
    / volatility / divergence / decision), not verified against a running schema or contracts/*.schema.json.
    They read exactly like the field references other voices'' recognisers carry, but unlike those voices
    (which point at live universe.json / bracket fields already served by AQE), these point at an artifact
    (output/crown_macro.json) that has not been built. Treat every `fields` entry here as a build spec,
    not a confirmed data contract, until src/macro/crown/ ships.'
  items:
  - id: R1
    if: heartbeat.regime resolves to broadening (equal-weight S&P gaining on cap-weight)
    then: Own breadth, but check heartbeat.range_position first - broadening into the top of its own 252-day
      range is late rather than early (C9, C10, C11).
    fields:
    - heartbeat.regime
    - heartbeat.range_position
    - heartbeat.confidence
  - id: R2
    if: heartbeat.regime resolves to narrowing (a handful of large names carrying the index)
    then: Stay with the leaders and keep risk defined - this is the NARROWING_CONCENTRATED family territory,
      not a reason to fade the move.
    fields:
    - heartbeat.regime
    - heartbeat.range_position
  - id: R3
    if: heartbeat.confidence < 0.40 (no clear breadth lead, or insufficient 252-day history)
    then: STOP. Report EARLY_EXIT. Every downstream section (CTA, COT, gamma, volatility, divergence, family,
      multiplier) stays empty because it never ran, not because it came back quiet (C3). Nothing computed
      here may leak into the answer.
    fields:
    - heartbeat.confidence
  - id: R4
    if: heartbeat.regime sits at the top (broadening) or bottom (narrowing) extreme of its own 252-day
      range
    then: This is the most actionable read Crown produces - a tired wave, not a live one. Prepare for rotation
      (broadening/top) or hunt breadth trades (narrowing/bottom) rather than extrapolating the current
      trend (C11).
    fields:
    - heartbeat.regime
    - heartbeat.range_position
  - id: R5
    if: volatility.state resolves to ELEVATED_RISING (VIXEQ minus VIX elevated AND widening)
    then: Hidden stress is building. Route to the HIDDEN_STRESS_DOWNSIDE family - buy cheap index downside,
      small tactical size, capped not compounded (C6, C21).
    fields:
    - volatility.state
    - volatility.level
    - volatility.direction
  - id: R6
    if: volatility.state resolves to ELEVATED_EASING (spread at an extreme level but falling)
    then: Stress is leaving, not building. This looks identical to R5 on a level chart alone and means
      the opposite - buying downside into an unwinding spread buys the end of the move. Do not route to
      HIDDEN_STRESS_DOWNSIDE on level alone; direction must be checked (C21).
    fields:
    - volatility.state
    - volatility.level
    - volatility.direction
  - id: R7
    if: cot.percentile >= 85th or <= 15th of its own 3-year range, in the direction price is already moving
    then: Crowded. This is context, never timing - it answers only whether the crowd is already positioned
      the way price is moving, and it can be 3 to 10 days stale (C16, C17).
    fields:
    - cot.percentile
    - cot.direction
  - id: R8
    if: cta.flip_risk (share of the trend-fund complex sitting at a trend extreme) is high, roughly two
      thirds or more
    then: Fragile trend complex. Cut size even though cta.overall_bias looks clean and directional - apply
      cta.size_adjustment around 0.60 rather than reading the bias at face value (C15).
    fields:
    - cta.flip_risk
    - cta.overall_bias
    - cta.size_adjustment
  - id: R9
    if: spot sits within roughly 1 percent of gamma.flip_level (the zero-crossing of cumulative gamma)
    then: Knife-edge. The character of the tape can change without price moving much - state the flip level
      itself, not a support/resistance framing, and carry gamma.assumption on every reading that depends
      on this (C18, C19).
    fields:
    - gamma.flip_level
    - gamma.sign
    - gamma.assumption
  - id: R10
    if: the index prints a new high while heartbeat.regime is narrowing, or divergence.type2_flags show
      the dollar bidding / protection getting costlier / the volatility gap widening against the index
    then: Non-confirmation. Log it as Type 2 cross-asset divergence (C24) and weigh by agreement, not existence
      - one flag is a straw, four that line up with the breadth read is a pile (C25).
    fields:
    - heartbeat.regime
    - divergence.type2_flags
    - volatility.state
  - id: R11
    if: volatility.level sits at or above roughly 25 (protection already expensive)
    then: Already priced. A fresh spike from here is not itself a reason to act - state that the cost of
      protection, not just its presence, is the read (C22).
    fields:
    - volatility.level
    - volatility.flags
methods: []
refusals:
- id: F1
  text: He does not size. He emits a multiplier on the operator's own risk budget. Risk per trade stays
    the operator's decision and the operator's rule.
- id: F2
  text: He does not name a ticker. He emits a family. The setup belongs to someone else.
- id: F3
  text: He places nothing.
- id: F4
  text: 'He emits no probabilities. Scenario scores are a share of conditions met - nothing fitted, nothing
    backtested, no base rate. A calibrated probability and a share of conditions must never be read as
    the same kind of number.'
seat: top-down macro regime
emits:
- expression_family
- size_multiplier
never_emits:
- ticker
- position
- order
- probability
reads_from: []
reads_from_note: Standalone by PM directive (charter s10.6). Reads nothing from SRM, Macro Weather or the
  Thematic RRG; nothing there reads Crown. The one meeting point is the (also unbuilt) scenario layer at
  output/macro_scenarios.json.
committee_placement: 'Weather/context voice, delivered AFTER nominations and alongside druckenmiller (committee-pm
  step 8, "Macro & SRM weather") - never a nominator, never part of the tally. PM-confirmed pairing, 2026-08-11:
  now-versus-next - crown reads the regime as it stands NOW, druckenmiller forecasts what comes NEXT. Step
  8''s skill card has not yet been edited to wire crown in alongside druckenmiller; that edit is a separate,
  not-yet-requested task.'
