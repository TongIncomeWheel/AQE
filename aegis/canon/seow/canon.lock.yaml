principles:
- id: C1
  text: 'Judge the chart with exactly two instruments and no more: a 20-period and a 40-period SIMPLE
    moving average, and a CCI oscillator with reference lines at +100 and -100. The moving averages give
    direction, the oscillator gives stretch. The author names no 50, 100 or 200 period average anywhere.'
  status: verified
  cite:
  - code: TSD
    page: 61
    extract_id: seow_tradersgps_2015#085
  - code: TSD
    page: 59
    extract_id: seow_tradersgps_2015#081
  - code: TSD
    page: 52
    extract_id: seow_tradersgps_2015#064
- id: C2
  text: Take the direction the two averages give you and no other. Go long only when the moving average
    is sloping up and the 20MA sits above the 40MA; go short only on the exact mirror, 20MA below a down-sloping
    40MA. The short side is the long side with every condition reversed, not a separate method.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#082
  - code: TSD
    page: 68
    extract_id: seow_tradersgps_2015#093
  - code: TSD
    page: 88
    extract_id: seow_tradersgps_2015#118
- id: C3
  text: Buy the dip inside the up-move; never buy the extension. In a strong up trend a pullback that
    retests the RISING average is what puts you in buy mode, and the full long set-up is five conditions
    on one bar — up-sloping MA, 20MA above 40MA, CCI below -100, the bar's LOW touching or piercing the
    20MA, and the CLOSE still above the 40MA. Four of five is not a set-up.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#082
  - code: TSD
    page: 75
    extract_id: seow_tradersgps_2015#100
  - code: TSD
    page: 58
    extract_id: seow_tradersgps_2015#079
- id: C4
  text: Grade the pullback before you grade the set-up. It must have lasted fewer than 5 days, be made
    of measured bars rather than big ones, follow a recent high, and hold above the 40MA. Reject it outright
    if the advance into that high was parabolic — a near-vertical run disqualifies the dip that follows
    it.
  status: verified
  cite:
  - code: TSD
    page: 67
    extract_id: seow_tradersgps_2015#091
  - code: TSD
    page: 67
    extract_id: seow_tradersgps_2015#092
- id: C5
  text: A set-up does not authorise an entry; only price does. Place a buy stop one tick above the PRIOR
    DAY'S HIGH and let the market come and take it. If it does not fire, re-place it the next session
    against the newest prior-day high and keep doing so until the level is broken — the set-up stays live,
    it does not expire and it is never chased at market.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#083
  - code: TSD
    page: 63
    extract_id: seow_tradersgps_2015#087
  - code: TSD
    page: 33
    extract_id: seow_tradersgps_2015#041
- id: C6
  text: Do not take a long in a name weaker than what it trades against. Measure the stock's performance
    against the broad market index or against its own industry group over the comparison window, and confine
    longs to the stocks that are beating it. This is stated as an odds requirement, not a preference.
  status: verified
  cite:
  - code: TSD
    page: 8
    extract_id: seow_tradersgps_2015#012
  - code: TSD
    page: 8
    extract_id: seow_tradersgps_2015#011
- id: C7
  text: 'Read the market in three layers and act on only two of them: the tide is the trend and you read
    it with the moving averages, the waves are retracements and you time them with CCI, the ripples are
    minor retracements and you MANAGE them with a trailing stop rather than trading them.'
  status: verified
  cite:
  - code: TSD
    page: 53
    extract_id: seow_tradersgps_2015#065
  - code: TSD
    page: 53
    extract_id: seow_tradersgps_2015#067
- id: C8
  text: The stop is fixed by the chart at the moment of entry, never chosen afterwards and never derived
    from how much you wish to lose. For an entry taken above the prior bar's high, put it one tick below
    the prior day's low, or one tick below the previous support, or one tick below the most recent swing
    low. For an entry on a breakout from a sideways base, put it one tick below the whole base or one
    tick below the breakout bar's low. Stop placement follows entry TYPE.
  status: verified
  cite:
  - code: TSD
    page: 60
    extract_id: seow_tradersgps_2015#084
  - code: TSD
    page: 64
    extract_id: seow_tradersgps_2015#088
  - code: TSD
    page: 81
    extract_id: seow_tradersgps_2015#109
  - code: TSD
    page: 82
    extract_id: seow_tradersgps_2015#110
- id: C9
  text: Once the trade has gained more than 5% from the ideal entry price, move the stop to breakeven.
    The gain is measured against the entry the plan specified, not against a fill you improved on.
  status: verified
  cite:
  - code: TSD
    page: 83
    extract_id: seow_tradersgps_2015#111
- id: C10
  text: Trail the stop one tick below the PREVIOUS DAY'S LOW and re-set it every session. It ratchets
    up with the trade and never moves down.
  status: verified
  cite:
  - code: TSD
    page: 84
    extract_id: seow_tradersgps_2015#112
- id: C11
  text: Impose a time stop at day 5. If by the fifth day the profit objective has not been reached and
    the stop has not triggered, exit on time alone — the position has failed to do what it was nominated
    to do, and that is sufficient reason.
  status: verified
  cite:
  - code: TSD
    page: 85
    extract_id: seow_tradersgps_2015#113
- id: C12
  text: Run all four stops on the same position at the same time — the initial stop set at entry, the
    breakeven stop after the 5% move, the daily trailing stop, and the day-5 time stop — and exit on whichever
    triggers first. They are one governing set, not a menu to choose from.
  status: verified
  cite:
  - code: TSD
    page: 86
    extract_id: seow_tradersgps_2015#114
- id: C13
  text: Take profit in parts, never in one piece. Either cover 30-50% of the position at the next resistance
    (next support on a short), or scale out progressively and keep scaling until the candles turn against
    you. Do not require the exact high; entries and exits are taken inside the move, not at its extremes.
  status: verified
  cite:
  - code: TSD
    page: 66
    extract_id: seow_tradersgps_2015#090
  - code: TSD
    page: 72
    extract_id: seow_tradersgps_2015#099
  - code: TSD
    page: 87
    extract_id: seow_tradersgps_2015#116
- id: C14
  text: 'A long has exactly two sanctioned exit reasons and no others: the candlestick turns red, or price
    CLOSES below support. After a red candle you do not sell into it — you place the sell for the NEXT
    session below that candle''s low. A support break requires a close; an intraday penetration is not
    a trigger, and the sale may be done that day or the next.'
  status: verified
  cite:
  - code: TSD
    page: 34
    extract_id: seow_tradersgps_2015#042
  - code: TSD
    page: 35
    extract_id: seow_tradersgps_2015#045
  - code: TSD
    page: 34
    extract_id: seow_tradersgps_2015#044
  - code: TSD
    page: 36
    extract_id: seow_tradersgps_2015#046
- id: C15
  text: 'Size the position from the stop, with a formula, before you trade it: shares = (portfolio value
    x maximum risk percent per trade) / (entry price - exit price). The worked example risks 2% of a $120,000
    book — $2,400 over an $0.18 stop distance, giving 13,333 shares. A trade with no stop cannot be sized,
    which is why the stop must exist first.'
  status: verified
  cite:
  - code: TSD
    page: 76
    extract_id: seow_tradersgps_2015#104
  - code: TSD
    page: 76
    extract_id: seow_tradersgps_2015#105
  - code: TSD
    page: 79
    extract_id: seow_tradersgps_2015#108
- id: C16
  text: 'Build the position across three signals rather than taking it at once: 50% of the intended size
    on the first signal, 30% on the second, 20% on the third — a declining ladder. Add only when the trade
    has proved you right, and sell fast when it proves you wrong. Adding to a losing position is not in
    the method at any size.'
  status: verified
  cite:
  - code: TSD
    page: 41
    extract_id: seow_tradersgps_2015#049
  - code: TSD
    page: 24
    extract_id: seow_tradersgps_2015#027
  - code: TSD
    page: 24
    extract_id: seow_tradersgps_2015#028
- id: C17
  text: 'A trade proposal is incomplete, and therefore not tradable, until eleven fields are filled: stock,
    long or short, entry, target, exit (the stop), time frame, risk-reward, set-up, trigger, source and
    remarks. Entry price, profit target, stop price and intended holding period are the four the author
    asks for by name. A nomination missing any of them is not a weak nomination — it is an absent one.'
  status: verified
  cite:
  - code: TSD
    page: 46
    extract_id: seow_tradersgps_2015#052
  - code: TSD
    page: 77
    extract_id: seow_tradersgps_2015#106
  - code: TSD
    page: 56
    extract_id: seow_tradersgps_2015#076
- id: C18
  text: State both the payoff and the probability BEFORE entry, not one of them. The payoff is the reward
    measured against the risk the stop defines; the probability is the historical hit rate of the set-up
    being taken. Mechanical trading means parameters that were back-tested on quantifiable data, so a
    set-up with no measured hit rate is not yet mechanical.
  status: verified
  cite:
  - code: TSD
    page: 4
    extract_id: seow_tradersgps_2015#002
  - code: TSD
    page: 22
    extract_id: seow_tradersgps_2015#022
- id: C19
  text: Once entry and exit criteria are defined, take every signal they generate exactly as generated
    and skip none of them; a discretionary judgement at entry or exit is a departure from the method,
    not a refinement of it. Fix the holding-period time frame before trading rather than per trade — the
    author's swing band is 2-5 days, which is what the day-5 time stop is calibrated to.
  status: verified
  cite:
  - code: TSD
    page: 22
    extract_id: seow_tradersgps_2015#023
  - code: TSD
    page: 22
    extract_id: seow_tradersgps_2015#024
  - code: TSD
    page: 16
    extract_id: seow_tradersgps_2015#020
  - code: TSD
    page: 16
    extract_id: seow_tradersgps_2015#021
- id: C20
  text: Frame every decision from the loss side first. Think about losing money rather than making it,
    and protect what you already have before reaching for what you do not — the stop, the size and the
    time limit are all settled before the target is discussed.
  status: verified
  cite:
  - code: TSD
    page: 57
    extract_id: seow_tradersgps_2015#078
- id: C21
  text: Do not open a daily long against a broken weekly structure; the higher timeframe frames the lower
    one, and a daily set-up inside a weekly breakdown is a set-up in the wrong direction.
  status: unsourced_retained
  reason: Retained from the recalled card and from this seat's live weekly-posture overlay. The 2015 deck
    is SILENT on multi-timeframe confirmation and in fact pushes the other way — slide 16 requires the
    trader to fix ONE trading time frame, and every condition on slides 58-75 is evaluated on a single
    bar series. Not contradicted, merely absent. The 2020 book `systematic_trader` has not been read;
    re-test this line against it before locking.
recognisers:
- id: R1
  if: sma20 > sma40 AND sma20[0] > sma20[5] AND cci20 < -100 AND low <= sma20 AND close > sma40
  then: mark this bar as a valid long SET-UP bar and arm an entry for the next session; if any one of
    the five is false there is no set-up and no order is placed
  fields:
  - sma20
  - sma40
  - sma20_slope_5d
  - cci20
  - low
  - close
- id: R2
  if: a set-up bar exists AND today's high > prior_bar_high + 1 tick
  then: the long entry fires at prior_bar_high + 1 tick as a buy stop; if the level is not taken out,
    re-arm the same order tomorrow against the NEW prior-bar high and repeat until it fires or the set-up
    conditions break
  fields:
  - prior_bar_high
  - high
  - tick_size
  - setup_flag
- id: R3
  if: a long entry has just filled
  then: set the initial stop at min(prior_bar_low, most_recent_swing_low) - 1 tick, or at prior_support
    - 1 tick; for a fill on a break out of a sideways base use min(base_low, breakout_bar_low) - 1 tick.
    Compute share count as floor((portfolio_value * risk_pct) / (entry - stop)) — no stop, no size, no
    trade
  fields:
  - prior_bar_low
  - most_recent_swing_low
  - prior_support
  - base_low
  - breakout_bar_low
  - entry
  - portfolio_value
  - risk_pct
- id: R4
  if: (close - entry) / entry > 0.05
  then: raise the protective stop to the entry price (breakeven) and never lower it again
  fields:
  - close
  - entry
- id: R5
  if: the position is open and a new session has begun
  then: set stop = max(current_stop, prior_day_low - 1 tick); the trail ratchets one way only
  fields:
  - prior_day_low
  - current_stop
  - tick_size
- id: R6
  if: days_held >= 5 AND high_since_entry < target AND stop has not triggered
  then: exit the position on time alone at the next open — the trade failed to perform inside its stated
    holding band
  fields:
  - days_held
  - high_since_entry
  - target
  - stop
- id: R7
  if: days_since_swing_high >= 5 OR max(pullback_bar_range) > 2 * atr20 OR close < sma40 OR (high_20d_ago_to_high_run
    > 40% over <= 10 sessions)
  then: reject the long set-up as an unqualified pullback — too long, too violent, below the 40MA, or
    following a parabolic advance. The bar-count and the 40MA test are the author's; the range and parabolic
    thresholds are our computable stand-ins for 'big candles' and 'parabolic', which the deck states qualitatively
  fields:
  - days_since_swing_high
  - pullback_bar_range
  - atr20
  - close
  - sma40
  - pct_run_10d
- id: R8
  if: stock_pct_change_63d <= index_pct_change_63d
  then: do not nominate the name long, regardless of set-up quality; substitute the stock's industry-group
    index for the broad index where a group series is available
  fields:
  - stock_pct_change_63d
  - index_pct_change_63d
  - industry_group_pct_change_63d
- id: R9
  if: position is open AND (close < open on today's bar) OR (close < support_level)
  then: arm the exit — on a down (red) candle place the sell for the NEXT session below that candle's
    low; on a close below support sell that session or the next. An intraday break of support with a close
    back above it is NOT a trigger. 'Candle turns red' is expressed here as close < open, which is the
    deck's own definition of a down candle, since the author's coloured candle is a vendor object
  fields:
  - close
  - open
  - low
  - support_level
