principles:
- id: C1
  text: 'Only buy when the general market is in a Confirmed Uptrend. The market gate is a hard pass/fail
    that runs BEFORE any stock is scored: no uptrend, no purchase, however good the name looks on its
    own.'
  status: verified
  cite:
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#079
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#143
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#144
- id: C2
  text: Call the top by counting distribution days — a major index closing down, or stalling on negligible
    progress, on volume heavier than the prior session. Four or five of them inside any four-to-five-week
    span means stop buying, sell the weakest positions and raise cash.
  status: verified
  cite:
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#081
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#082
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#083
- id: C3
  text: 'A new uptrend is confirmed only by a follow-through day: after an attempted rally begins, wait
    through Days 2 and 3, then look on Days 4 to 7 for a decisive index gain of at least 1.5–2.0% on volume
    above the previous day. No bull market has ever started without one.'
  status: verified
  cite:
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#088
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#089
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#090
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#091
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#092
  - code: CSKB
    page: 4
    extract_id: canslim_kb_v2#093
- id: C4
  text: Current quarterly EPS must be up at least +18–20% year over year against the same quarter of the
    prior year — preferably +25–50% — with growth accelerating over the latest one to two quarters and
    validated by sales growth of at least +25% or accelerating sales.
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#021
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#022
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#023
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#024
- id: C5
  text: Red-flag the name when quarterly EPS growth decelerates by two-thirds or more for two consecutive
    quarters; that is a sell signal, not a dip to buy.
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#027
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#136
- id: C6
  text: Annual EPS must have risen in each of the last three years at 25–50%, with return on equity at
    least 17% and annual cash flow per share at least 20% above reported EPS. Any down year in three is
    a red flag.
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#028
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#029
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#030
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#031
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#154
- id: C7
  text: Something must be new — a new product or service, new management, or new industry conditions —
    and the price must be making new highs out of a sound base. What looks too high and risky to the majority
    usually goes higher; what looks cheap usually goes lower.
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#033
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#035
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#036
- id: C8
  text: 'Supply and demand: daily volume must average several hundred thousand shares so the position
    can be exited, and management must be aligned — consistent buybacks of 5–10% of stock, insider ownership
    of at least 1–3%, and debt falling as a share of equity.'
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#037
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#038
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#039
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#040
- id: C9
  text: Buy strictly the number 1, 2 or 3 stock in its industry group, measured on current and annual
    earnings growth, ROE, margins, sales growth and relative strength. Never buy the cheaper competitor
    moving in sympathy with the leader.
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#041
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#042
- id: C10
  text: 'Relative strength is a gate, not a garnish: an RS Rating below 80 is a rejection, 90–99 is the
    target, and a holding whose RS Rating falls below 70 is sold.'
  status: verified
  cite:
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#168
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#170
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#134
- id: C11
  text: Institutional sponsorship must be present, rising and of quality — at least twenty sponsors for
    a smaller name, the owner count increasing over recent quarters, at least one top-rated fund among
    them, and new positions preferred over old holdings. A name overowned by thousands of institutions
    late in a bull cycle is a red flag, not a validation.
  status: verified
  cite:
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#043
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#044
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#045
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#046
  - code: CSKB
    page: 2
    extract_id: canslim_kb_v2#047
- id: C12
  text: 'The cup with handle is the baseline pattern and it has arithmetic: a prior uptrend of at least
    +30%, a base lasting at least 7 to 8 weeks, a decline from peak to cup bottom of 12–33%, and a rounded
    U-shaped bottom rather than a sharp V.'
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#049
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#050
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#051
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#053
- id: C13
  text: A base that corrects more than 50% is disqualified — such bases fail overwhelmingly, and a stock
    that must climb back that far is repairing damage, not building a launchpad.
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#052
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#162
- id: C14
  text: The handle must form in the upper half of the base, above the 10-week line, last more than one
    week (typically one to four), correct no more than 8–12% in a bull market, and drift DOWNWARD along
    its lows. A handle that wedges up or runs flat has not shaken out the weak holders and is rejected.
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#054
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#055
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#056
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#058
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#059
- id: C15
  text: Volume must dry up dramatically at the lows of the cup and again in the final week of the handle
    — the absence of selling is what makes the breakout possible.
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#060
- id: C16
  text: On the breakout day, volume must be at least +40% to +50% above the 50-day average. A breakout
    on volume under +40% above average is a hard rejection, not a weaker buy.
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#061
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#164
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#166
- id: C17
  text: 'The pivot is the peak of the handle area. Never buy more than 5% past it: 5.1–10% extended is
    a late buy carrying a warning, and more than 10% extended is a hard rejection. Chasing past 5% puts
    the entry inside the range of a normal pullback.'
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#062
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#063
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#164
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#165
- id: C18
  text: 'Other sound bases exist and each has its own specification: the double bottom whose second low
    must undercut the first and whose pivot is the middle peak; the flat base of at least five to six
    weeks correcting no more than 10–15%; the square box of four to seven weeks; the high, tight flag
    after a 100–120% run; the base on top of a base; and the ascending base of three higher pullbacks
    of 10–20%.'
  status: verified
  cite:
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#066
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#067
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#069
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#070
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#072
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#074
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#075
  - code: CSKB
    page: 3
    extract_id: canslim_kb_v2#078
- id: C19
  text: Count the bases. A third- or fourth-stage base is obvious to everyone and is at best a warning;
    a breakout attempt from a late-stage base is a sell, not a buy.
  status: verified
  cite:
  - code: CSKB
    page: 7
    extract_id: canslim_kb_v2#161
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#133
- id: C20
  text: Every purchase carries an automatic stop at a maximum of 7–8% below cost, with no exception, and
    the average of all realised losses must be held under 5–6%. In bear or correction-prone markets the
    limit tightens to 3–4%. Never average down.
  status: verified
  cite:
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#099
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#100
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#102
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#103
- id: C21
  text: 'Pyramid into strength, never into weakness: the initial buy is at the pivot, the first add-on
    comes when the stock is +2.0–2.5% above it, each add-on is smaller than the last, and no add-on is
    permitted once the stock is more than +5% past the pivot.'
  status: verified
  cite:
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#105
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#106
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#107
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#108
- id: C22
  text: 'Take profits at +20–25%, which against a 7–8% stop holds the gain-to-loss ratio at three to one.
    The single exception is the eight-week rule: a stock that vaults +20% or more within three weeks of
    its breakout is held a full eight weeks, and during that hold it should ride its 10-week line.'
  status: verified
  cite:
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#109
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#110
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#111
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#112
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#113
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#115
- id: C23
  text: Concentrate. Wide diversification is a substitute for lack of knowledge; when the book is at its
    cap and a compelling breakout appears, force out the weakest holding rather than widen the book.
  status: verified
  cite:
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#119
  - code: CSKB
    page: 5
    extract_id: canslim_kb_v2#120
- id: C24
  text: Sell into the climax, not after it. The signals are an extended stock printing its largest daily
    gain of the entire advance, its heaviest single day of volume, an unfilled exhaustion gap, wide weekly
    spread closing flat on heavy volume, a break above the upper channel line, or a price 70–100% above
    its 200-day moving average.
  status: verified
  cite:
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#122
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#123
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#124
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#125
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#127
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#129
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#130
- id: C25
  text: 'Distribution shows up before the price does: a new high on lower volume means institutional buying
    has stopped, closes repeatedly at the day''s low mean the same, and a breakout with no confirming
    strength from other names in the group is a Lone Ranger and is sold.'
  status: verified
  cite:
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#131
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#132
  - code: CSKB
    page: 6
    extract_id: canslim_kb_v2#135
recognisers:
- id: R1
  if: the market gate has not been shown to me as a Confirmed Uptrend at nomination time
  then: I do not claim it either way — I mark market_gate DELEGATED, name it as a live condition on the
    entry, and never write a market read I did not compute (C1, C2, C3)
  fields:
  - srm_weather
  - macro_brief
- id: R2
  if: rs_leadership is not LEADER, or the name is not top of its group
  then: it fails the L test — a laggard moving with the leader is the trade I am specifically told not
    to take (C9, C10)
  fields:
  - rs_leadership
  - rank
  - gics_sector
- id: R3
  if: structure is weak or structure_shift shows no completed consolidation, or lens.coil is absent
  then: there is no sound base and therefore no pivot; nothing after this step can rescue the name (C12,
    C14, C18)
  fields:
  - structure
  - structure_shift
  - lens.coil
  - lens.structure
- id: R4
  if: day_vol (today's volume over its own 20-day average) is below 1.40
  then: 'the breakout is unconfirmed — under +40% above average volume is a hard rejection, not a softer
    buy (C16). Declared substitute: O''Neil''s measure is the 50-day average; the universe supplies the
    20-day'
  fields:
  - day_vol
  - rvol
- id: R5
  if: price sits more than 5% above the entry/pivot, or sma_distance_pct is far above the set median
  then: the buy is late — 5.1-10% past pivot is a warning, past 10% is a rejection, and no add-on may
    be made at all (C17, C21)
  fields:
  - entry
  - bracket.price
  - sma_distance_pct
- id: R7
  if: price is 70% or more above ma_200
  then: this is a climax reading, not an entry — an extended name that far above its 200-day is sold into
    strength, never bought (C24)
  fields:
  - ma_200
  - bracket.price
  - sma_distance_pct
- id: R8
  if: a held name closes below ma_50 on heavy volume, or lives below it for eight or nine consecutive
    weeks
  then: the 10-week line has failed and institutional support has gone — sell (C22, C25)
  fields:
  - ma_50
  - day_vol
  - held
- id: R9
  if: lens.sector is weak or sector_trend_state is not confirming while the name breaks out alone
  then: Lone Ranger — a breakout with no group confirmation is sold, not bought (C25)
  fields:
  - lens.sector
  - sector_trend_state
  - gics_sector
- id: R10
  if: the fundamental half (C4, C5, C6, C8, C11) cannot be tested from the universe file
  then: I declare fundamentals NOT_AVAILABLE and name the letters I could not test. I never infer earnings,
    ROE, sales, sponsorship or insider ownership from price and volume, and I never let a technical pass
    stand in for them
  fields:
  - sc_momentum
  - structure
- id: R11
  if: a held name carries hl_score or hl_state
  then: 'I map it onto my own sell rules rather than treating it as a verdict. C10 is the closest fit —
    a holding whose relative strength decays is SOLD, and hl_score''s hl_rs component is the only RS-decay
    read served for a held position. hl_state EXIT is consistent with a sell and I act on it. hl_state
    HOLD_ADD never overrides C20''s automatic 7-8 percent stop, C19''s late-stage-base warning, or C25''s
    distribution signals — a health score measures the position''s current condition, not the base it broke
    out of. I declare hl_rs NOT_SERVED as a separate figure: only the composite is exported, so I cannot
    see whether the decay is relative strength (my test) or risk (not my test).'
  fields:
  - held
  - hl_score
  - hl_state
  - sc_momentum
