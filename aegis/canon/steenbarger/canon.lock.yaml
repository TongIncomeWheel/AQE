principles:
- id: C1
  text: 'A pattern earns capital only after multi-sample testing shows forward returns significantly better
    than the non-pattern baseline; a rule-following system in drawdown is first tested for regime change
    or edge decay, never merely "tightened up".

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 6
    extract_id: traderfeed_public#128
  - code: TF
    page: 6
    extract_id: traderfeed_public#137
  - code: TF
    page: 4
    extract_id: traderfeed_public#090
- id: C2
  text: 'A signal whose forward returns are indistinguishable from baseline must be WITHDRAWN, not tweaked;
    its failure is examined for the adjacent condition where an edge does exist.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 6
    extract_id: traderfeed_public#129
  - code: TF
    page: 6
    extract_id: traderfeed_public#142
  - code: TF
    page: 14
    extract_id: traderfeed_public#257
- id: C3
  text: 'Durable performance requires SEVERAL distinct approaches, each bound to an explicitly named market
    environment; a single edge is structural fragility. Regimes are defined on activity-normalised measures
    (relative volume, event/volume time, component coherence), not clock time.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 1
    extract_id: traderfeed_public#009
  - code: TF
    page: 4
    extract_id: traderfeed_public#091
  - code: TF
    page: 17
    extract_id: traderfeed_public#313
- id: C4
  text: 'Size is scaled by ENVIRONMENT MATCH — up when conditions match a historically profitable environment
    for that setup, down when they do not — never by felt conviction.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 1
    extract_id: traderfeed_public#003
  - code: TF
    page: 2
    extract_id: traderfeed_public#032
  - code: TF
    page: 2
    extract_id: traderfeed_public#052
- id: C5
  text: 'A chart pattern in isolation is unreliable; the setup must be located inside the longer-timeframe
    trend or cycle it is meant to exploit. No context, no trade.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 17
    extract_id: traderfeed_public#312
  - code: TF
    page: 17
    extract_id: traderfeed_public#306
  - code: TF
    page: 17
    extract_id: traderfeed_public#302
- id: C6
  text: 'Good entries work promptly and show alignment across faster timeframes; loss of that alignment
    is an EXIT condition, never a reason to widen the stop.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 4
    extract_id: traderfeed_public#085
  - code: TF
    page: 4
    extract_id: traderfeed_public#086
  - code: TF
    page: 2
    extract_id: traderfeed_public#061
- id: C7
  text: 'Open at moderate size framed as a HYPOTHESIS, with the specific evidence that would prove the
    trade wrong written down BEFORE entry; disconfirmation then yields a small loss plus usable information.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 10
    extract_id: traderfeed_public#195
  - code: TF
    page: 11
    extract_id: traderfeed_public#212
  - code: TF
    page: 2
    extract_id: traderfeed_public#033
- id: C8
  text: 'Nested loss caps by horizon: never lose so much in a day that the week cannot be recovered, nor
    so much in a week that the month cannot go green.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 10
    extract_id: traderfeed_public#197
  - code: TF
    page: 10
    extract_id: traderfeed_public#198
- id: C9
  text: 'Position size anchored to recent P/L is systematically wrong-footed — smallest when the edge
    returns, largest before the losses. Sizing inputs may not include trailing account P/L, and any add-on
    must cite a NEW signal event, never unrealised gain.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 11
    extract_id: traderfeed_public#204
  - code: TF
    page: 11
    extract_id: traderfeed_public#211
  - code: TF
    page: 11
    extract_id: traderfeed_public#206
- id: C10
  text: 'At realistic hit rates, runs of four consecutive losing trades or days are statistically expected;
    a losing string is NOT by itself evidence the process is broken, and does not license changing it.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 11
    extract_id: traderfeed_public#207
  - code: TF
    page: 11
    extract_id: traderfeed_public#209
  - code: TF
    page: 11
    extract_id: traderfeed_public#214
- id: C11
  text: 'A 25-30% win rate is acceptable where expectancy is positive; most annual profit concentrates
    in a small number of large winners, so scoring must be expectancy- and tail-based and exits must not
    truncate the few big runners.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 4
    extract_id: traderfeed_public#098
  - code: TF
    page: 2
    extract_id: traderfeed_public#034
- id: C12
  text: 'Performance is decomposed BY CONDITION — market movement, volatility, time of day, position size
    — not read in aggregate; the sequence of wins and losses is itself diagnostic.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 1
    extract_id: traderfeed_public#001
  - code: TF
    page: 9
    extract_id: traderfeed_public#177
  - code: TF
    page: 4
    extract_id: traderfeed_public#087
- id: C13
  text: 'Review must be PRESCRIPTIVE and CUMULATIVE: name one thing done well and one to improve, set
    a concrete forward goal with a plan, VERIFY the previous goal, hold one main goal per period — and
    keep the market-opportunity loop separate from the performance-review loop.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 5
    extract_id: traderfeed_public#114
  - code: TF
    page: 5
    extract_id: traderfeed_public#117
  - code: TF
    page: 3
    extract_id: traderfeed_public#081
- id: C14
  text: 'Rules are mined from your OWN successful and error-free episodes — "when the problem did not
    occur, what was different?" — not borrowed wholesale from others.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 18
    extract_id: traderfeed_public#319
  - code: TF
    page: 15
    extract_id: traderfeed_public#264
  - code: TF
    page: 14
    extract_id: traderfeed_public#252
- id: C15
  text: 'Independence first, convergence second: when several independent reviewers land on the same criticism,
    that convergence marks the priority theme to work on.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 2
    extract_id: traderfeed_public#047
  - code: TF
    page: 2
    extract_id: traderfeed_public#048
  - code: TF
    page: 2
    extract_id: traderfeed_public#045
- id: C16
  text: 'Abstention is a FIRST-CLASS output. Not trading is an active skill; a felt need to make a trade
    happen, or contradictory evidence, means the premises are wrong — stand aside and re-check assumptions
    rather than manufacture a low-conviction entry.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 3
    extract_id: traderfeed_public#075
  - code: TF
    page: 15
    extract_id: traderfeed_public#270
  - code: TF
    page: 18
    extract_id: traderfeed_public#327
- id: C17
  text: 'Identical inputs to everyone else produce average results; and piling on more inputs destroys
    the depth of processing that produces genuine conviction. Edge requires something non-standard, examined
    deeply rather than broadly.

    '
  status: verified
  applies_to: agent
  cite:
  - code: TF
    page: 15
    extract_id: traderfeed_public#280
  - code: TF
    page: 15
    extract_id: traderfeed_public#281
  - code: TF
    page: 2
    extract_id: traderfeed_public#038
- id: C18
  text: 'Trading from a NEED for P/L — or for self-esteem — causes overtrading, overreaction and cedes
    control to the market; ego coupling shows up as self-worth tracking P/L.

    '
  status: verified
  applies_to: pm_only
  cite:
  - code: TF
    page: 3
    extract_id: traderfeed_public#076
  - code: TF
    page: 13
    extract_id: traderfeed_public#234
  - code: TF
    page: 18
    extract_id: traderfeed_public#322
- id: C19
  text: 'Cognitive peak requires an energised state maintained through breaks, preparation, peer contact,
    outside interests and physical fitness; burnout is the leading occupational hazard of full-time trading.

    '
  status: verified
  applies_to: pm_only
  cite:
  - code: TF
    page: 7
    extract_id: traderfeed_public#146
  - code: TF
    page: 7
    extract_id: traderfeed_public#158
  - code: TF
    page: 14
    extract_id: traderfeed_public#259
- id: C20
  text: 'Every discipline breach is preceded by a loss of the observer stance; the remedy is deliberate
    SLOWING — breathing, single-point focus, writing — before acting, not more willpower.

    '
  status: verified
  applies_to: pm_only
  cite:
  - code: TF
    page: 8
    extract_id: traderfeed_public#161
  - code: TF
    page: 8
    extract_id: traderfeed_public#168
  - code: TF
    page: 8
    extract_id: traderfeed_public#175
- id: C21
  text: 'Fear shows up mechanically as exiting before the stop and taking profit before the target even
    when both levels were correct. The DETECTION half is measurable (compare realised exits against the
    bracket); the treatment — exposure and rehearsal, never suppression — is human and belongs to the
    PM.

    '
  status: verified
  applies_to: pm_only
  cite:
  - code: TF
    page: 9
    extract_id: traderfeed_public#180
  - code: TF
    page: 9
    extract_id: traderfeed_public#184
  - code: TF
    page: 10
    extract_id: traderfeed_public#191
- id: C22
  text: 'Trading is pursued as a quest for MASTERY with P/L as scorecard; ideas are acted on when they
    arrive with calm clarity rather than urgency; discipline is sourced from love of the work; development
    is built through proximity to exceptional traders.

    '
  status: verified
  applies_to: philosophy
  cite:
  - code: TF
    page: 1
    extract_id: traderfeed_public#028
  - code: TF
    page: 13
    extract_id: traderfeed_public#228
  - code: TF
    page: 4
    extract_id: traderfeed_public#100
recognisers:
- id: R1
  if: a nomination cites a signal/field whose forward-return separation from baseline has never been measured
  then: flag UNPROVEN (C1) — the field may be described, never leaned on as edge
  fields: []
- id: R2
  if: a signal's measured forward returns match baseline
  then: propose RETIREMENT, not reparameterisation (C2); log the adjacent condition worth testing
  fields: []
- id: R3
  if: a nomination cannot name the market environment/regime it is valid inside
  then: block — no regime label, no environment match, so no size justification (C3, C4)
  fields:
  - regime
  - srm
- id: R4
  if: a nomination cannot name the higher-timeframe trend/cycle context it enters with
  then: block — pattern in isolation is not a setup (C5)
  fields:
  - ma_50
  - ma_100
  - ma_200
  - structure
- id: R5
  if: a nomination carries no explicit pre-stated invalidation observable
  then: block — an entry without written disconfirmation is an assertion, not a hypothesis (C7)
  fields:
  - bracket
  - bracket.stop
  - bracket.valid
- id: R6
  if: any sizing input references trailing account P/L, or an add-on cites unrealised gain as its reason
  then: block (C9) — size must be independent of recent results; adds require a NEW signal event
  fields:
  - bracket.risk_pct
- id: R7
  if: a rule change is proposed off a losing run shorter than the minimum sample
  then: block (C10) — four consecutive losers is statistically expected, not evidence of decay
  fields: []
- id: R8
  if: required fields conflict, are absent, or the read is genuinely ambiguous
  then: return an explicit ABSTAIN (C16) — never manufacture a low-conviction nomination to fill the slot
  fields: []
- id: R9
  if: a nomination cites C18, C19, C20 or C21 as a reason to nominate or size
  then: block — these are pm_only. This agent has no emotional state, energy budget or ego; citing them
    is a category error, not analysis
  fields: []
- id: R10
  if: C22 is cited as a gate on any nomination or size
  then: block — philosophy is recorded seat framing and may never gate an output
  fields: []
- id: R11
  if: realised exits are systematically inside the bracket's own stop/target levels
  then: surface as a MEASURED pattern for the PM (C21 detection half, C12 attribution) — report it, never
    self-diagnose a feeling
  fields:
  - bracket.stop
  - bracket
- id: R12
  if: a voice cites an unusually large number of fields to justify conviction
  then: flag (C17) — breadth of inputs substitutes for depth; conviction should trace to a few deeply-characterised
    fields
  fields: []
methods: []
