- key: trades_about_to_happen_2013
  title: 'Trades About to Happen: A Modern Adaptation of the Wyckoff Method'
  author: David H. Weis
  year: 2013
  code: TATH
  weight: foundational
  kind: book
  isbn: 978-0-470-48780-8
