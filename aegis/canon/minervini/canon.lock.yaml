principles:
- id: C1
  text: 'SEPA — Specific Entry Point Analysis — is a five-element sequential filter, not five independent
    checks run in any order. It runs: (1) Trend — the stock must already be in a confirmed stage 2 uptrend
    (the Trend Template, C3); (2) Fundamentals — the company must show the earnings, sales and margin
    characteristics of a genuine growth business (C12); (3) Catalyst — a new development explaining why
    THIS stock outperforms now; (4) Entry point — the precise, low-risk pivot at which risk is genuinely
    small (C5); (5) Exit — stop-loss points must be fixed before entry, because correct entries still
    fail, and the end of a superperformance phase must be recognised to bank gains (C7). The Trend Template
    alone eliminates roughly 95 percent of the universe before fundamentals are even examined; SEPA is
    sequential funnel, not a scorecard averaged across five inputs.'
  status: verified
  cite:
  - code: TLSMW
    page: 47
    extract_id: trade_like_champion_2013#046
  - code: TLSMW
    page: 47
    extract_id: trade_like_champion_2013#047
  - code: TLSMW
    page: 46
