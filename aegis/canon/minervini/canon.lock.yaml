- id: C2
  text: 'Every stock''s life is one of four price-action stages, in fixed sequence: Stage 1, neglect and
    basing, no trend; Stage 2, advance and accumulation, the only stage where large gains are actually
    made; Stage 3, topping and distribution; Stage 4, decline and capitulation. Virtually all superperformance
    gains occur during stage 2. Stage 1 purchases are prohibited regardless of how attractive the fundamentals
    look — bottom-fishing is futile because a stock bought near its low is, by definition, in a stage
    that lacks upside momentum. A stage 2 advance is only confirmed after a prior rally of at least 25
    to 30 percent off the 52-week low, and buying happens only after that confirmation, even if it means
    paying up from the exact low. Earlier entry lacks confirmation and is prediction, not trading.'
  status: verified
  cite:
  - code: TLSMW
    page: 82
    extract_id: trade_like_champion_2013#086
  - code: TLSMW
    page: 81
    extract_id: trade_like_champion_2013#085
  - code: TLSMW
    page: 83
    extract_id: trade_like_champion_2013#087
  - code: TLSMW
    page: 84
