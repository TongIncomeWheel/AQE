- id: C4
  text: 'THE VOLATILITY CONTRACTION PATTERN (VCP) is the base''s technical footprint under accumulation:
    two to six successive price contractions, most commonly two to four, beginning with the deepest —
    roughly 25 percent — and each successive contraction roughly half the depth of the one before it,
    accompanied by volume contracting at the same points. A flat base of four to seven weeks with no visible
    volatility contraction, correcting only about 10 to 15 percent sideways, is a valid variant. Bases
    within a confirmed stage 2 uptrend most commonly last 5 to 26 weeks; this is not stage 1 basing and
    must not be confused with it — the VCP forms ON TOP of an already-confirmed uptrend.'
  status: verified
  cite:
  - code: TLSMW
    page: 246
    extract_id: trade_like_champion_2013#299
  - code: TLSMW
    page: 246
    extract_id: trade_like_champion_2013#301
  - code: TLSMW
    page: 247
    extract_id: trade_like_champion_2013#302
  - code: TLSMW
    page: 249
    extract_id: trade_like_champion_2013#304
  - code: TLSMW
    page: 100
    extract_id: trade_like_champion_2013#107
- id: C5
  text: THE PIVOT BUY POINT is the final, tightest contraction of the VCP, on very low volume, showing
    that selling activity has dried up. Entry is made as price crosses above the pivot WITH volume expanding
    — the buy is the breakout, not the anticipation of one. Entry must be close to the pivot; chasing
    a stock more than a few percent above it is not acceptable, because the risk-to-reward math the whole
    method depends on breaks down once the stop-to-entry distance stops being small. A stop-loss trader
    is by definition a weak holder, so a correctly-timed entry comes only after other weak holders have
    already been shaken out by the base's own contractions.
  status: verified
  cite:
  - code: TLSMW
    page: 252
    extract_id: trade_like_champion_2013#306
  - code: TLSMW
    page: 253
    extract_id: trade_like_champion_2013#308
  - code: TLSMW
    page: 279
    extract_id: trade_like_champion_2013#334
  - code: TLSMW
    page: 281
    extract_id: trade_like_champion_2013#335
  - code: TLSMW
    page: 256
    extract_id: trade_like_champion_2013#311
- id: C6
  text: The volume signature is read at every stage of the base and the breakout, and it must confirm
    the price action or the setup is not valid. On the final contraction, volume should run below the
    50-day average with one or two extremely low-volume days — dramatic volume dry-up combined with price
    tightness signals an imminent breakout. The breakout itself must occur on expanding volume. After
    the breakout, the normal reaction pattern is volume CONTRACTING on pullbacks and EXPANDING on the
    recovery back to new highs; a pullback on rising volume, or a recovery on light volume, is a warning
    the move is not genuine.
  status: verified
  cite:
  - code: TLSMW
    page: 285
    extract_id: trade_like_champion_2013#340
  - code: TLSMW
    page: 253
    extract_id: trade_like_champion_2013#308
  - code: TLSMW
    page: 300
    extract_id: trade_like_champion_2013#358
  - code: TLSMW
    page: 311
    extract_id: trade_like_champion_2013#370
- id: C7
  text: A maximum stop-loss price is fixed BEFORE entry, never after, and the exit is executed the instant
    that price trades — no exceptions for a name's quality or blue-chip status, and no re-evaluation in
    the moment. A position whose open gain is already a multiple of the original stop-loss distance should
    never be permitted to round-trip back into a loss; the stop is raised to protect what has been earned.
    Correct entries still fail — the stop-loss is not a sign the method is broken, it is the method's
    built-in acknowledgement that every individual trade is a probabilistic bet, not a certainty.
  status: verified
  cite:
  - code: TLSMW
    page: 46
    extract_id: trade_like_champion_2013#045
  - code: TLSMW
    page: 354
    extract_id: trade_like_champion_2013#419
  - code: TLSMW
    page: 367
    extract_id: trade_like_champion_2013#436
  - code: TLSMW
    page: 368
    extract_id: trade_like_champion_2013#440
- id: C8
  text: 'Position size is a function of reward-to-risk, not a flat percentage rule. A trader running a
    2:1 reward-to-risk profile has an optimal position size around 25 percent of capital on that single
    idea — the tighter and more favourable the stop-to-target ratio, the larger the size that math supports.
    Size should also track RECENT trading performance: expand it after a run of correct calls and contract
    it after losses, so the largest bets are placed while trading well and the smallest while trading
    poorly. Risk is controllable through exactly three levers — position size, the timing of entries and
    exits, and contingency preparation made in advance — and nothing else.'
  status: verified
  cite:
  - code: TLSMW
    page: 388
    extract_id: trade_like_champion_2013#484
  - code: TLSMW
    page: 380
    extract_id: trade_like_champion_2013#470
  - code: TLSMW
    page: 366
    extract_id: trade_like_champion_2013#434
- id: C9
  text: 'The key difference between professionals and amateurs under adversity: professionals SCALE INTO
    a position with pre-planned tranches, adding only in the direction of the trade after it has already
    shown a profit; amateurs AVERAGE DOWN into a loser, adding to a position that is proving them wrong.
    Pullback-buy additions wait specifically for the turn back up, never for the low itself. Pyramiding
    — sizing up while trading well, tapering while trading poorly (C8) — is the size-management expression
    of the same discipline; averaging down is its exact inversion.'
  status: verified
  cite:
  - code: TLSMW
    page: 382
    extract_id: trade_like_champion_2013#471
  - code: TLSMW
    page: 382
    extract_id: trade_like_champion_2013#472
  - code: TLSMW
    page: 380
    extract_id: trade_like_champion_2013#470
- id: C10
  text: Trading is about making money, not about being proven right, and the two are frequently in direct
    conflict. Ego and social embarrassment are named as the specific mechanism that causes traders to
    hold a loser past the point they already know they should sell — a stock falls 5, then 10, then 15
    percent while the holder waits to be vindicated rather than exits. Holding a loser back to breakeven
    is economically IDENTICAL to putting the same capital into a fresh setup, minus the ego attachment
    to being right about the original one. A losing streak has exactly two possible causes — flawed selection
    criteria, or a hostile general market — and the correct response to either is to SCALE DOWN exposure
    and raise cash; trading larger to recoup losses faster is explicitly named as a way to compound the
    damage.
  status: verified
  cite:
  - code: TLSMW
    page: 27
    extract_id: trade_like_champion_2013#011
  - code: TLSMW
    page: 28
    extract_id: trade_like_champion_2013#013
  - code: TLSMW
    page: 359
    extract_id: trade_like_champion_2013#426
  - code: TLSMW
    page: 377
    extract_id: trade_like_champion_2013#462
  - code: TLSMW
    page: 378
    extract_id: trade_like_champion_2013#464
- id: C11
  text: 'Buy relative strength, never weakness — the author states this as a hard-won reversal of an earlier,
    losing habit of buying stocks that had fallen and looked cheap. Relative strength ranking no less
    than 70 (preferably 80s/90s) is Trend Template criterion 8 (C3), and it is watched continuously, not
    just at entry: leaders display relative strength AHEAD of their advance and often act independently
    of the general market averages, and a stock marking time sideways while the broad market falls is
    itself a way of building relative strength that shows up before the breakout. Within any leading group,
    the highest relative-strength names lead first and appreciate the most — the second- and third-ranked
    names in the group are followers, not the trade.'
  status: verified
  cite:
  - code: TLSMW
    page: 41
    extract_id: trade_like_champion_2013#033
  - code: TLSMW
    page: 100
    extract_id: trade_like_champion_2013#106
  - code: TLSMW
    page: 206
    extract_id: trade_like_champion_2013#254
  - code: TLSMW
    page: 221
    extract_id: trade_like_champion_2013#263
  - code: TLSMW
    page: 141
    extract_id: trade_like_champion_2013#157
  - code: TLSMW
    page: 234
    extract_id: trade_like_champion_2013#278
- id: C12
  text: 'The earnings-growth profile of a genuine market leader in its high-growth phase runs 20 percent
    or better, often 35 to 45 percent at its strongest, with quarterly earnings ACCELERATING — each quarter''s
    growth rate exceeding the prior quarter''s — which is what builds the earnings-per-share momentum
    that draws in momentum buyers and pushes the price further. No fixed P/E ceiling applies to a genuine
    superperformance candidate: a high P/E deserves study rather than automatic exclusion when a new development
    or catalyst can drive explosive earnings growth, and an initially rich valuation is justified so long
    as earnings growth keeps pace with or outruns the price''s appreciation. The core setup is the PAIRING
    of the stage 2 technical condition (C2) with this earnings-growth profile — no forecast or prediction
    of future earnings is required, only confirmation that both conditions are already true together,
    now.'
  status: verified
  cite:
  - code: TLSMW
    page: 124
    extract_id: trade_like_champion_2013#130
  - code: TLSMW
    page: 159
    extract_id: trade_like_champion_2013#186
  - code: TLSMW
    page: 161
    extract_id: trade_like_champion_2013#189
  - code: TLSMW
    page: 55
    extract_id: trade_like_champion_2013#057
  - code: TLSMW
    page: 63
    extract_id: trade_like_champion_2013#064
  - code: TLSMW
    page: 69
    extract_id: trade_like_champion_2013#068
- id: C13
  text: THE LEADERSHIP PROFILE and THE BROKEN-LEADER SYNDROME are opposite ends of the same discipline.
    Every candidate is first sorted into one of six maturation categories; the preferred category is the
    MARKET LEADER — ranked number one, two or three in its industry by sales and earnings, with rising
    market share, and in some cases a CATEGORY KILLER whose brand and market position are so dominant
    that unlimited rival capital could not dislodge it. Attention and capital belong in the top two or
    three names of a leading group, ranked on the group's own metrics — not spread evenly across it. The
    broken-leader syndrome is the specific, named trap of buying a FORMER leader after it has already
    topped and broken down, usually well into a stage 4 decline, on the mistaken belief that a large price
    drop alone has made it a bargain again; a PEG ratio in particular tends to make broken leaders look
    statistically attractive at exactly the wrong moment.
  status: verified
  cite:
  - code: TLSMW
    page: 122
    extract_id: trade_like_champion_2013#126
  - code: TLSMW
    page: 122
    extract_id: trade_like_champion_2013#127
  - code: TLSMW
    page: 125
    extract_id: trade_like_champion_2013#133
  - code: TLSMW
    page: 129
    extract_id: trade_like_champion_2013#140
  - code: TLSMW
    page: 72
    extract_id: trade_like_champion_2013#073
  - code: TLSMW
    page: 75
    extract_id: trade_like_champion_2013#076
- id: C14
  text: General-market timing is read from LEADERSHIP behaviour, not from the index level. The large majority
    of superperformance advances begin as the general market exits a correction or bear market, and few
    new leaders emerge during an active bear phase — which means the preparation (building watch lists,
    running the Trend Template screen) must happen WHILE the market is still down, not after it has already
    turned. In the first months of a new bull market the pullback that most investors wait for to add
    exposure typically does not arrive — the 'lockout rally' — so waiting for a comfortable entry after
    confirmation is itself a way of missing the move. As an advance matures, watch for the WARNING that
    true leaders start to buckle while the index itself keeps climbing or begins to churn sideways on
    the strength of laggards — the index can mask a top that has already happened underneath it. Symmetrically,
    during a decline, clusters of stocks showing early relative strength and resilience — holding up best,
    rebounding fastest, gaining most off the bottom — mark the next leadership group before the general
    market confirms anything.
  status: verified
  cite:
  - code: TLSMW
    page: 49
    extract_id: trade_like_champion_2013#050
  - code: TLSMW
    page: 204
    extract_id: trade_like_champion_2013#249
  - code: TLSMW
    page: 205
    extract_id: trade_like_champion_2013#250
  - code: TLSMW
    page: 232
    extract_id: trade_like_champion_2013#274
  - code: TLSMW
    page: 209
    extract_id: trade_like_champion_2013#258
  - code: TLSMW
