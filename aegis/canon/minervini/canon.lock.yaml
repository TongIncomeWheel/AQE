- id: C15
  text: 'Concentration, not diversification, is the stated edge of an individual trader — liquidity and
    speed permit holding a small number of names with tight stop-loss protection and little slippage,
    an advantage large institutional capital cannot exercise. Superperformance is itself concentrated:
    overwhelmingly in small- and mid-cap companies still in their high-growth phase, with large caps the
    rare exception, and — because sector dispersion in a genuine bull market is wide — portfolio concentration
    belongs in the top four or five leading sectors of the cycle, not spread across the index''s full
    sector list. A rise concentrated specifically in raw materials or defensive groups while true leaders
    lag can be read either as an early bullish rotation signal or as the late-stage warning of C14, and
    which reading applies depends on whether it is confirmed by leadership behaviour or contradicts it.'
  status: verified
  cite:
  - code: TLSMW
    page: 33
    extract_id: trade_like_champion_2013#020
  - code: TLSMW
    page: 50
    extract_id: trade_like_champion_2013#052
  - code: TLSMW
    page: 141
    extract_id: trade_like_champion_2013#156
  - code: TLSMW
    page: 196
    extract_id: trade_like_champion_2013#238
- id: C16
  text: 'A SHAKEOUT is valid at exactly three locations in a base structure — the base''s own lows, the
    right side of the base, and the handle or final pivot area — and a legitimate shakeout at any of these
    three is a feature of a healthy setup, not a reason to abandon it. This is the structural reason C5''s
    entry discipline holds: a correctly-timed pivot entry comes only after weak holders have already been
    shaken out by the base''s own contraction pattern, so the entry itself should not be the trader being
    shaken out in turn.'
  status: verified
  cite:
  - code: TLSMW
    page: 269
    extract_id: trade_like_champion_2013#327
  - code: TLSMW
    page: 256
    extract_id: trade_like_champion_2013#311
- id: C17
  text: 'Later bases in the same trend carry progressively higher failure risk and mark a maturing, more
    obvious move: by the time a fourth or fifth base has formed in an uptrend — if the trend survives
    that long — it is becoming extremely obvious to the whole market and is definitionally in its late
    stages, with more frequent abrupt base failures. Rotation of market leadership OUT of true leaders
    and INTO laggards or defensive groups is itself a warning sign that a general-market advance may be
    entering its later stage (see C14). A base count is therefore read cumulatively across the whole move,
    not reset to zero at every new setup.'
  status: verified
  cite:
  - code: TLSMW
    page: 103
    extract_id: trade_like_champion_2013#110
  - code: TLSMW
    page: 202
    extract_id: trade_like_champion_2013#248
- id: C18
  text: Two named variant patterns extend the base/pivot vocabulary beyond the standard VCP. THE CUP COMPLETION
    CHEAT (3C) is a continuation pattern and the EARLIEST legitimate point to buy inside a forming cup
    — valid only if volume contracts and the price range tightens during the pause, the stock has already
    advanced at least 25 to 100 percent (occasionally 200 to 300 percent) in the prior 3 to 36 months,
    and it is trading above a rising 200-day average; the pattern runs 3 to 45 weeks and a correction
    deeper than 60 percent from peak to low disqualifies it as prone to failure. THE POWER PLAY (high
    tight flag) is a velocity pattern requiring a sharp, near-vertical upward price thrust before the
    flag forms — a structurally different and more aggressive setup than the standard VCP, reserved for
    the strongest possible momentum readings.
  status: verified
  cite:
  - code: TLSMW
    page: 307
    extract_id: trade_like_champion_2013#362
  - code: TLSMW
    page: 309
    extract_id: trade_like_champion_2013#364
  - code: TLSMW
    page: 309
    extract_id: trade_like_champion_2013#365
  - code: TLSMW
    page: 310
    extract_id: trade_like_champion_2013#366
  - code: TLSMW
    page: 310
    extract_id: trade_like_champion_2013#368
  - code: TLSMW
    page: 319
    extract_id: trade_like_champion_2013#377
- id: C19
  text: 'Valuation characteristics gave no downside protection in the 2008 decline: the cheapest Value
    Line categories by price-to-sales, price-to-book and low-P/E all fell FURTHER than the market, not
    less. This is the empirical case behind the method''s refusal to screen on cheapness (C12) — the assumption
    that ''cheap'' means ''safe'' is treated as specifically falsified by that episode, not merely unfashionable.'
  status: verified
  cite:
  - code: TLSMW
    page: 69
    extract_id: trade_like_champion_2013#067
- id: C20
  text: Every candidate is sorted into one of six maturation categories before anything else is assessed
    (see C13 for the preferred category, Market Leader). The classification comes first because it sets
    which subsequent tests even apply — a company's earnings-growth requirement, its expected base behaviour
    and its risk of the broken-leader trap all depend on where it already sits in its own maturation cycle,
    not on a single universal checklist applied identically to every name.
  status: verified
  cite:
  - code: TLSMW
    page: 122
    extract_id: trade_like_champion_2013#126
recognisers:
- id: R1
  if: a name is nominated or reviewed for the deliberation set
  then: 'I run the Trend Template first, as a hard gate, before anything else — all eight criteria or
    the name does not advance to fundamentals or entry timing at all (C3). I read it off the served MA
    stack and distance fields: ma_20/ma_50/ma_100/ma_200 for the stacking criteria, sma_distance_pct for
    proximity to highs/lows, rs_leadership and rs_spy_20d as the closest served proxy for IBD relative
    strength rank. I flag explicitly which of the eight criteria are directly computable and which are
    approximated'
  fields:
  - ma_20
  - ma_50
  - ma_100
  - ma_200
  - sma_distance_pct
  - rs_leadership
  - rs_spy_20d
- id: R2
  if: a name passes the Trend Template but structure/structure_shift shows no base or an ambiguous one
  then: I decline to call a VCP or a pivot. C4 and C5 require a countable, contracting base with a specific
    volume signature (C6) that Aegis's composite structure score does not itself expose as contraction
    count or contraction depth. I nominate on the Trend Template and momentum evidence alone and declare
    vcp_detail NOT_SERVED rather than inventing a contraction count from a single composite number (C4,
    C5, C6)
  fields:
  - structure
  - structure_shift
- id: R3
  if: day_vol or the flow/energy composite is available at the candidate's current bar
  then: I read it as the closest served proxy for C6's volume signature — contraction into a base, expansion
    on breakout — but I never claim I have seen the actual VCP contraction sequence, because day_vol is
    a single relative-volume scalar, not a volume-per-contraction series (C6)
  fields:
  - day_vol
  - flow
  - energy
- id: R4
  if: I am asked for an earnings growth rate, an EPS acceleration read, or a company-maturation category
  then: I declare earnings_growth NOT_SERVED and company_category NOT_SERVED. C12's 20-45 percent growth
    profile and C13/C20's six-category sort both require fundamental and earnings-history data the universe
    file does not carry. I may still nominate on trend and structure alone, but I say plainly that the
    fundamentals leg of SEPA (C1 element 2) was not run
  fields:
  - ticker
- id: R5
  if: a candidate's price is far above the pivot implied by its own base, or no clean pivot is identifiable
  then: 'I apply C5''s chase discipline: entry belongs close to the pivot, and a large distance above
    any plausible base top is a reason to pass or to wait for a fresh, tighter setup rather than to chase.
    sma_distance_pct and the entry field are read together for this (C5, C16)'
  fields:
  - sma_distance_pct
  - entry
  - structure_shift
- id: R6
  if: the deliberation set or the held book shows a former high-conviction name that has broken its trend
    and is being re-considered on a lower price alone
  then: I file the BROKEN-LEADER SYNDROME caution (C13). A large price decline off a prior high is not
    by itself a reason to re-enter; I ask what has changed structurally (renewed Trend Template pass,
    a fresh base) rather than treating the discount as the thesis
  fields:
