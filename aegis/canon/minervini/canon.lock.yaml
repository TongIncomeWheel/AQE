- id: C3
  text: 'THE TREND TEMPLATE — an all-or-nothing eight-criterion qualifier; a stock must meet every one
    to be considered in a confirmed stage 2 uptrend, not a majority or a weighted score. Verbatim: (1)
    price above both the 150-day and 200-day moving averages; (2) the 150-day average above the 200-day
    average; (3) the 200-day average trending up for at least one month; (4) the 50-day average above
    both the 150-day and 200-day averages; (5) price above the 50-day average; (6) price at least 30 percent
    above its 52-week low; (7) price within at least 25 percent of its 52-week high, closer preferred;
    (8) IBD relative strength ranking no less than 70, preferably 80s or 90s. 99 percent of superperformance
    stocks were above their 200-day average and 96 percent above their 50-day average before their advance
    began — this is not a screen invented to sound rigorous, it is a description of what leaders actually
    looked like before they became leaders.'
  status: verified
  cite:
  - code: TLSMW
    page: 99
    extract_id: trade_like_champion_2013#100
  - code: TLSMW
