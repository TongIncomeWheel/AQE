    line: 203
- id: C28
  text: >-
    The kNN pool is honest about its reach: the latest CHoCH is scored only
    against PAST, RESOLVED, SAME-DIRECTION events on the SAME ticker within
    window_len bars -- the ticker's own history, never a cross-sectional
    model. An empty pool degrades ONLY the kNN fields (knn_prob null,
    knn_significant false, knn_neighbors_used 0, TPs null) while choch_state /
    choch_date still report the real, detected CHoCH; the FULL null result is
    reserved for no CHoCH ever detected or degenerate input. Never raises.
