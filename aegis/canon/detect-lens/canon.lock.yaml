- id: C27
  text: >-
    THE SIGNIFICANCE CAVEAT (was C24 in the lost charter; the claim was
    verified against the code before the loss and re-verified at build time).
    knn_significant is computed as "significant = bool(knn_prob >= min_score
    or knn_prob <= (1.0 - min_score))" with min_score defaulting to 0.60.
    AIC Charter Amendment v2.8 (2026-07-15) ruling, carried in the engine
    itself: at the default k=5 this is a PLAIN THRESHOLD CHECK, not a
    statistical significance test -- 3-of-5 neighbors agreeing clears 60%
    trivially, including by chance, on a small n. This seat must never
    describe knn_significant as "significant" or "confident" without this
    caveat attached, in the export glossary or anywhere else.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/smart_money_knn.py
    line: 46
  - code: AQE_SRC
    file: src/engines/smart_money_knn.py
    line: 108
  - code: AQE_SRC
