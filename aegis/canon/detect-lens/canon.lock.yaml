    line: 124
- id: C21
  text: >-
    The divergence detector NEVER REPAINTS: a pivot exists only once
    pivot_right bars have printed after it (strict-extreme fractal test, the
    pivot must be the UNIQUE extreme of its window), so a divergence flagged
    on a given run stays true on every later run containing those bars.
    FRESHNESS gate: a fired divergence counts only while its anchor pivot is
    within fresh_bars + pivot_right of the last bar -- once it ages out it
    disappears from the signal instead of firing in the export forever.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/divergence.py
    line: 8
