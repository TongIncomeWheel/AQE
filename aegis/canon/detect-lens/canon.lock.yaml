  text: >-
    TP projection is a neighbors' distribution read, not a forecast: TP1/2/3
    project the k nearest neighbors' favorable_run distribution -- mean x 0.5,
    median, 75th percentile -- from TODAY's close, signed by the CHoCH
    direction. favorable_run is the non-negative MFE of each resolved
