- id: C20
  text: >-
    Divergence detection is REGULAR divergence only -- the classic
    reversal-warning kind, not hidden/continuation -- between price and five
    oscillators in fixed order: RSI(14), MFI(14), CMF(20), MACD line (12/26),
    OBV. Bullish: price lower low while an oscillator makes a higher low
    across the two most recent confirmed pivot lows, span within
    [min_span, max_span]; bearish is the exact mirror on confirmed pivot
    highs.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/divergence.py
    line: 1
  - code: AQE_SRC
