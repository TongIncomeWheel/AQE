- id: C22
  text: >-
    div_state taxonomy is mechanical and complete: BULLISH when only bullish
    oscillators fire, BEARISH when only bearish, MIXED when both, NONE when
    neither; div_oscs names the firing oscillators (bearish prefixed "-");
    div_date anchors to the majority side's pivot. The detector is pure and
    deterministic and NEVER raises -- malformed input or fewer than 40 bars
    degrades to the empty/NONE result.
  status: verified
  cite:
