- id: C23
  text: >-
    Pin-bar detection is pure candlestick geometry on the LAST bar -- which,
    on an EOD panel, is already fully closed, so no lookahead and no repaint
    risk. Bullish pin: lower wick >= 0.66 x range AND body <= 0.4 x range AND
    upper wick <= 0.4 x range; bearish is the mirror. The optional
    small-candle filter (on by default) requires the bar's range to be >= 2.0x
    the preceding candle's range, filtering "pin bars" that are just noise
    inside an already-tiny range.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/pin_bar.py
    line: 4
  - code: AQE_SRC
