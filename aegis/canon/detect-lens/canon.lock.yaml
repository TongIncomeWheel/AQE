principles:
- id: C1
  text: >-
    The lens consensus is the ONE thing AQE adds for the AIC read, and it is
    SORT-ONLY. AQE presents, AIC decides -- the engine sorts, it never cuts and
    never eliminates. Every scored name appears in the ranking with its full
    data block intact; rank is a reading order, not a verdict, and nothing is
    filtered, capped, or eliminated on the way to the committee.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/lens_consensus.py
    line: 8
  - code: AQE_SRC
    file: src/engines/lens_consensus.py
    line: 128
  - code: AQE_SRC
    file: src/engines/lens_consensus.py
    line: 135
- id: C2
