- id: C25
  text: >-
    CHoCH detection is a bar-by-bar state machine over CONFIRMED swing pivots
    -- a pivot becomes known only at bar p + swing_len, when its right-side
    window finishes printing, so it never repaints. A BULLISH CHoCH fires when
    trend <= 0 and close breaks above the last known swing high (trend -> 1);
    BEARISH mirrors on the last known swing low. Every flip is recorded as an
    event; pivot ties are non-strict, matching Pine's ta.pivothigh/pivotlow.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/smart_money_knn.py
    line: 21
  - code: AQE_SRC
