    mover_subtype, premove_setup, premove_conviction) are appended to the
    export for AIC context and logged to the paper-track -- they never gate,
    filter, or size, and no tag informs sizing until its paper-track shows
    PASS. The ledger discipline is built into the engine's own contract.
  status: verified
  cite:
