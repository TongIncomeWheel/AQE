- id: C12
  text: >-
    Signal Radar is a %-based RADAR with exactly two jobs -- (1) what is ABOUT
    to run (pre-move), (2) what will KEEP running (continuation) -- and it is
    NOT a risk, bracket, or sizing engine. Every % figure it emits is a
    DETECTION RATE (how often tagged names went on to touch +X%, price path
    only), never a win rate and never risk-adjusted alpha; the export carries
    this note verbatim on every radar block.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/signal_radar.py
    line: 3
  - code: AQE_SRC
