    line: 72
- id: C24
  text: >-
    Inside bar and the P.I.B. combo are fixed two-bar mechanics: inside_bar is
    true when the last bar's range is fully engulfed by the prior bar's
    (high < prev_high AND low > prev_low); pib_pattern is true when the
    SECOND-TO-LAST bar was a pin bar immediately followed by the last bar as
    an inside bar -- rejection, then pause. pin_bar_level records the
    rejection extreme (the low for a bullish pin = support, the high for a
    bearish pin = resistance). Never raises; degrades to the null result.
  status: verified
  cite:
  - code: AQE_SRC
