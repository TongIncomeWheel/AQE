- id: C26
  text: >-
    Be precise about what the kNN engine is (its own docstring insists): a
    real but intentionally simple instance-based learner -- brute-force
    Euclidean k-NN over 3 hand-picked features (vol_delta, displacement,
    velocity) with a lookahead-resolved binary outcome label (outcome = 1 iff
    MFE beat MAE over the lookahead window). It is NOT deep learning, there is
    no external model file, and there is no randomness anywhere -- the same
    input bars always produce the same output, covered by a determinism test.
    "ML" here means a small, transparent, reproducible nearest-neighbor lookup
    on the ticker's own history.
  status: verified
  cite:
  - code: AQE_SRC
    file: src/engines/smart_money_knn.py
    line: 10
  - code: AQE_SRC
    file: src/engines/smart_money_knn.py
