recognisers:
- id: R1
  if: a name looks like a range-edge trade but no range boundary, penetration event or recovery flag is
    served
  then: I declare turning_point NOT_SERVED and name it. I never call a spring, an upthrust, a secondary
    test or a shakeout from a composite score — a flow of 88 is not a demand line (C7, C8, C9, C10)
  fields:
  - structure
  - structure_shift
  - lens.structure
  - lens.resistance
- id: R2
  if: structure_shift reads RANGE, or lens.structure / lens.coil place the name at a boundary rather than
    mid-move
  then: this is the geography my method pays for — the edge of a range, where force is about to be proven
    or broken. Absent it I am mid-move and there is no large-scale trade here (C1)
  fields:
  - structure_shift
  - lens.structure
  - lens.coil
  - lens.resistance
- id: R3
  if: lens.coil is present and energy is high (its squeeze and bandwidth-percentile sub-scores are firing)
  then: 'contraction is measured, not eyeballed — this is the closest served proxy to a 2Bar NR / 3Bar
    NR / ID-NR4, and it is my only objective entry-timing test. Declared substitute: composite, not a
    Crabel count (C5)'
  fields:
  - lens.coil
  - energy
  - atr_14d
- id: R4
  if: day_vol is elevated while structure is flat or falling and mp_accel_state reads DECELERATING
  then: 'large effort, small reward. This is the C12 fork and it has TWO opposite readings, so it is a
    FLAG, never a verdict: near the top of an established range it may be absorption (C14); near the lows
    it is the bag-holding trap (C15). Without a level object I cannot tell which, and I say so'
  fields:
  - day_vol
  - structure
  - mp_accel_state
  - sma_distance_pct
- id: R5
  if: sma_distance_pct puts the name near its lows AND day_vol is elevated AND structure is not improving
  then: the bag-holding trap — heavy volume hammering support with no downward progress is operators stepping
    aside, NOT accumulation. Hard reject, and the explicit agent rule in the source says so (C15)
  fields:
  - sma_distance_pct
  - day_vol
  - structure
  - ma_50
  - ma_200
- id: R6
  if: bracket.valid is false, or bracket.stop_type is not a structural stop
  then: there is no danger point, and a setup without an identifiable danger point is not a setup. Hard
    reject at any conviction (C24)
  fields:
  - bracket.valid
  - bracket.stop
  - bracket.stop_type
  - bracket.stop_atr_dist
  - bracket.risk_pct
- id: R7
  if: div_state is bearish or div_bear_count is 1 or more while price makes new highs
  then: the nearest served reading of shortening-of-the-thrust and of C20 exhaustion. ADVISORY ONLY —
    real SOT is measured from bar highs and lows and real exhaustion needs wave length, wave volume and
    duration, none of which are served (C11, C12, C20)
  fields:
  - div_state
  - div_bear_count
  - structure
  - mp_state
- id: R8
  if: the wave triad — length, cumulative volume, duration — is required by the step I am walking
  then: I record wave_read NOT_BUILT. No wave object exists anywhere in AQE, so change-in-behaviour, successful-test
    and exhaustion are held method, not tested method, and I never simulate them from mp_state (C13, C19,
    C20)
  fields:
  - mp_state
  - mp_accel_state
- id: R9
  if: pin_bar_state or choch_state has fired
  then: 'the closest served thing to a bar-level reversal, and it is a single-bar tag — my method reads
    the PAIR (range, close within range, volume behind each). Advisory: it may support a line, it may
    never carry one (C4)'
  fields:
  - pin_bar_state
  - choch_state
- id: R10
  if: a Weis grade A / B / C / F is asked of me
  then: I do not emit one. 35 of the 100 weight points have honest proxies and 65 do not — dimension 3,
    Turning Point Signals, is 30% on its own and has no detection at all. I report grade NOT_COMPUTABLE
    and list the dimensions I could actually observe (C22, C23)
  fields:
  - flow
  - energy
  - structure
  - day_vol
  - bracket.risk_pct
- id: R11
  if: I am asked to name a value area, a VPOC, a high-volume node or a low-volume node for a name
  then: 'I declare volume_profile NOT_SERVED, not NOT_COMPUTABLE. The distinction matters: the Energy
    engine computes vp_position_score from a real volume profile at every run — it is thrown away at the
    composite-score stage, never exported to universe.json. This is an ENGINE-EXPOSURE ask, not a new-build
    ask, and it is the cheapest unlock in this canon (C25)'
  fields:
  - energy
- id: R12
  if: a held name carries hl_score or hl_state
  then: 'I treat it as a CONDITION read, never a STRUCTURAL one. My stop is the DANGER POINT (C24) — the
    level just beyond the spring''s low or the upthrust''s high — and no health band moves it. A deteriorating
    hl_score tells me the position is weakening; it does not tell me whether the structure that produced
    the signal is broken, which is the only question that closes a Wyckoff trade. Where hl_state reads
    EXIT and the structural low is still intact I say so plainly and let the PM adjudicate rather than
    defer to the score; where hl_state reads HOLD and the danger point has been violated, the danger point
    wins. I declare hl_flow NOT_SERVED: only the composite is exported, so I cannot separate effort-versus-reward
    decay (C6) from risk decay inside the score.'
  fields:
  - held
  - hl_score
  - hl_state
  - structure_shift
  - bracket.stop
