principles:
- id: C1
  text: 'Speculation is not a pure gamble and must be run as a business: it punishes stupidity, laziness,
    poor emotional control and impatience for quick riches, and success is directly proportional to the
    trader''s own honest effort in keeping his own records, doing his own thinking, and reaching his own
    conclusions rather than delegating any of the three.'
  status: verified
  cite:
  - code: HTTIS
    page: 3
    extract_id: how_to_trade_in_stocks_1940#001
  - code: HTTIS
    page: 4
    extract_id: how_to_trade_in_stocks_1940#002
  - code: HTTIS
    page: 5
    extract_id: how_to_trade_in_stocks_1940#003
- id: C2
  text: The market's own price action is always right; personal opinions, news, and outside tips are frequently
    wrong and never a valid substitute for it. Do not act on an opinion about a stock or the likely effect
    of news until price action itself confirms it — wait and observe after forming a view, rather than
    rushing to enter on the view alone.
  status: verified
  cite:
  - code: HTTIS
    page: 7
    extract_id: how_to_trade_in_stocks_1940#007
  - code: HTTIS
    page: 8
    extract_id: how_to_trade_in_stocks_1940#008
  - code: HTTIS
    page: 9
    extract_id: how_to_trade_in_stocks_1940#009
  - code: HTTIS
    page: 89
    extract_id: how_to_trade_in_stocks_1940#116
  - code: HTTIS
    page: 89
    extract_id: how_to_trade_in_stocks_1940#117
- id: C3
  text: Take the first small loss as a form of self-insurance rather than waiting or hoping — a position
    moving against you and continuing to deteriorate must be sold before the loss grows larger. Winning
    trades resolve favourably on their own if left to run; losing trades do not self-correct and require
    active management, which is why losses demand attention that winners do not.
  status: verified
  cite:
  - code: HTTIS
    page: 13
    extract_id: how_to_trade_in_stocks_1940#018
  - code: HTTIS
    page: 13
    extract_id: how_to_trade_in_stocks_1940#019
  - code: HTTIS
    page: 13
    extract_id: how_to_trade_in_stocks_1940#020
  - code: HTTIS
    page: 14
    extract_id: how_to_trade_in_stocks_1940#021
- id: C4
  text: 'Never average down — never add to a losing position at progressively lower prices. This is named
    repeatedly and without exception: a first losing trade in a stock is not to be followed by a second
    trade in the same direction, regardless of how attractive the lower price looks. A margin call is
    the one unambiguous signal from a broker that you are on the wrong side of the market; treat it as
    an immediate exit signal, never as something to meet and hold through.'
  status: verified
  cite:
  - code: HTTIS
    page: 20
    extract_id: how_to_trade_in_stocks_1940#035
  - code: HTTIS
    page: 35
    extract_id: how_to_trade_in_stocks_1940#062
  - code: HTTIS
    page: 38
    extract_id: how_to_trade_in_stocks_1940#064
  - code: HTTIS
    page: 38
    extract_id: how_to_trade_in_stocks_1940#065
  - code: HTTIS
    page: 38
    extract_id: how_to_trade_in_stocks_1940#066
- id: C5
  text: Enter long only after (a) an established uptrend, (b) a normal reaction/pullback within it, and
    (c) a subsequent new high confirming the pullback is over — never buy on a pullback itself, and never
    short into a rally. A stock reaching a new high demonstrates underlying strength that justifies the
    position; do not regret missing an earlier, lower entry, since chasing the 'best' price by waiting
    often means missing the move entirely.
  status: verified
  cite:
  - code: HTTIS
    page: 9
    extract_id: how_to_trade_in_stocks_1940#010
  - code: HTTIS
    page: 10
    extract_id: how_to_trade_in_stocks_1940#011
  - code: HTTIS
    page: 10
    extract_id: how_to_trade_in_stocks_1940#012
  - code: HTTIS
    page: 20
    extract_id: how_to_trade_in_stocks_1940#033
  - code: HTTIS
    page: 20
    extract_id: how_to_trade_in_stocks_1940#034
- id: C6
  text: 'Pyramid only in the direction of the trade: when building a long position, buy in increments
    with each successive purchase made only at a higher price than the last; when building a short, add
    only at successively lower prices. This mirrors the ban on averaging down (C4) from the winning side
    — size is added to strength, never to weakness, in either direction.'
  status: verified
  cite:
  - code: HTTIS
    page: 59
    extract_id: how_to_trade_in_stocks_1940#089
  - code: HTTIS
    page: 59
    extract_id: how_to_trade_in_stocks_1940#090
  - code: HTTIS
    page: 35
    extract_id: how_to_trade_in_stocks_1940#060
- id: C7
  text: 'A DANGER SIGNAL is defined precisely: a single-day price reaction of six or more points from
    that day''s high (for an active stock trading above roughly $30 — see C18 on the scaling problem).
    On a danger signal, exit immediately without arguing — ''like stepping off a track to avoid an oncoming
    train, you can always get back on later'' — this is the trigger that converts paper profits into realised
    gains and the discipline that ends a position before an abnormal move becomes a large loss.'
  status: verified
  cite:
  - code: HTTIS
    page: 24
    extract_id: how_to_trade_in_stocks_1940#040
  - code: HTTIS
    page: 25
    extract_id: how_to_trade_in_stocks_1940#041
  - code: HTTIS
    page: 25
    extract_id: how_to_trade_in_stocks_1940#042
  - code: HTTIS
    page: 27
    extract_id: how_to_trade_in_stocks_1940#045
- id: C8
  text: A normal reaction (defined in C18) should never be feared and never triggers an exit on its own
    — it is an expected, lower-volume pullback within a genuine trend. An abnormal move, by contrast,
    is a warning that must be respected. The discipline is to hold through the normal and act immediately
    on the abnormal; confusing the two — panicking on a normal pullback, or tolerating an abnormal one
    — is named as a chief source of trader failure.
  status: verified
  cite:
  - code: HTTIS
    page: 21
    extract_id: how_to_trade_in_stocks_1940#036
  - code: HTTIS
    page: 21
    extract_id: how_to_trade_in_stocks_1940#037
  - code: HTTIS
    page: 22
    extract_id: how_to_trade_in_stocks_1940#038
  - code: HTTIS
    page: 23
    extract_id: how_to_trade_in_stocks_1940#039
- id: C9
  text: Never enter a position unless you can absorb the loss without financial harm, and decide in advance
    — at or immediately after entry — exactly how much you are willing to lose if you are wrong. Cap the
    capital risked on any single trade the way a merchant spreads credit risk across many customers rather
    than concentrating it in one; trying to get rich too quickly by taking excessive risk is named as
    a fundamental, recurring mistake.
  status: verified
  cite:
  - code: HTTIS
    page: 39
    extract_id: how_to_trade_in_stocks_1940#067
  - code: HTTIS
    page: 39
    extract_id: how_to_trade_in_stocks_1940#068
  - code: HTTIS
    page: 43
    extract_id: how_to_trade_in_stocks_1940#075
  - code: HTTIS
    page: 60
    extract_id: how_to_trade_in_stocks_1940#091
- id: C10
  text: 'Bank half of every successful trade''s realised profit into safekeeping rather than leaving all
    of it at risk in the account — the concrete trigger given is doubling the original capital, at which
    point half the gain is withdrawn immediately. Physically withdrawing and holding cash after a successful
    deal has psychological value beyond the arithmetic: it makes a trader less reckless with subsequent
    gains, countering the common tendency to withdraw funds only when there is no open position rather
    than proactively after a win.'
  status: verified
  cite:
  - code: HTTIS
    page: 40
    extract_id: how_to_trade_in_stocks_1940#071
  - code: HTTIS
    page: 41
    extract_id: how_to_trade_in_stocks_1940#072
  - code: HTTIS
    page: 42
    extract_id: how_to_trade_in_stocks_1940#073
  - code: HTTIS
    page: 42
    extract_id: how_to_trade_in_stocks_1940#074
- id: C11
  text: Beware of all inside information without exception — this is named as the single maxim Livermore
    recommends writing on the first page of a trader's notebook. An insider will readily say when to buy
    but will never say when to sell, since disclosing an exit would betray the interests of his associates;
    very few traders profit from acting on tips or recommendations from other people, and rules derived
    from personal price-record analysis are the stated alternative.
  status: verified
  cite:
  - code: HTTIS
    page: 55
    extract_id: how_to_trade_in_stocks_1940#087
  - code: HTTIS
    page: 68
    extract_id: how_to_trade_in_stocks_1940#099
  - code: HTTIS
    page: 68
    extract_id: how_to_trade_in_stocks_1940#100
- id: C12
  text: Focus analysis and trading on the market's leading, most active stocks in leading groups — if
    you cannot profit from leaders you will not profit from the broader market. Concentrate positions
    in a limited number of names rather than spreading across many; correctly analysing just two stocks
    within each leading group is stated as sufficient insight into that group's — and by extension the
    market's — direction, rather than tracking everything.
  status: verified
  cite:
  - code: HTTIS
    page: 31
    extract_id: how_to_trade_in_stocks_1940#053
  - code: HTTIS
    page: 33
    extract_id: how_to_trade_in_stocks_1940#056
  - code: HTTIS
    page: 34
    extract_id: how_to_trade_in_stocks_1940#058
- id: C13
  text: 'Market leadership rotates: the dominant stocks and groups of one era give way to new leaders
    in a later one, so leadership must be periodically reassessed rather than assumed permanent. Do not
    generalise a whole-market bullish or bearish stance from the behaviour of a single stock in a single
    group — require independent confirming action (''a tip-off'') from each group before committing capital
    to it.'
  status: verified
  cite:
  - code: HTTIS
    page: 32
    extract_id: how_to_trade_in_stocks_1940#054
  - code: HTTIS
    page: 32
    extract_id: how_to_trade_in_stocks_1940#055
  - code: HTTIS
    page: 33
    extract_id: how_to_trade_in_stocks_1940#057
  - code: HTTIS
    page: 34
    extract_id: how_to_trade_in_stocks_1940#059
- id: C14
  text: A genuine trend change for a group is confirmed only by the combined 'Key Price' action of two
    related stocks moving together, never by one stock's move alone — this guards specifically against
    being caught by a false, single-name move. A stock or group failing to make new highs alongside its
    peers is itself sufficient grounds to revise an opinion, without waiting for a news explanation of
    why it is lagging.
  status: verified
  cite:
  - code: HTTIS
    page: 85
    extract_id: how_to_trade_in_stocks_1940#113
  - code: HTTIS
    page: 88
    extract_id: how_to_trade_in_stocks_1940#115
  - code: HTTIS
    page: 89
    extract_id: how_to_trade_in_stocks_1940#117
  - code: HTTIS
    page: 89
    extract_id: how_to_trade_in_stocks_1940#118
- id: C15
  text: 'A disproportionate share of a market move happens in its final forty-eight hours, which is why
    a position must not be exited prematurely on minor reactions — the largest single chunk of the total
    move tends to occur right before it ends. Patience while holding a profitable position must not become
    complacency: continue actively watching for the danger signal (C7) rather than assuming a trending
    move will simply continue indefinitely.'
  status: verified
  cite:
  - code: HTTIS
    page: 46
    extract_id: how_to_trade_in_stocks_1940#078
  - code: HTTIS
    page: 23
    extract_id: how_to_trade_in_stocks_1940#039
  - code: HTTIS
    page: 12
    extract_id: how_to_trade_in_stocks_1940#017
- id: C16
  text: A stock that has based between a defined high and low for an extended period (a year or more)
    and then breaks below that established low is likely headed for a sharp further decline — treat the
    break as a bearish signal, not a bargain. Symmetrically, on favourable news, buying the instant a
    stock makes a brand-new multi-year or all-time high is generally sound, rather than waiting for a
    pullback that the news itself may prevent from arriving.
  status: verified
  cite:
  - code: HTTIS
    page: 53
    extract_id: how_to_trade_in_stocks_1940#084
  - code: HTTIS
    page: 53
    extract_id: how_to_trade_in_stocks_1940#085
  - code: HTTIS
    page: 20
    extract_id: how_to_trade_in_stocks_1940#032
- id: C17
  text: THE PIVOTAL POINT is the last trend-column price at the exact moment recording shifts from a trend
    column into a Natural Rally or Natural Reaction column — it marks the level a stock must clear, by
    a defined margin (C19), to confirm the trend is resuming rather than merely returning to test that
    level. Round-number levels (50, 100, 200, 300) frequently act as Pivotal Points, after which a stock
    tends to make a fast, sustained move once decisively cleared; a lack of the expected fast follow-through
    after crossing one is itself a danger signal.
  status: verified
  cite:
  - code: HTTIS
    page: 45
    extract_id: how_to_trade_in_stocks_1940#077
  - code: HTTIS
    page: 47
    extract_id: how_to_trade_in_stocks_1940#079
  - code: HTTIS
    page: 97
    extract_id: how_to_trade_in_stocks_1940#127
  - code: HTTIS
    page: 50
    extract_id: how_to_trade_in_stocks_1940#082
  - code: HTTIS
    page: 51
    extract_id: how_to_trade_in_stocks_1940#083
- id: C18
  text: THE RECORDING SYSTEM ('the Market Key') uses six columns per stock — Secondary Rally, Natural
    Rally, Upward Trend, Downward Trend, Natural Reaction, Secondary Reaction — with Upward Trend entries
    in black ink, Downward Trend entries in red ink, and the four secondary columns in pencil until a
    trend is confirmed. A Natural Rally or Reaction is triggered by roughly a six-point move from the
    last trend-column extreme, calibrated to active stocks priced above about $30; the threshold must
    be scaled down for lower-priced issues, and the composite 'Key Price' record (two stocks combined,
    C14) uses double that threshold, twelve points, not six. This is a fixed, dollar-denominated 1940
    calibration and does not translate literally to a modern universe — see diff.json for the translation
    gap.
  status: verified
  cite:
  - code: HTTIS
    page: 83
    extract_id: how_to_trade_in_stocks_1940#109
  - code: HTTIS
    page: 83
    extract_id: how_to_trade_in_stocks_1940#110
  - code: HTTIS
    page: 84
    extract_id: how_to_trade_in_stocks_1940#111
  - code: HTTIS
    page: 89
    extract_id: how_to_trade_in_stocks_1940#120
  - code: HTTIS
    page: 97
    extract_id: how_to_trade_in_stocks_1940#126
- id: C19
  text: A Natural Rally or Reaction of the defined magnitude (C18) does not by itself signal the underlying
    trend has changed — it is only reclassified as a genuine trend resumption once price moves a FURTHER
    three points beyond the prior Natural Rally/Reaction high (six points for the composite Key Price,
    C18), at which point recording switches back into the trend column. Confirming trend resumption specifically
    requires clearing the previous Pivotal Point (C17) by this same three-point (or six-point Key Price)
    margin — a mere return to the Pivotal Point is not enough.
  status: verified
  cite:
  - code: HTTIS
    page: 93
    extract_id: how_to_trade_in_stocks_1940#124
  - code: HTTIS
    page: 99
    extract_id: how_to_trade_in_stocks_1940#129
  - code: HTTIS
    page: 47
    extract_id: how_to_trade_in_stocks_1940#080
- id: C20
  text: 'A DANGER SIGNAL under the recording system is also defined structurally: when a Natural Rally
    stalls short of the prior Upward Trend Pivotal Point and the stock then reacts three or more points
    from that rally''s own high, the Upward Trend is judged to have ended (the mirror rule applies to
    a Downward Trend Pivotal Point on a rally). Equally, if price fails to extend three or more points
    past the Pivotal Point and instead reacts three or more points below it, that failure alone signals
    the trend has ended — the trader does not wait for a deeper break to act.'
  status: verified
  cite:
  - code: HTTIS
    page: 100
    extract_id: how_to_trade_in_stocks_1940#130
  - code: HTTIS
    page: 101
    extract_id: how_to_trade_in_stocks_1940#131
- id: C21
  text: 'The recording formula is deliberately built to catch only the beginning and end of MAJOR moves,
    never to generate signals on minor intermediate swings within an established trend — minor oscillations
    are filtered out on purpose. The market''s own price action is the only justification a trader needs
    for a decision: waiting to find a fundamental or news-based reason before acting on a clear price
    signal is named as a specific, costly mistake, illustrated by a group that lagged the market for four
    months before large institutional selling was eventually disclosed as the cause.'
  status: verified
  cite:
  - code: HTTIS
    page: 82
    extract_id: how_to_trade_in_stocks_1940#108
  - code: HTTIS
    page: 89
    extract_id: how_to_trade_in_stocks_1940#119
  - code: HTTIS
    page: 88
    extract_id: how_to_trade_in_stocks_1940#115
- id: C22
  text: Human emotional nature — chiefly the reversal of hope and fear at the wrong moments (fearing when
    one should hope, hoping when one should fear) — is named as the average speculator's greatest enemy,
    alongside the unchecked desire to always have a position in the market. On recognising a personal
    error, admit it immediately and study it rather than making excuses or becoming angry at the market;
    a trader's own losses are themselves the market's objective signal that he is wrong, and that signal,
    once received, is the moment to exit, review, and wait for the next qualifying setup.
  status: verified
  cite:
  - code: HTTIS
    page: 11
    extract_id: how_to_trade_in_stocks_1940#015
