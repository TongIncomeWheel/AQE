name: MTF room rebuild (rebuild a finished run's mtf.json with the current mtf.py; prints it, writes nothing)

# Conductor/PM 2026-11-05: render-only. Same path the nightly uses (committee_data.build_grid -> mtf.py build --grid), for the room of a given run.
on:
  workflow_dispatch:
    inputs:
      run_dir:
        description: run directory holding phase4.json
        default: aegis/output/pma/run/2026-11-05
      run_date:
        description: run date (bars are cut at this date)
        default: "2026-11-05"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m scripts.mtf_room_rebuild "${{ inputs.run_dir }}" "${{ inputs.run_date }}"
