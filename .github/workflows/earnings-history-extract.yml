name: AQE earnings history extract (one-off)

# Backtest review 2026-11-20 (via conductor): historical earnings table for the research-extract universe. READ-ONLY against production: scratch dir,
# snapshot restored into it and never saved; only new Drive files named aqe_research_earnings_* plus this run's artifact. workflow_dispatch only.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "earliest report date"
        default: "2020-11-01"
      calendar_weeks:
        description: "weekly earnings-calendar windows to try for BMO/AMC (stops at the first the plan refuses)"
        default: "60"

concurrency:
  group: aqe-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Earnings history extract
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_OUT: research_out
          SINCE: ${{ inputs.since }}
          CAL_WEEKS: ${{ inputs.calendar_weeks }}
        run: python -m scripts.earnings_history_extract --since "$SINCE" --calendar-weeks "$CAL_WEEKS"
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aqe-research-earnings-history
          path: research_out/
          retention-days: 14
          if-no-files-found: warn
