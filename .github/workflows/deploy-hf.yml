name: Deploy to HuggingFace Space

# Mirrors GitHub `main` to the HF Space (AQE-Aegis/aqe) on every push, which
# triggers HF to rebuild the Docker image — i.e. the auto version of `push_both`.
# Requires a GitHub Actions secret HF_TOKEN (a HuggingFace *write* token).
# Optional secret HF_USERNAME (defaults to the AQE-Aegis namespace).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the push isn't rejected
      - name: Push main to the HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set — skipping deploy. Add it in"
            echo "Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          USER="${HF_USERNAME:-AQE-Aegis}"
          ORIG_SHA="$(git rev-parse --short HEAD)"

          # aegis/ (a separate, unrelated agent-system tree — not imported by
          # any AQE app code) has grown binary content HF's storage backend
          # flatly rejects at push time (non-Xet/LFS blobs), which poisons
          # every deploy once it lands in the branch's history. Build a
          # single clean orphan commit of the CURRENT tree minus aegis/ and
          # push that instead — GitHub's own `main` (source of truth) is
          # untouched; only what reaches the HF mirror changes. Orphan means
          # no shared ancestry with the polluted history, so it can never
          # transmit that blob, and it's always a --force push to HF (HF's
          # git history is a rebuildable deploy mirror, not authoritative).
          git config user.email "aqe-deploy@github-actions.local"
          git config user.name "AQE Deploy Bot"
          git checkout --orphan hf-deploy-tmp
          # `checkout --orphan` preserves the CURRENT index (everything from the
          # prior HEAD, including aegis/, is already staged as "A" at this point).
          # `git add -A -- ':!aegis'` alone only adds/updates paths matching the
          # pathspec — it does NOT unstage already-staged paths outside it. Clear
          # the inherited index first so the exclusion actually takes effect.
          git rm -r --cached . > /dev/null
          git add -A -- ':!aegis'
          git commit -q -m "Deploy ${ORIG_SHA} (aegis/ excluded — HF storage rejects its binary content)"

          echo "Pushing ${ORIG_SHA} (aegis/ excluded) to HF Space..."
          ok=0
          for i in 1 2 3 4 5; do
            if git push --force "https://${USER}:${HF_TOKEN}@huggingface.co/spaces/AQE-Aegis/aqe" hf-deploy-tmp:main; then
              ok=1; break
            fi
            echo "HF push attempt $i failed (likely 429 rate-limit) — backing off..."
            sleep $((i * 20))
          done
          if [ "$ok" != "1" ]; then
            echo "HF push failed after retries."; exit 1
          fi
          echo "Pushed. HF will rebuild the Docker image (~30s for code-only changes)."
