name: "AQE research - PARTIAL survivorship pull (one-off)"

# Backtest review 2026-11-21 (conductor-approved: no spend, no plan upgrade). READ-ONLY against production: scratch dir, snapshot restored into it and never saved; only new
# Drive files named aqe_research_survivorship_PARTIAL_* plus this run's artifact. workflow_dispatch only. The candidate list is PARTIAL (see scripts/survivorship_pull.py).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "list = candidate list + counts only; pull = list + bars + month-end market cap for the delisted names"
        type: choice
        options: [list, pull]
        default: list
      shard:
        description: "i/n: run shard i of n of the sorted candidate list, e.g. 1/3"
        default: "1/1"
      since:
        description: "window start"
        default: "2021-03-01"
      budget_hours:
        description: "wall-clock budget for the pull; remaining names are named in the meta"
        default: "5"

concurrency:
  group: aqe-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the git-history universe source needs the log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Survivorship pull
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_OUT: research_out
          STAGE: ${{ inputs.stage }}
          SHARD: ${{ inputs.shard }}
          SINCE: ${{ inputs.since }}
          BUDGET_H: ${{ inputs.budget_hours }}
        run: python -m scripts.survivorship_pull "$STAGE" --shard "$SHARD" --since "$SINCE" --budget-hours "$BUDGET_H"
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aqe-research-survivorship-${{ inputs.stage }}
          path: research_out/
          retention-days: 14
          if-no-files-found: warn
