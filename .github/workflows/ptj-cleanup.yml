name: AQE PTJ folder cleanup

# Cowork writes the daily trade journal to the PTJ Drive folder but can't
# overwrite/delete its own previous files, so the folder accumulates one file
# per write. This tidies it daily: keeps the newest file, moves the rest into
# a Legacy/ subfolder — so nothing downstream can grab a stale file by mistake.
#
# Runs shortly before the daily pipeline (08:30 SGT Tue–Sat) picks up the PTJ,
# on the same Tue–Sat cadence (Cowork writes on days the PM has positions to
# log, which tracks US market days). 08:15 SGT = 00:15 UTC.
on:
  schedule:
    - cron: "15 0 * * 2-6"   # 00:15 UTC = 08:15 SGT, Tue–Sat
  workflow_dispatch: {}

concurrency:
  group: aqe-ptj-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Archive extra PTJ files
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python -m scripts.cleanup_ptj_folder
