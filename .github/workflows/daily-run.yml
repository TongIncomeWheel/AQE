name: AQE daily run

# 2026-09-06 PM decision: this is now the ONLY automatic path to the daily
# pipeline (the in-app HF scheduler no longer auto-fires it -- see
# src/ui/daily_job.py's module docstring). It is triggered EXTERNALLY: a
# Claude-scheduled Routine dispatches this workflow each weekday morning as
# part of the same sequential job as the PTJ command, via workflow_dispatch.
#
# The GitHub `schedule:` trigger this workflow used to also carry was removed
# on the same PM ruling: GitHub's own cron queue was observed firing this
# workflow 4-5+ hours late on most days (a documented platform characteristic
# -- scheduled workflows queue behind everyone else's at popular minutes like
# :30 -- not a bug in this file), and rather than reconcile that with the
# in-app scheduler and a manual UX button as three independent, sometimes-
# disagreeing triggers, the PM chose ONE external trigger (Claude + PTJ) with
# the AQE UX's own "Bootstrap + run daily pipeline" sidebar button as the
# manual fallback.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a run now (ignore Sun/Mon + already-ran-today checks)"
        type: boolean
        default: false

# Avoid overlapping runs.
concurrency:
  group: aqe-daily
  cancel-in-progress: false

# The run now publishes its own output into the repo (aegis/output/) and the
# state snapshot to a release. In Actions the built-in token can do both once
# it is granted write, so the CI path needs no PAT — only the HF Space does.
permissions:
  contents: write

jobs:
  # 2026-11-04 (PM angry about stale breadth): the whole-market panel refresh is now JOB 1 of this workflow, not a manual
  # pre-step someone can forget. It needs the close printed (16:30 ET = 05:30 SGT), so DISPATCH THIS WORKFLOW AT 05:35 SGT:
  # panel (<= 60 min) -> nightly (~28 min) -> committee data (<= 15 min) finishes ~07:15 SGT, before the 08:20 committee.
  # The nightly runs even if the panel job fails or is partial (`if: always()`): its strict guard then reads the breadth STALE,
  # loudly, with the reason code OUR_BUDGET - it is never passed off as fresh and never blocks the export.
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh the whole-market panel to the last completed session and persist it
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MA_REFRESH_BUDGET_S: "3600"
        run: python -m scripts.ma_panel_run --budget-minutes 60
  run:
    needs: panel
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # 2026-11-03: 75 (was 45). The run is ~24-28 min; Step 8a-4 (the committee's FMP inputs) adds up to its own 15-minute
    # budget and Step 6h-1 (whole-market panel refresh for the breadth) up to its own 20-minute budget: worst case ~63 min.
    # The app's own pipeline cutoff (daily_job._PIPELINE_TIMEOUT) is 75 min too.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Daily run (dedups against an already-done run today)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQE_FORCE: ${{ inputs.force }}
          # Crown Macro's gamma step (daily_orchestrator Step 6f, feeds VALEN's
          # GEX traffic light) needs an options-chain feed. This workflow is
          # the ONLY automatic trigger for the real daily pipeline (see the
          # file header) -- a key set only in the HF Space's own secrets, or
          # only in this repo's secrets but never read here, never reaches
          # this process either way, and gamma reads UNAVAILABLE forever
          # regardless of where a key was added. Both must be set as GitHub
          # Actions repo secrets (Settings -> Secrets and variables ->
          # Actions) for GEX to compute on the automated run; Tiger is the
          # documented fallback if Alpaca is unset or fails.
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TIGER_ID: ${{ secrets.TIGER_ID }}
          TIGER_ACCOUNT: ${{ secrets.TIGER_ACCOUNT }}
          TIGER_PRIVATE_KEY: ${{ secrets.TIGER_PRIVATE_KEY }}
        run: python -m scripts.daily_backstop
