name: AQE research extract (one-off)

# Conductor 2026-11-19 / PM: component + sub-component score history for a research agent. READ-ONLY against production:
# the script works in a scratch dir (AQE_DATA_DIR/AQE_OUTPUT_DIR), restores the nightly snapshot into it, never saves a snapshot,
# and only writes new Drive files named aqe_research_* plus this run's artifact. workflow_dispatch only - no schedule.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "inventory (read-only counts, run first) | truncation (weekly-bar look-ahead test) | extract"
        type: choice
        options: [inventory, truncation, extract]
        default: inventory
      years:
        description: "extract: history window in years (max 6)"
        default: "6"
      rescore:
        description: "extract: re-run the CURRENT engines (live + shadow _v2) over the restored panel in scratch, pulling report dates first; adds the *_v2 columns"
        type: boolean
        default: false
      recompute:
        description: "extract: re-pull a longer panel and re-run the engines in scratch (use when the inventory says the stored panel is short)"
        type: boolean
        default: false

# Its own group: never queues behind or blocks the nightly (aqe-daily).
concurrency:
  group: aqe-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Research stage
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_OUT: research_out
          STAGE: ${{ inputs.stage }}
          YEARS: ${{ inputs.years }}
          RECOMPUTE: ${{ inputs.recompute }}
          RESCORE: ${{ inputs.rescore }}
        run: |
          case "$STAGE" in
            inventory) python -m scripts.research_extract inventory ;;
            truncation) python -m scripts.research_extract truncation ;;
            extract)
              ARGS=""
              [ "$RECOMPUTE" = "true" ] && ARGS="$ARGS --recompute"
              [ "$RESCORE" = "true" ] && ARGS="$ARGS --rescore"
              python -m scripts.research_extract extract --years "$YEARS" $ARGS ;;
            *) echo "unknown stage $STAGE"; exit 2 ;;
          esac
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aqe-research-${{ inputs.stage }}
          path: research_out/
          retention-days: 14
          if-no-files-found: warn
