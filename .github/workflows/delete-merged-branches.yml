name: Delete merged branches (PM order 2026-11-05; dry-run first, then the same list)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (print the list with evidence) or delete
        default: dry-run
      digest:
        description: the LIST DIGEST printed by the dry run (required for delete)
        default: ""
      names:
        description: optional comma list limiting the pass to these branches
        default: ""
      confirmed:
        description: optional comma list the PM/conductor confirmed as merged (content in main, rewritten history)
        default: ""

permissions:
  contents: write
  pull-requests: read

jobs:
  branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "delete" ]; then
            python -m scripts.delete_merged_branches delete "${{ inputs.digest }}" "${{ inputs.names }}" "${{ inputs.confirmed }}"
          else
            python -m scripts.delete_merged_branches dry-run "${{ inputs.names }}" "${{ inputs.confirmed }}"
          fi
